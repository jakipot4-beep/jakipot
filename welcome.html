<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MyChat - Welcome</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* =========================================
           1. THEME VARIABLES (LIGHT & DARK)
           ========================================= */
        :root {
            /* Light Mode (Default) */
            --bg-color: #FFFFFF;
            --primary-green: #168B50;
            --text-main: #202923;
            --text-secondary: #6C7770;
            --border-color: #E4EAE6;
            --loader-bg: #E4EAE6;
        }

        body.dark-mode {
            /* Dark Mode */
            --bg-color: #101719;
            --primary-green: #168B50;
            --text-main: #FFFFFF;
            --text-secondary: #B9C3C0;
            --border-color: #303B3D;
            --loader-bg: #303B3D;
        }

        /* =========================================
           2. GLOBAL RESET & LAYOUT
           ========================================= */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            overflow: hidden;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        .welcome-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        /* =========================================
           3. CUSTOM 'M' LOGO & ANIMATION
           ========================================= */
        .logo-wrapper {
            margin-bottom: 20px;
            animation: dropIn 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(-50px);
        }

        .logo-svg {
            width: 120px;
            height: 120px;
            filter: drop-shadow(0 10px 15px rgba(22, 139, 80, 0.2));
        }

        .brand-name {
            font-size: 32px;
            font-weight: 900;
            color: var(--text-main);
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            animation: fadeIn 0.8s ease forwards;
            animation-delay: 0.5s;
            opacity: 0;
        }

        .tagline {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 60px;
            animation: fadeIn 0.8s ease forwards;
            animation-delay: 0.8s;
            opacity: 0;
        }

        /* =========================================
           4. LOADING INDICATOR & TEXT
           ========================================= */
        .loading-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            animation: fadeIn 0.8s ease forwards;
            animation-delay: 1.2s;
            opacity: 0;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--loader-bg);
            border-top-color: var(--primary-green);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .loading-text {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .error-text {
            display: none;
            font-size: 14px;
            color: #ef4444;
            font-weight: 600;
            margin-top: 10px;
        }

        .retry-btn {
            display: none;
            margin-top: 15px;
            padding: 10px 20px;
            background: var(--primary-green);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
        }

        /* =========================================
           5. KEYFRAMES & REDUCED MOTION
           ========================================= */
        @keyframes dropIn {
            0% { opacity: 0; transform: translateY(-50px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Accessibility: Support reduced motion preferences */
        @media (prefers-reduced-motion: reduce) {
            .logo-wrapper, .brand-name, .tagline, .loading-section {
                animation: none !important;
                opacity: 1 !important;
                transform: none !important;
            }
            .spinner {
                animation: spin 2s linear infinite !important; /* Slower spin for reduced motion */
            }
        }
    </style>
</head>
<body>

    <div class="welcome-container">
        <!-- Custom SVG 'M' Logo -->
        <div class="logo-wrapper">
            <svg class="logo-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <!-- The M shape with a chat bubble aesthetic -->
                <path d="M 15 80 L 15 30 L 50 60 L 85 30 L 85 80 L 70 80 L 70 50 L 50 68 L 30 50 L 30 80 Z" fill="#168B50"/>
                <path d="M 15 80 L 15 30 L 50 60 L 85 30 L 85 80" fill="none" stroke="#168B50" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
            </svg>
        </div>

        <div class="brand-name">MyChat</div>
        <div class="tagline">Connect • Talk • Share</div>

        <div class="loading-section" id="loading-section">
            <div class="spinner" id="loading-spinner"></div>
            <div class="loading-text" id="loading-text">Preparing your conversations...</div>
        </div>

        <div class="error-text" id="error-text">Failed to initialize. Please check your connection.</div>
        <button class="retry-btn" id="retry-btn" onclick="initApp()">Retry</button>
    </div>

    <!-- Firebase 13.1.0 Initialization -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
        import { getFirestore } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBpKp2TePXAmJjc_qR-bJPCZJ123QsCyxw",
            authDomain: "jakipot.firebaseapp.com",
            projectId: "jakipot",
            storageBucket: "jakipot.firebasestorage.app",
            messagingSenderId: "396191754293",
            appId: "1:396191754293:web:5b11a11d82e773d19ee97c"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // =========================================
        // THEME MANAGER (Memory)
        // =========================================
        const THEME_KEY = 'mychat_theme';
        
        function loadTheme() {
            const savedTheme = localStorage.getItem(THEME_KEY);
            if (savedTheme === 'dark') {
                document.body.classList.add('dark-mode');
            } else {
                document.body.classList.remove('dark-mode');
            }
        }
        
        // Apply theme instantly on load
        loadTheme();

        // =========================================
        // INITIALIZATION & NAVIGATION
        // =========================================
        let authCheckTimeout;

        function initApp() {
            document.getElementById('error-text').style.display = 'none';
            document.getElementById('retry-btn').style.display = 'none';
            document.getElementById('loading-section').style.display = 'flex';

            // Set a safety timeout for initialization (5 seconds)
            authCheckTimeout = setTimeout(() => {
                showError();
            }, 5000);

            // Firebase Auth Listener
            onAuthStateChanged(auth, (user) => {
                clearTimeout(authCheckTimeout);
                
                if (user) {
                    // User is logged in, proceed to dashboard
                    // Add a tiny 1.5s artificial delay to allow the beautiful animation to be seen
                    // (You can remove this delay if you want instant navigation)
                    setTimeout(() => {
                        window.location.replace('dashboard.html');
                    }, 1500);
                } else {
                    // User is not logged in (or session expired)
                    // Redirect to the existing login page
                    window.location.replace('login.html');
                }
            });
        }

        function showError() {
            document.getElementById('loading-section').style.display = 'none';
            document.getElementById('error-text').style.display = 'block';
            document.getElementById('retry-btn').style.display = 'inline-block';
        }

        // Start the app
        initApp();

    </script>
</body>
</html>
