<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JAKIPOT - Refer & Earn</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #040b16; 
            --bg-card: #0f172a; 
            --bg-elevated: #1e293b;
            --cyan: #00D9FF; 
            --cyan-glow: rgba(0, 217, 255, 0.3);
            --emerald: #10b981; 
            --gold: #fbbf24; 
            --text-white: #ffffff; 
            --text-muted: #8b9bb4; 
            --border-light: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: var(--bg-deep); color: var(--text-white); 
            min-height: 100vh; display: flex; flex-direction: column;
            background-image: radial-gradient(circle at 50% 0%, rgba(0, 217, 255, 0.08) 0%, transparent 50%);
        }

        /* HEADER */
        .top-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 15px 20px; background: var(--bg-card); border-bottom: 1px solid var(--border-light);
            position: sticky; top: 0; z-index: 10;
        }
        .back-btn { background: transparent; border: none; cursor: pointer; color: var(--cyan); display: flex; align-items: center; padding: 4px; }
        .back-btn svg { width: 24px; height: 24px; fill: currentColor; }
        .header-title { font-size: 16px; font-weight: 900; color: var(--text-white); letter-spacing: 1.5px; text-transform: uppercase; }

        /* CONTENT */
        .content-area { flex: 1; padding: 25px 20px; overflow-y: auto; padding-bottom: 50px; display: flex; flex-direction: column; align-items: center; }
        
        /* HERO ILLUSTRATION */
        .hero-icon {
            width: 90px; height: 90px; background: rgba(0, 217, 255, 0.1); border-radius: 50%;
            display: grid; place-items: center; margin-bottom: 20px;
            border: 2px solid var(--cyan); box-shadow: 0 0 30px var(--cyan-glow);
        }
        .hero-icon svg { width: 50px; height: 50px; fill: var(--cyan); }
        
        .hero-title { font-size: 24px; font-weight: 900; text-align: center; margin-bottom: 10px; }
        .hero-sub { font-size: 14px; color: var(--text-muted); text-align: center; line-height: 1.5; max-width: 300px; margin-bottom: 30px; }

        /* REFERRAL CARDS */
        .ref-card {
            background: var(--bg-card); border: 1px solid var(--border-light);
            border-radius: 16px; padding: 20px; width: 100%; max-width: 400px;
            margin-bottom: 15px; text-align: center; position: relative;
        }
        .card-label { font-size: 12px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
        
        .code-box {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--bg-elevated); border: 1px dashed var(--cyan);
            border-radius: 12px; padding: 15px 20px;
        }
        .ref-code { font-size: 24px; font-weight: 900; color: var(--cyan); letter-spacing: 2px; }
        
        .link-box {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--bg-elevated); border: 1px solid var(--border-light);
            border-radius: 12px; padding: 15px;
        }
        .ref-link { font-size: 13px; font-weight: 600; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }

        .copy-btn {
            background: var(--cyan); color: #000; border: none; padding: 8px 16px;
            border-radius: 8px; font-size: 12px; font-weight: 900; cursor: pointer;
            transition: 0.2s;
        }
        .copy-btn:active { transform: scale(0.95); }
        .copy-btn.copied { background: var(--emerald); color: var(--white); }

        /* SOCIAL SHARE GRID */
        .share-title { font-size: 14px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; margin-top: 20px; margin-bottom: 15px; align-self: flex-start; max-width: 400px; width: 100%; padding-left: 10px;}
        
        .social-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
            width: 100%; max-width: 400px;
        }

        .social-btn {
            background: var(--bg-card); border: 1px solid var(--border-light);
            border-radius: 16px; padding: 20px 10px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 10px;
            cursor: pointer; transition: 0.2s; text-decoration: none;
        }
        .social-btn:active { transform: scale(0.95); }
        .social-btn svg { width: 32px; height: 32px; }
        .social-name { font-size: 11px; font-weight: 800; color: var(--text-white); }

        /* Specific Brand Colors on Hover/Active */
        .social-btn.whatsapp:hover { border-color: #25D366; box-shadow: 0 0 15px rgba(37, 211, 102, 0.2); }
        .social-btn.facebook:hover { border-color: #1877F2; box-shadow: 0 0 15px rgba(24, 119, 242, 0.2); }
        .social-btn.tiktok:hover { border-color: #ff0050; box-shadow: 0 0 15px rgba(255, 0, 80, 0.2); }
        .social-btn.instagram:hover { border-color: #E1306C; box-shadow: 0 0 15px rgba(225, 48, 108, 0.2); }
        .social-btn.youtube:hover { border-color: #FF0000; box-shadow: 0 0 15px rgba(255, 0, 0, 0.2); }
        .social-btn.telegram:hover { border-color: #0088cc; box-shadow: 0 0 15px rgba(0, 136, 204, 0.2); }

        /* Toast Alert */
        .toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: var(--emerald); color: var(--white); padding: 12px 24px;
            border-radius: 30px; font-size: 14px; font-weight: 800;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4); z-index: 1000;
            opacity: 0; transition: opacity 0.3s, transform 0.3s; pointer-events: none;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(-10px); }

    </style>
</head>
<body>

    <header class="top-header">
        <button class="back-btn" onclick="window.location.href='home.html'">
            <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </button>
        <div class="header-title">Refer & Earn</div>
        <div style="width: 24px;"></div>
    </header>

    <main class="content-area">
        
        <div class="hero-icon">
            <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
        </div>

        <div class="hero-title">Invite Friends</div>
        <div class="hero-sub">Share your link with friends. When they register and activate their account, you earn a bonus!</div>

        <!-- Referral Code Card -->
        <div class="ref-card">
            <div class="card-label">Your Referral Code</div>
            <div class="code-box">
                <div class="ref-code" id="ref-code-display">Loading...</div>
                <button class="copy-btn" id="copy-code-btn" onclick="copyText('ref-code-display', 'copy-code-btn')">COPY</button>
            </div>
        </div>

        <!-- Referral Link Card -->
        <div class="ref-card">
            <div class="card-label">Your Invite Link</div>
            <div class="link-box">
                <div class="ref-link" id="ref-link-display">https://...</div>
                <button class="copy-btn" id="copy-link-btn" onclick="copyText('ref-link-display', 'copy-link-btn')">COPY</button>
            </div>
        </div>

        <div class="share-title">Share via Social Media</div>
        
        <div class="social-grid">
            <!-- WhatsApp -->
            <div class="social-btn whatsapp" onclick="shareSocial('whatsapp')">
                <svg viewBox="0 0 24 24" fill="#25D366"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
                <div class="social-name">WhatsApp</div>
            </div>

            <!-- Facebook -->
            <div class="social-btn facebook" onclick="shareSocial('facebook')">
                <svg viewBox="0 0 24 24" fill="#1877F2"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
                <div class="social-name">Facebook</div>
            </div>

            <!-- TikTok -->
            <div class="social-btn tiktok" onclick="shareSocial('tiktok')">
                <svg viewBox="0 0 24 24" fill="#000000"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/></svg>
                <div class="social-name">TikTok</div>
            </div>

            <!-- Instagram -->
            <div class="social-btn instagram" onclick="shareSocial('instagram')">
                <svg viewBox="0 0 24 24" fill="#E1306C"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg>
                <div class="social-name">Instagram</div>
            </div>

            <!-- YouTube -->
            <div class="social-btn youtube" onclick="shareSocial('youtube')">
                <svg viewBox="0 0 24 24" fill="#FF0000"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
                <div class="social-name">YouTube</div>
            </div>

            <!-- Telegram -->
            <div class="social-btn telegram" onclick="shareSocial('telegram')">
                <svg viewBox="0 0 24 24" fill="#0088cc"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>
                <div class="social-name">Telegram</div>
            </div>
        </div>

    </main>

    <div id="toast" class="toast">Link Copied!</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyBpKp2TePXAmJjc_qR-bJPCZJ123QsCyxw", 
            authDomain: "jakipot.firebaseapp.com", 
            projectId: "jakipot", 
            storageBucket: "jakipot.firebasestorage.app", 
            messagingSenderId: "396191754293", 
            appId: "1:396191754293:web:5b11a11d82e773d19ee97c" 
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let referralCode = "";
        let referralLink = "";
        const baseUrl = window.location.origin + window.location.pathname.replace('referral.html', 'register.html');

        onAuthStateChanged(auth, async (user) => {
            if (!user) { 
                window.location.replace('login.html'); 
                return; 
            }
            currentUser = user;

            try {
                const userRef = doc(db, 'users', user.uid);
                const userSnap = await getDoc(userRef);

                if (userSnap.exists()) {
                    const data = userSnap.data();
                    
                    if (data.myReferralCode) {
                        referralCode = data.myReferralCode;
                    } else {
                        // Fallback: Generate code if it doesn't exist
                        referralCode = "JKP-" + Math.random().toString(36).substring(2, 8).toUpperCase();
                        await updateDoc(userRef, { myReferralCode: referralCode });
                    }

                    // Build the link
                    referralLink = `${baseUrl}?ref=${referralCode}`;
                    
                    // Update UI
                    document.getElementById('ref-code-display').innerText = referralCode;
                    document.getElementById('ref-link-display').innerText = referralLink;
                }
            } catch (e) {
                console.error("Error fetching referral code:", e);
            }
        });

        // 1. Copy to Clipboard Logic
        window.copyText = (elementId, btnId) => {
            const textToCopy = document.getElementById(elementId).innerText;
            const btn = document.getElementById(btnId);

            if (!textToCopy || textToCopy.includes('Loading') || textToCopy.includes('http')) {
                if (elementId === 'ref-link-display' && textToCopy.startsWith('http')) {
                    // It's a valid link, allow copy
                } else {
                    return; // Don't copy placeholder text
                }
            }

            navigator.clipboard.writeText(textToCopy).then(() => {
                const originalText = btn.innerText;
                btn.innerText = "COPIED ✓";
                btn.classList.add('copied');
                
                showToast("Copied to clipboard!");

                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.classList.remove('copied');
                }, 2000);
            });
        };

        // 2. Social Share Logic
        window.shareSocial = (platform) => {
            if (!referralLink) return;

            const message = `Join me on JAKIPOT! Use my link to register and start earning: ${referralLink}`;
            const encodedMsg = encodeURIComponent(message);
            const encodedLink = encodeURIComponent(referralLink);

            if (platform === 'whatsapp') {
                window.open(`https://wa.me/?text=${encodedMsg}`, '_blank');
            } 
            else if (platform === 'facebook') {
                window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodedLink}`, '_blank');
            } 
            else if (platform === 'telegram') {
                window.open(`https://t.me/share/url?url=${encodedLink}&text=${encodeURIComponent("Join me on JAKIPOT!")}`, '_blank');
            } 
            else if (platform === 'instagram' || platform === 'tiktok' || platform === 'youtube') {
                // These platforms don't allow direct URL sharing via web intent.
                // We copy the link and tell the user to paste it.
                navigator.clipboard.writeText(referralLink).then(() => {
                    showToast(`Link copied! Paste it in your ${platform} bio/story.`);
                });
            }
        };

        // 3. Toast Notification
        let toastTimeout;
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>
