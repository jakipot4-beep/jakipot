<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JAKIPOT International - Global Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #09090b;       
            --bg-surface: #18181b;    
            --bg-elevated: #27272a;   
            --text-primary: #ffffff;   
            --text-secondary: #a1a1aa; 
            --border-light: rgba(255, 255, 255, 0.08);
            --chat-sent: #3f3f46;      
            --chat-received: #27272a;  
            --danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: var(--bg-deep); color: var(--text-primary); 
            height: 100vh; display: flex; flex-direction: column; overflow: hidden; 
        }

        .chat-header {
            display: flex; align-items: center; gap: 15px; padding: 12px 20px;
            background: var(--bg-surface); border-bottom: 1px solid var(--border-light); height: 70px; z-index: 10;
        }
        .back-btn {
            background: transparent; border: none; cursor: pointer;
            width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center;
            transition: background 0.2s;
        }
        .back-btn:hover { background: rgba(255,255,255,0.05); }
        .back-btn svg { width: 24px; height: 24px; fill: var(--text-primary); }
        
        .chat-title-area { flex: 1; display: flex; align-items: center; gap: 12px; }
        
        .chat-avatar-header {
            width: 42px; height: 42px; border-radius: 50%; 
            background: var(--bg-elevated); color: var(--text-primary);
            display: grid; place-items: center; font-weight: 900; font-size: 16px; overflow: hidden;
            border: 1px solid var(--border-light);
        }
        .chat-avatar-header img { width: 100%; height: 100%; object-fit: cover; }
        .chat-title-text h3 { font-size: 16px; font-weight: 800; color: var(--text-primary); margin-bottom: 2px; }
        .chat-title-text p { font-size: 12px; color: var(--text-secondary); font-weight: 500; }

        #chat-screen { flex: 1; display: flex; flex-direction: column; height: calc(100vh - 70px); }
        
        .messages-container {
            flex: 1; overflow-y: auto; padding: 20px;
            display: flex; flex-direction: column; gap: 15px;
            background-image: 
                linear-gradient(rgba(9, 9, 11, 0.9), rgba(9, 9, 11, 0.9)), 
                url('https://images.unsplash.com/photo-1550684848-fac1c5b4e853?q=80&w=1000&auto=format&fit=crop');
            background-size: cover; background-position: center; background-attachment: fixed;
        }

        .message-row { display: flex; gap: 10px; align-items: flex-end; max-width: 85%; }
        .message-row.sent { align-self: flex-end; justify-content: flex-end; }
        .message-row.received { align-self: flex-start; justify-content: flex-start; }
        
        .message-avatar {
            width: 32px; height: 32px; border-radius: 50%; background: var(--bg-elevated);
            display: grid; place-items: center; font-weight: 800; font-size: 14px; color: var(--text-primary);
            overflow: hidden; flex-shrink: 0; border: 1px solid var(--border-light);
        }
        .message-avatar img { width: 100%; height: 100%; object-fit: cover; }

        .message-bubble { display: flex; flex-direction: column; }
        .message-row.sent .message-bubble { align-items: flex-end; }
        .message-row.received .message-bubble { align-items: flex-start; }
        
        .message-sender { 
            font-size: 11px; color: var(--text-secondary); 
            margin-bottom: 4px; margin-left: 4px; font-weight: 700; 
            display: flex; align-items: center; gap: 4px; 
        }
        .message-sender svg { width: 12px; height: 12px; fill: var(--gold, #fbbf24); }
        
        .message-text {
            padding: 12px 16px; font-size: 15px; line-height: 1.4;
            word-wrap: break-word; color: var(--text-primary);
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        
        .message-row.sent .message-text { background: var(--chat-sent); border-radius: 18px 18px 0 18px; }
        .message-row.received .message-text { background: var(--chat-received); border-radius: 18px 18px 18px 0; }
        
        .message-image { max-width: 100%; border-radius: 12px; margin-top: 5px; border: 1px solid var(--border-light); }
        .message-audio { width: 220px; margin-top: 5px; outline: none; border-radius: 20px; }
        .message-time { font-size: 10px; color: #71717a; margin-top: 4px; margin-right: 4px; margin-left: 4px; }

        .admin-actions { display: none; gap: 8px; margin-top: 6px; }
        .admin-actions button {
            background: rgba(239, 68, 68, 0.1); border: 1px solid var(--danger);
            color: var(--danger); font-size: 10px; font-weight: 800; padding: 5px 10px;
            border-radius: 8px; cursor: pointer; transition: 0.2s;
            display: flex; align-items: center; gap: 4px;
        }
        .admin-actions button svg { width: 11px; height: 11px; fill: var(--danger); }
        .admin-actions button:hover { background: var(--danger); color: #ffffff; }
        .admin-actions button:hover svg { fill: #ffffff; }
        body.is-admin .message-row.received:hover .admin-actions { display: flex; }

        .chat-input-area {
            padding: 12px 15px; background: var(--bg-surface); border-top: 1px solid var(--border-light);
            display: flex; align-items: center; gap: 8px; padding-bottom: max(12px, env(safe-area-inset-bottom));
            z-index: 10;
        }
        
        .chat-input {
            flex: 1; background: var(--bg-elevated); border: 1px solid var(--border-light);
            border-radius: 24px; padding: 14px 18px; color: var(--text-primary); font-size: 15px; 
            outline: none; transition: border-color 0.2s;
        }
        .chat-input:focus { border-color: var(--text-secondary); }
        
        .action-btn {
            width: 46px; height: 46px; border-radius: 50%; border: none; 
            display: grid; place-items: center; cursor: pointer; flex-shrink: 0;
            transition: transform 0.2s, background 0.2s;
        }
        .action-btn:active { transform: scale(0.95); }
        
        .attach-btn, .mic-btn { background: var(--bg-elevated); border: 1px solid var(--border-light); }
        .attach-btn svg, .mic-btn svg { width: 22px; height: 22px; fill: var(--text-secondary); }
        
        .send-btn { background: #ffffff; }
        .send-btn svg { width: 20px; height: 20px; fill: #09090b; }
        
        .mic-btn.recording { background: var(--danger); animation: pulse 1s infinite; }
        .mic-btn.recording svg { fill: #ffffff; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

        .suspended-overlay {
            position: fixed; inset: 0; background: rgba(9, 9, 11, 0.98); z-index: 999;
            display: none; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; padding: 20px; backdrop-filter: blur(10px);
        }
        .suspended-overlay.active { display: flex; }
        .suspended-icon-wrap { 
            width: 100px; height: 100px; border-radius: 50%;
            background: rgba(239, 68, 68, 0.1); border: 2px solid var(--danger);
            display: grid; place-items: center; margin-bottom: 25px;
            box-shadow: 0 0 40px rgba(239, 68, 68, 0.3);
        }
        .suspended-icon-wrap svg { width: 50px; height: 50px; fill: var(--danger); }
        .suspended-title { font-size: 24px; font-weight: 900; color: var(--danger); margin-bottom: 10px; }
        .suspended-text { font-size: 14px; color: var(--text-secondary); line-height: 1.5; max-width: 300px; }

        /* Empty State */
        .empty-state {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 40px 20px; color: var(--text-secondary);
        }
        .empty-state svg { width: 60px; height: 60px; fill: var(--text-secondary); opacity: 0.5; margin-bottom: 15px; }
        .empty-state p { font-size: 14px; font-weight: 600; }
    </style>
</head>
<body>

    <div class="suspended-overlay" id="suspended-overlay">
        <div class="suspended-icon-wrap">
            <!-- Custom SVG: Ban Icon -->
            <svg viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zM4 12c0-4.42 3.58-8 8-8 1.85 0 3.55.63 4.9 1.69L5.69 16.9C4.63 15.55 4 13.85 4 12zm8 8c-1.85 0-3.55-.63-4.9-1.69L18.31 7.1C19.37 8.45 20 10.15 20 12c0 4.42-3.58 8-8 8z"/>
            </svg>
        </div>
        <div class="suspended-title">Account Suspended</div>
        <div class="suspended-text">Your account has been suspended by the administrator. You cannot participate in the global chat. Please contact support.</div>
    </div>

    <header class="chat-header">
        <button class="back-btn" onclick="window.location.href='chat-rooms.html'">
            <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </button>
        
        <div class="chat-title-area">
            <div class="chat-avatar-header">
                <img src="https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=200&auto=format&fit=crop" alt="Global">
            </div>
            <div class="chat-title-text">
                <h3>JAKIPOT International</h3>
                <p>Global Community</p>
            </div>
        </div>
    </header>

    <section id="chat-screen">
        <div class="messages-container" id="messages-container">
            <!-- Messages load here -->
        </div>
        
        <div class="chat-input-area">
            <button class="action-btn attach-btn" onclick="document.getElementById('image-upload').click()">
                <svg viewBox="0 0 24 24"><path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z"/></svg>
            </button>
            <input type="file" id="image-upload" accept="image/*" hidden onchange="uploadImage(this)">
            
            <input type="text" id="chat-input" class="chat-input" placeholder="Message the community..." onkeypress="handleEnter(event)">
            
            <button class="action-btn mic-btn" id="mic-btn" onclick="toggleRecording()">
                <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
            </button>
            
            <button class="action-btn send-btn" onclick="sendMessage()">
                <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            </button>
        </div>
    </section>

    <script type="module">
        // LOCKED TO 13.1.0
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
        import { getFirestore, collection, doc, getDoc, setDoc, addDoc, deleteDoc, query, where, orderBy, limit, onSnapshot, serverTimestamp, writeBatch } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBpKp2TePXAmJjc_qR-bJPCZJ123QsCyxw",
            authDomain: "jakipot.firebaseapp.com",
            projectId: "jakipot",
            storageBucket: "jakipot.firebasestorage.app",
            messagingSenderId: "396191754293",
            appId: "1:396191754293:web:5b11a11d82e773d19ee97c",
            measurementId: "G-L1CLB5TDHV"
        };

        const CLOUDINARY = { cloudName: 'c2n8j0v', uploadPreset: 'doravica_unsigned' };
        const MAX_FILE_SIZE = 5 * 1024 * 1024;

        // Custom SVG Definitions
        const SVG_CROWN = `<svg viewBox="0 0 24 24"><path d="M5 16L3 5l5.5 5L12 4l3.5 6L21 5l-2 11H5zm14 3c0 .6-.4 1-1 1H6c-.6 0-1-.4-1-1v-1h14v1z"/></svg>`;
        const SVG_TRASH = `<svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>`;
        const SVG_BAN = `<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zM4 12c0-4.42 3.58-8 8-8 1.85 0 3.55.63 4.9 1.69L5.69 16.9C4.63 15.55 4 13.85 4 12zm8 8c-1.85 0-3.55-.63-4.9-1.69L18.31 7.1C19.37 8.45 20 10.15 20 12c0 4.42-3.58 8-8 8z"/></svg>`;
        const SVG_CHAT = `<svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/></svg>`;

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const ROOM_ID = 'global_chat';
        let currentUser = null;
        let currentUserData = null;
        let isAdmin = false;
        
        const userCache = {};
        
        let messageCount = 0;
        let lastMessageTime = 0;
        let mediaRecorder, audioChunks = [], isRecording = false;

        async function logSecurityEvent(event, details = {}) {
            try {
                await addDoc(collection(db, 'security_logs'), {
                    event: event,
                    uid: currentUser?.uid || 'unknown',
                    page: 'global-chat.html',
                    timestamp: serverTimestamp(),
                    ...details
                });
            } catch (e) { console.warn('Guardian log failed', e); }
        }

        async function ensureChatMembership() {
            if (!currentUser) return;
            try {
                const memberRef = doc(db, 'chat_group_members', `${currentUser.uid}_${ROOM_ID}`);
                const snap = await getDoc(memberRef);
                if (!snap.exists()) {
                    await setDoc(memberRef, {
                        uid: currentUser.uid,
                        groupId: ROOM_ID,
                        joinedAt: serverTimestamp()
                    });
                }
            } catch (e) {
                console.warn('Could not create chat membership', e);
            }
        }

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.replace('login.html'); return; }
            currentUser = user;

            await ensureChatMembership();

            onSnapshot(collection(db, 'users'), (snapshot) => {
                snapshot.forEach(doc => {
                    userCache[doc.id] = doc.data();
                });
            });

            const userDoc = await getDoc(doc(db, 'users', user.uid));
            if (userDoc.exists()) {
                currentUserData = userDoc.data();
                
                if (currentUserData.status === 'suspended') {
                    document.getElementById('suspended-overlay').classList.add('active');
                    document.querySelector('.chat-input-area').style.display = 'none';
                    return;
                }

                if (currentUserData.role === 'admin') {
                    isAdmin = true;
                    document.body.classList.add('is-admin');
                }
            }

            loadMessages();
        });

        function loadMessages() {
            const container = document.getElementById('messages-container');
            const q = query(
                collection(db, 'chat_messages'),
                where('groupId', '==', ROOM_ID),
                orderBy('timestamp', 'asc'),
                limit(100)
            );

            onSnapshot(q, (snapshot) => {
                container.innerHTML = '';
                if (snapshot.empty) {
                    container.innerHTML = `
                        <div class="empty-state">
                            ${SVG_CHAT}
                            <p>Welcome to the International Group!<br>Say hello to the community.</p>
                        </div>
                    `;
                    return;
                }

                snapshot.forEach(docSnap => {
                    const msg = docSnap.data();
                    const msgId = docSnap.id;
                    const isSent = msg.uid === currentUser.uid;
                    const timeStr = msg.timestamp ? new Date(msg.timestamp.toMillis()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
                    
                    const senderProfile = userCache[msg.uid] || {};
                    const senderAvatarUrl = senderProfile.profilePicUrl;
                    const avatarHtml = senderAvatarUrl 
                        ? `<img src="${senderAvatarUrl}">` 
                        : (msg.senderName ? msg.senderName.charAt(0).toUpperCase() : '?');

                    let contentHtml = '';
                    if (msg.messageType === 'image') {
                        contentHtml = `<img src="${msg.imageUrl}" class="message-image">`;
                    } else if (msg.messageType === 'voice') {
                        contentHtml = `<audio controls src="${msg.voiceNoteUrl}" class="message-audio"></audio>`;
                    } else {
                        contentHtml = `<div class="message-text">${msg.textContent}</div>`;
                    }

                    let adminHtml = '';
                    if (isAdmin && !isSent) {
                        adminHtml = `
                            <div class="admin-actions">
                                <button onclick="adminDeleteMessage('${msgId}')">${SVG_TRASH} Delete</button>
                                <button onclick="adminKickUser('${msg.uid}', '${msg.senderName}')">${SVG_BAN} Kick</button>
                            </div>
                        `;
                    }

                    const avatarBlock = !isSent ? `<div class="message-avatar">${avatarHtml}</div>` : '';
                    const crownHtml = msg.isAdmin ? SVG_CROWN : '';

                    container.innerHTML += `
                        <div class="message-row ${isSent ? 'sent' : 'received'}">
                            ${avatarBlock}
                            <div class="message-bubble">
                                ${!isSent ? `<div class="message-sender">${msg.senderName} ${crownHtml}</div>` : ''}
                                ${contentHtml}
                                <div class="message-time">${timeStr}</div>
                                ${adminHtml}
                            </div>
                        </div>
                    `;
                });
                container.scrollTop = container.scrollHeight;
            });
        }

        window.sendMessage = async () => {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;

            const now = Date.now();
            if (now - lastMessageTime < 5000) {
                messageCount++;
                if (messageCount > 3) {
                    logSecurityEvent('GLOBAL_CHAT_SPAM_DETECTED', { message: text.substring(0, 20) });
                    alert('Slow down! You are sending messages too fast.');
                    return;
                }
            } else {
                messageCount = 1;
                lastMessageTime = now;
            }

            input.value = '';

            try {
                await addDoc(collection(db, 'chat_messages'), {
                    groupId: ROOM_ID,
                    uid: currentUser.uid,
                    senderName: currentUserData?.fullName || 'User',
                    isAdmin: isAdmin,
                    messageType: 'text',
                    textContent: text,
                    timestamp: serverTimestamp()
                });
            } catch (err) {
                console.error(err);
                logSecurityEvent('global_chat_send_failed', { reason: err.message });
                alert("Message failed to send. Please try again.");
            }
        };

        window.handleEnter = (e) => { if (e.key === 'Enter') sendMessage(); };

        window.adminDeleteMessage = async (msgId) => {
            if (!isAdmin) return;
            if (confirm('Delete this message permanently?')) {
                await deleteDoc(doc(db, 'chat_messages', msgId));
            }
        };

        window.adminKickUser = async (uid, name) => {
            if (!isAdmin) return;
            if (confirm(`Kick ${name} from the global chat? This will suspend their account.`)) {
                try {
                    const batch = writeBatch(db);
                    
                    const banRef = doc(db, 'banned_users', uid);
                    batch.set(banRef, {
                        uid: uid,
                        bannedBy: currentUser.uid,
                        reason: 'Kicked from Global Chat',
                        timestamp: serverTimestamp()
                    });

                    const userRef = doc(db, 'users', uid);
                    batch.update(userRef, { status: 'suspended' });

                    await batch.commit();
                    alert(`${name} has been kicked and suspended.`);
                } catch (err) {
                    console.error(err);
                    alert("Failed to kick user.");
                }
            }
        };

        window.uploadImage = async (input) => {
            const file = input.files[0];
            if (!file) return;

            if (file.size > MAX_FILE_SIZE) {
                alert("Image is too large. Maximum size is 5MB.");
                logSecurityEvent('global_chat_large_file', { type: 'image', size: file.size });
                input.value = '';
                return;
            }
            
            const container = document.getElementById('messages-container');
            container.innerHTML += `<div class="message-bubble sent" style="align-self:flex-end;"><div class="message-text" style="font-style:italic; opacity:0.7;">Uploading image...</div></div>`;
            container.scrollTop = container.scrollHeight;

            try {
                const formData = new FormData();
                formData.append('file', file);
                formData.append('upload_preset', CLOUDINARY.uploadPreset);

                const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY.cloudName}/image/upload`, {
                    method: 'POST', body: formData
                });
                const data = await res.json();

                if (data.secure_url) {
                    await addDoc(collection(db, 'chat_messages'), {
                        groupId: ROOM_ID,
                        uid: currentUser.uid,
                        senderName: currentUserData?.fullName || 'User',
                        isAdmin: isAdmin,
                        messageType: 'image',
                        imageUrl: data.secure_url,
                        timestamp: serverTimestamp()
                    });
                }
            } catch (err) {
                alert('Image upload failed');
            }
            input.value = '';
        };

        window.toggleRecording = async () => {
            if (isRecording) {
                mediaRecorder.stop();
                isRecording = false;
                document.getElementById('mic-btn').classList.remove('recording');
                return;
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
                
                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    
                    if (audioBlob.size > MAX_FILE_SIZE) {
                        alert("Voice note too long. Please record a shorter message.");
                        logSecurityEvent('global_chat_large_file', { type: 'voice', size: audioBlob.size });
                        return;
                    }

                    const file = new File([audioBlob], "voice.webm", { type: 'audio/webm' });

                    const container = document.getElementById('messages-container');
                    container.innerHTML += `<div class="message-bubble sent" style="align-self:flex-end;"><div class="message-text" style="font-style:italic; opacity:0.7;">Uploading voice note...</div></div>`;
                    container.scrollTop = container.scrollHeight;

                    try {
                        const formData = new FormData();
                        formData.append('file', file);
                        formData.append('upload_preset', CLOUDINARY.uploadPreset);

                        const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY.cloudName}/video/upload`, {
                            method: 'POST', body: formData
                        });
                        const data = await res.json();

                        if (data.secure_url) {
                            await addDoc(collection(db, 'chat_messages'), {
                                groupId: ROOM_ID,
                                uid: currentUser.uid,
                                senderName: currentUserData?.fullName || 'User',
                                isAdmin: isAdmin,
                                messageType: 'voice',
                                voiceNoteUrl: data.secure_url,
                                timestamp: serverTimestamp()
                            });
                        }
                    } catch (err) {
                        alert('Voice note upload failed');
                    }
                };

                mediaRecorder.start();
                isRecording = true;
                document.getElementById('mic-btn').classList.add('recording');
            } catch (err) {
                alert('Microphone access denied.');
            }
        };
    </script>
</body>
</html>
