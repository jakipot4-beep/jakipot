<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JAKIPOT - Fruit Slots 777</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #040b16;
            --bg-panel: #0f172a;
            --cyan: #00D9FF;
            --cyan-glow: rgba(0, 217, 255, 0.3);
            --gold: #fbbf24;
            --gold-glow: rgba(251, 191, 36, 0.5);
            --emerald: #10b981;
            --text-white: #ffffff;
            --text-muted: #8b9bb4;
            --border-light: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: var(--bg-deep); color: var(--text-white); 
            height: 100vh; display: flex; flex-direction: column; 
            overflow: hidden; align-items: center; justify-content: center;
            background-image: radial-gradient(circle at 50% 50%, rgba(0, 217, 255, 0.05) 0%, transparent 60%);
        }

        /* --- LOADER OVERLAY --- */
        #loader-overlay {
            position: fixed; inset: 0; z-index: 99999;
            background: rgba(4, 11, 22, 0.95);
            backdrop-filter: blur(15px);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 0.6s ease;
        }
        #loader-overlay.hidden { opacity: 0; pointer-events: none; }
        
        .loader-wheel {
            width: 80px; height: 80px; border-radius: 50%;
            border: 4px solid rgba(0, 217, 255, 0.2);
            border-top: 4px solid var(--gold);
            border-bottom: 4px solid var(--cyan);
            animation: spinLoader 1.2s linear infinite;
            box-shadow: 0 0 30px var(--gold-glow);
            margin-bottom: 25px;
        }
        @keyframes spinLoader { 100% { transform: rotate(360deg); } }

        .loader-title {
            font-size: 20px; font-weight: 900; color: var(--gold);
            letter-spacing: 3px; text-transform: uppercase;
            text-shadow: 0 0 15px var(--gold-glow);
            margin-bottom: 10px;
        }
        .loader-bar-bg {
            width: 200px; height: 6px; background: rgba(255,255,255,0.1);
            border-radius: 10px; overflow: hidden; position: relative;
        }
        .loader-bar-fill {
            height: 100%; width: 0%; background: var(--cyan);
            box-shadow: 0 0 10px var(--cyan); transition: width 0.3s ease;
        }

        .top-header {
            position: absolute; top: 0; left: 0; width: 100%;
            display: flex; align-items: center; justify-content: space-between;
            padding: 15px 20px; background: rgba(10, 25, 47, 0.8); backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-light); z-index: 10;
        }
        .back-btn { background: transparent; border: none; cursor: pointer; color: var(--cyan); display: flex; align-items: center; padding: 4px; }
        .back-btn svg { width: 24px; height: 24px; fill: currentColor; }
        .header-title { font-size: 16px; font-weight: 900; color: var(--text-white); letter-spacing: 1.5px; text-transform: uppercase; text-shadow: 0 0 10px var(--cyan-glow); }
        
        .header-right { display: flex; align-items: center; gap: 10px; }
        
        .mute-btn { 
            background: transparent; border: none; cursor: pointer; 
            display: flex; align-items: center; justify-content: center;
            width: 32px; height: 32px; border-radius: 50%;
            background: rgba(255,255,255,0.05); transition: 0.2s;
        }
        .mute-btn:active { transform: scale(0.9); }
        .mute-btn svg { width: 18px; height: 18px; fill: var(--text-muted); transition: fill 0.2s; }
        .mute-btn:hover svg { fill: var(--white); }

        .wallet-balance { font-size: 14px; font-weight: 800; color: var(--gold); background: rgba(251, 191, 36, 0.1); padding: 6px 12px; border-radius: 20px; border: 1px solid rgba(251,191,36,0.3); }

        .game-container {
            display: flex; flex-direction: column; align-items: center; 
            width: 100%; max-width: 400px; margin-top: 40px;
        }

        .slot-machine {
            display: flex; gap: 8px; padding: 15px;
            background: var(--bg-panel); border-radius: 20px;
            border: 4px solid #1e293b; box-shadow: 0 0 40px rgba(0,0,0,0.8);
            position: relative;
        }

        .reel-column {
            width: 90px; height: 270px; 
            background: #000; border-radius: 10px; overflow: hidden;
            position: relative; box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }

        .reel-strip { position: absolute; top: 0; left: 0; width: 100%; display: flex; flex-direction: column; }

        .reel-item {
            height: 90px; display: flex; justify-content: center; align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        
        .reel-item svg { width: 65px; height: 65px; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.6)); }

        .payline-overlay {
            position: absolute; top: 50%; left: 0; width: 100%; height: 90px;
            transform: translateY(-50%);
            border-top: 2px solid var(--cyan); border-bottom: 2px solid var(--cyan);
            background: rgba(0, 217, 255, 0.1); z-index: 5; pointer-events: none;
            box-shadow: 0 0 15px var(--cyan-glow);
        }

        .jackpot-info {
            width: 100%; max-width: 280px; margin-top: 15px;
            display: flex; flex-direction: column; align-items: center; gap: 4px;
        }
        .jackpot-text {
            font-size: 14px; font-weight: 800; color: var(--gold);
            text-shadow: 0 0 10px var(--gold-glow); text-align: center;
            transition: color 0.3s;
        }

        .bet-controls {
            display: flex; align-items: center; justify-content: space-between;
            width: 100%; max-width: 280px; margin-top: 15px;
            background: var(--bg-panel); padding: 8px; border-radius: 12px;
            border: 1px solid var(--border-light);
        }
        .adj-btn { background: transparent; border: none; color: var(--cyan); font-size: 24px; font-weight: 900; width: 50px; height: 40px; cursor: pointer; }
        .bet-display { display: flex; align-items: center; gap: 5px; }
        .currency-symbol { font-size: 16px; color: var(--text-muted); font-weight: 800; }
        .bet-input { background: transparent; border: none; color: var(--white); font-size: 22px; font-weight: 900; width: 80px; text-align: center; outline: none; }
        
        .quick-bets { display: flex; gap: 8px; width: 100%; max-width: 280px; margin-top: 10px; }
        .q-btn { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid var(--border-light); color: var(--text-muted); padding: 8px 0; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .q-btn.active { background: rgba(0, 217, 255, 0.1); color: var(--cyan); border-color: var(--cyan); }

        .spin-btn {
            margin-top: 15px; padding: 18px 60px; border-radius: 50px;
            border: none; background: linear-gradient(90deg, #f59e0b, #fbbf24);
            color: #000; font-size: 20px; font-weight: 900; text-transform: uppercase;
            letter-spacing: 2px; cursor: pointer; transition: 0.2s;
            box-shadow: 0 4px 20px var(--gold-glow);
        }
        .spin-btn:active { transform: scale(0.95); }
        .spin-btn:disabled { background: #334155; color: var(--text-muted); box-shadow: none; cursor: not-allowed; }

        /* SMALL WIN MODAL */
        .result-overlay {
            position: fixed; inset: 0; background: rgba(4, 11, 22, 0.9);
            backdrop-filter: blur(10px); display: none; justify-content: center; align-items: center;
            z-index: 100; opacity: 0; transition: opacity 0.3s;
        }
        .result-overlay.active { display: flex; opacity: 1; }

        .result-card {
            background: var(--bg-panel); border: 2px solid var(--gold);
            border-radius: 24px; padding: 30px; text-align: center;
            box-shadow: 0 0 50px var(--gold-glow); max-width: 350px; width: 90%;
            transform: scale(0.8); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .result-overlay.active .result-card { transform: scale(1); }

        .result-title { font-size: 24px; font-weight: 900; color: var(--gold); text-transform: uppercase; margin-bottom: 10px; }
        .result-icon { margin-bottom: 15px; display: flex; justify-content: center; }
        .result-icon svg { width: 80px; height: 80px; }
        .result-msg { font-size: 15px; color: var(--text-muted); margin-bottom: 20px; }
        
        .btn-close-modal {
            width: 100%; padding: 14px; border-radius: 10px; border: none;
            background: var(--gold); color: #000; font-size: 16px; font-weight: 900;
            cursor: pointer; text-transform: uppercase;
        }

        /* BIG WIN ANIMATION OVERLAY */
        .big-win-overlay {
            position: fixed; inset: 0; background: rgba(0, 0, 0, 0.95);
            z-index: 1000; display: none; flex-direction: column;
            justify-content: center; align-items: center;
            background-image: radial-gradient(circle at center, rgba(251,191,36,0.2) 0%, transparent 70%);
        }
        .big-win-overlay.active { display: flex; animation: fadeIn 0.5s; }
        
        .big-win-title { 
            font-size: 40px; font-weight: 900; color: #fff; 
            text-transform: uppercase; letter-spacing: 4px;
            text-shadow: 0 0 20px var(--gold), 0 0 40px var(--gold);
            margin-bottom: 20px; animation: pulse-text 1s infinite alternate;
        }
        
        .big-win-amount {
            font-size: 70px; font-weight: 900; color: var(--gold);
            text-shadow: 0 0 30px var(--gold-glow); margin-bottom: 30px;
            font-variant-numeric: tabular-nums;
        }

        .btn-collect-big {
            padding: 18px 60px; border-radius: 50px; border: none;
            background: linear-gradient(90deg, #10b981, #059669); color: #fff;
            font-size: 20px; font-weight: 900; text-transform: uppercase;
            cursor: pointer; box-shadow: 0 0 20px rgba(16,185,129,0.6);
            animation: bounce 1s infinite alternate;
        }
        .btn-collect-big:active { transform: scale(0.95); }

        @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-10px); } }
        @keyframes pulse-text { from { transform: scale(1); } to { transform: scale(1.05); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        #jackpot-flash { position: fixed; inset: 0; background: white; z-index: 99; display: none; opacity: 0; }
        .jackpot-mode .result-card { border-color: #ef4444; box-shadow: 0 0 80px #ef4444; }
        .jackpot-mode .result-title { color: #ef4444; text-shadow: 0 0 20px #ef4444; font-size: 36px; }
        .jackpot-mode .btn-close-modal { background: #ef4444; color: white; }
    </style>
</head>
<body>

    <!-- LOADER OVERLAY -->
    <div id="loader-overlay">
        <div class="loader-wheel"></div>
        <div class="loader-title">Loading Game</div>
        <div class="loader-bar-bg">
            <div class="loader-bar-fill" id="loader-bar"></div>
        </div>
    </div>

    <header class="top-header">
        <button class="back-btn" onclick="window.location.href='home.html'">
            <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </button>
        <div class="header-title">Fruit 777</div>
        
        <div class="header-right">
            <button class="mute-btn" id="mute-btn" onclick="toggleMute()"></button>
            <div class="wallet-balance" id="wallet-balance">Loading...</div>
        </div>
    </header>

    <div class="game-container">
        <div class="slot-machine">
            <div class="reel-column" id="col-1"><div class="reel-strip" id="strip-1"></div></div>
            <div class="reel-column" id="col-2"><div class="reel-strip" id="strip-2"></div></div>
            <div class="reel-column" id="col-3"><div class="reel-strip" id="strip-3"></div></div>
            <div class="payline-overlay"></div>
        </div>
        
        <div class="jackpot-info">
            <div class="jackpot-text" id="jackpot-text">Chance to win K1,000.00</div>
            <!-- ✅ REMOVED: Daily Loss Tracker HTML -->
        </div>

        <div class="bet-controls">
            <button class="adj-btn" onclick="adjustBet(-1)">−</button>
            <div class="bet-display">
                <span class="currency-symbol" id="currency-symbol">K</span>
                <input type="number" id="bet-input" class="bet-input" value="6" readonly>
            </div>
            <button class="adj-btn" onclick="adjustBet(1)">+</button>
        </div>
        <div class="quick-bets">
            <button class="q-btn active" onclick="setBet(6)">K6</button>
            <button class="q-btn" onclick="setBet(30)">K30</button>
            <button class="q-btn" onclick="setBet(300)">K300</button>
            <button class="q-btn" onclick="setBet(3000)">K3K</button>
        </div>

        <button class="spin-btn" id="spin-btn" onclick="spinSlots()">SPIN - K6</button>
    </div>

    <!-- SMALL WIN OVERLAY -->
    <div class="result-overlay" id="result-overlay">
        <div class="result-card" id="result-card">
            <div class="result-icon" id="result-icon"></div>
            <div class="result-title" id="result-title">You Won!</div>
            <div class="result-msg" id="result-msg">Cherry Bonus</div>
            <button class="btn-close-modal" onclick="collectWin()">COLLECT</button>
        </div>
    </div>

    <!-- BIG WIN ANIMATION OVERLAY -->
    <div class="big-win-overlay" id="big-win-overlay">
        <div class="big-win-title">BIG WIN!</div>
        <div class="big-win-amount" id="big-win-amount">K0.00</div>
        <button class="btn-collect-big" onclick="collectWin()">COLLECT</button>
    </div>

    <div id="jackpot-flash"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBpKp2TePXAmJjc_qR-bJPCZJ123QsCyxw",
            authDomain: "jakipot.firebaseapp.com",
            projectId: "jakipot",
            storageBucket: "jakipot.firebasestorage.app",
            messagingSenderId: "396191754293",
            appId: "1:396191754293:web:5b11a11d82e773d19ee97c",
            measurementId: "G-L1CL5TDHV"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let userBalance = 0;
        let userCurrency = 'ZMW';
        let currencySymbol = 'K';
        let currentBet = 6;
        let isSpinning = false;
        let isProcessingTx = false;
        
        // PENDING WIN STATE
        let pendingWin = 0;
        let bigWinAnimationId = null;

        // DAILY TRACKER STATE (Still tracked internally by backend, but hidden)
        let dailyLoss = 0;
        let lastPlayDate = '';
        const LOSS_TARGET = 3000;

        // AUDIO & MUTE STATE
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;
        let isMuted = localStorage.getItem('jakipotFruitMuted') === 'true';

        const CURRENCY_MAP = {
            'ZMW': 'K', 'USD': '$', 'NGN': '₦', 'EUR': '€', 'GBP': '£', 
            'ZAR': 'R', 'KES': 'KSh', 'GHS': 'GH₵', 'TZS': 'TSh', 
            'UGX': 'USh', 'BWP': 'P', 'MWK': 'MK', 'MZN': 'MT', 
            'NAD': 'N$', 'AOA': 'Kz', 'PHP': '₱', 'IDR': 'Rp', 
            'PKR': '₨', 'BDT': '৳'
        };

        const SVG_UNMUTED = `<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>`;
        const SVG_MUTED = `<svg viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>`;

        function updateMuteIcon() {
            const btn = document.getElementById('mute-btn');
            btn.innerHTML = isMuted ? SVG_MUTED : SVG_UNMUTED;
        }

        window.toggleMute = () => {
            isMuted = !isMuted;
            localStorage.setItem('jakipotFruitMuted', isMuted);
            updateMuteIcon();
            if (!isMuted) initAudio();
        };

        updateMuteIcon();

        // Fake Loading Progress
        let loadProgress = 0;
        const loadBar = document.getElementById('loader-bar');
        const loadInterval = setInterval(() => {
            if (loadProgress < 90) {
                loadProgress += Math.random() * 15;
                if (loadProgress > 90) loadProgress = 90;
                loadBar.style.width = loadProgress + '%';
            }
        }, 100);

        function finishLoading() {
            clearInterval(loadInterval);
            loadBar.style.width = '100%';
            setTimeout(() => {
                document.getElementById('loader-overlay').classList.add('hidden');
            }, 300);
        }

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.replace('login.html'); return; }
            currentUser = user;

            onSnapshot(doc(db, 'users', user.uid), (snap) => {
                // ✅ FIXED: Added () for Web SDK
                if (snap.exists()) {
                    const data = snap.data();
                    userCurrency = data.currency || 'ZMW';
                    currencySymbol = CURRENCY_MAP[userCurrency] || userCurrency;
                    
                    const todayStr = new Date().toISOString().split('T')[0];
                    if (data.lastFruitPlayDate === todayStr) {
                        dailyLoss = data.fruitDailyLoss || 0;
                    } else {
                        dailyLoss = 0;
                    }
                    lastPlayDate = todayStr;

                    document.getElementById('currency-symbol').innerText = currencySymbol;
                    updateBetUI();
                }
            });

            onSnapshot(doc(db, 'wallets', user.uid), (snap) => {
                // ✅ FIXED: Added () for Web SDK
                if (snap.exists()) {
                    userBalance = snap.data().balance || 0;
                    updateBalanceUI();
                    // Finish loading once we get the user data
                    finishLoading();
                }
            });

            initReels();
        });

        function updateBalanceUI() {
            document.getElementById('wallet-balance').innerText = `${currencySymbol} ${userBalance.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
        }

        function updateBetUI() {
            document.getElementById('bet-input').value = currentBet;
            document.getElementById('spin-btn').innerText = `SPIN - ${currencySymbol}${currentBet}`;
            
            document.querySelectorAll('.q-btn').forEach(btn => {
                const btnVal = parseInt(btn.innerText.replace(currencySymbol, '').replace('K', ''));
                if (btnVal === currentBet) btn.classList.add('active');
                else btn.classList.remove('active');
            });

            const scaleFactor = currentBet / 6;
            const potentialJackpot = 1000 * scaleFactor;
            document.getElementById('jackpot-text').innerText = `Chance to win ${currencySymbol}${potentialJackpot.toLocaleString(undefined, {minimumFractionDigits: 2})}`;
            
            // ✅ REMOVED: Daily Loss UI update logic is gone, keeping it invisible
        }

        window.adjustBet = (amount) => {
            if (isSpinning || isProcessingTx) return;
            let newVal = currentBet + amount;
            if (newVal < 6) newVal = 6; 
            if (newVal > 50000) newVal = 50000; 
            currentBet = newVal;
            updateBetUI();
        };

        window.setBet = (amount) => {
            if (isSpinning || isProcessingTx) return;
            currentBet = amount;
            updateBetUI();
        };

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(type) {
            if (isMuted || !audioCtx) return;
            const now = audioCtx.currentTime;

            if (type === 'tick') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.02);
                gain.gain.setValueAtTime(0.05, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.03);
                osc.connect(gain); osc.connect(audioCtx.destination);
                osc.start(now); osc.stop(now + 0.03);
            } 
            else if (type === 'win') {
                const notes = [523.25, 659.25, 783.99];
                notes.forEach((freq, i) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + i * 0.1);
                    gain.gain.setValueAtTime(0.2, now + i * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.1 + 0.3);
                    osc.connect(gain); osc.connect(audioCtx.destination);
                    osc.start(now + i * 0.1); osc.stop(now + i * 0.1 + 0.3);
                });
            } 
            else if (type === 'big_win') {
                const notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, i) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(freq, now + i * 0.08);
                    gain.gain.setValueAtTime(0.15, now + i * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.08 + 0.5);
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(now + i * 0.08); osc.stop(now + i * 0.08 + 0.5);
                });
            }
        }

        function getFruitSVG(icon) {
            switch(icon) {
                case '🍏': return `<svg viewBox="0 0 100 100"><path d="M50 25 C30 25 15 45 15 65 C15 85 35 95 50 95 C65 95 85 85 85 65 C85 45 70 25 50 25 Z" fill="url(#greenAppleGrad)"/><path d="M50 25 Q55 15 60 10" stroke="#78350f" stroke-width="4" fill="none"/><defs><radialGradient id="greenAppleGrad" cx="40%" cy="30%" r="60%"><stop offset="0%" stop-color="#bbf7d0"/><stop offset="50%" stop-color="#22c55e"/><stop offset="100%" stop-color="#14532d"/></radialGradient></defs></svg>`;

                case '🥥': return `<svg viewBox="0 0 100 100"><circle cx="50" cy="60" r="30" fill="url(#cocoGrad)"/><circle cx="40" cy="50" r="4" fill="#451a03"/><circle cx="60" cy="50" r="4" fill="#451a03"/><circle cx="50" cy="70" r="4" fill="#451a03"/><path d="M50 30 C40 10 60 10 50 30" fill="none" stroke="#22c55e" stroke-width="3"/><defs><radialGradient id="cocoGrad" cx="40%" cy="30%" r="60%"><stop offset="0%" stop-color="#a16207"/><stop offset="50%" stop-color="#713f12"/><stop offset="100%" stop-color="#422006"/></radialGradient></defs></svg>`;
                case '🍒': return `<svg viewBox="0 0 100 100"><path d="M50 50 Q60 20 80 30" fill="none" stroke="#4ade80" stroke-width="6"/><path d="M50 50 Q40 20 20 30" fill="none" stroke="#4ade80" stroke-width="6"/><circle cx="50" cy="70" r="20" fill="url(#cherryGrad1)"/><circle cx="20" cy="70" r="20" fill="url(#cherryGrad2)"/><defs><radialGradient id="cherryGrad1" cx="30%" cy="30%" r="70%"><stop offset="0%" stop-color="#fca5a5"/><stop offset="60%" stop-color="#ef4444"/><stop offset="100%" stop-color="#991b1b"/></radialGradient><radialGradient id="cherryGrad2" cx="30%" cy="30%" r="70%"><stop offset="0%" stop-color="#fca5a5"/><stop offset="60%" stop-color="#dc2626"/><stop offset="100%" stop-color="#7f1d1d"/></radialGradient></defs></svg>`;
                case '🍎': return `<svg viewBox="0 0 100 100"><path d="M50 25 C30 25 15 45 15 65 C15 85 35 95 50 95 C65 95 85 85 85 65 C85 45 70 25 50 25 Z" fill="url(#appleGrad)"/><path d="M50 25 Q55 15 60 10" stroke="#78350f" stroke-width="4" fill="none"/><defs><radialGradient id="appleGrad" cx="40%" cy="30%" r="60%"><stop offset="0%" stop-color="#fca5a5"/><stop offset="50%" stop-color="#ef4444"/><stop offset="100%" stop-color="#991b1b"/></radialGradient></defs></svg>`;
                case '🍉': return `<svg viewBox="0 0 100 100"><path d="M10 50 A40 40 0 0 0 90 50 Z" fill="#22c55e"/><path d="M15 50 A35 35 0 0 0 85 50 Z" fill="#ef4444"/><circle cx="35" cy="60" r="3" fill="#000"/><circle cx="50" cy="65" r="3" fill="#000"/><circle cx="65" cy="60" r="3" fill="#000"/></svg>`;
                case '🍌': return `<svg viewBox="0 0 100 100"><path d="M20 30 C30 90 70 90 80 30 C70 60 50 60 20 30 Z" fill="url(#bananaGrad)" stroke="#78350f" stroke-width="2"/><defs><linearGradient id="bananaGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fef08a"/><stop offset="100%" stop-color="#facc15"/></linearGradient></defs></svg>`;
                case '🍇': return `<svg viewBox="0 0 100 100"><circle cx="50" cy="30" r="12" fill="url(#grapeGrad)"/><circle cx="35" cy="45" r="12" fill="url(#grapeGrad)"/><circle cx="65" cy="45" r="12" fill="url(#grapeGrad)"/><circle cx="20" cy="60" r="12" fill="url(#grapeGrad)"/><circle cx="50" cy="60" r="12" fill="url(#grapeGrad)"/><circle cx="80" cy="60" r="12" fill="url(#grapeGrad)"/><circle cx="35" cy="75" r="12" fill="url(#grapeGrad)"/><circle cx="65" cy="75" r="12" fill="url(#grapeGrad)"/><circle cx="50" cy="90" r="12" fill="url(#grapeGrad)"/><defs><radialGradient id="grapeGrad" cx="30%" cy="30%" r="70%"><stop offset="0%" stop-color="#d8b4fe"/><stop offset="60%" stop-color="#a855f7"/><stop offset="100%" stop-color="#581c87"/></radialGradient></defs></svg>`;
                case '🔔': return `<svg viewBox="0 0 100 100"><path d="M50 15 C30 15 25 40 25 60 L15 75 L85 75 L75 60 C75 40 70 15 50 15 Z" fill="url(#bellGrad)"/><circle cx="50" cy="85" r="8" fill="#b45309"/><rect x="15" y="75" width="70" height="6" rx="3" fill="#78350f"/><defs><linearGradient id="bellGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fef08a"/><stop offset="50%" stop-color="#facc15"/><stop offset="100%" stop-color="#ca8a04"/></linearGradient></defs></svg>`;
                case '🍊': return `<svg viewBox="0 0 100 100"><circle cx="50" cy="55" r="35" fill="url(#orangeGrad)"/><path d="M50 20 L55 10 L65 15" fill="none" stroke="#4ade80" stroke-width="4" stroke-linecap="round"/><circle cx="40" cy="45" r="4" fill="#fff" opacity="0.4"/><defs><radialGradient id="orangeGrad" cx="30%" cy="30%" r="70%"><stop offset="0%" stop-color="#fdba74"/><stop offset="60%" stop-color="#f97316"/><stop offset="100%" stop-color="#9a3412"/></radialGradient></defs></svg>`;
                case '🥭': return `<svg viewBox="0 0 100 100"><path d="M30 30 C50 10 80 20 85 50 C90 80 60 95 40 90 C20 85 10 60 30 30 Z" fill="url(#mangoGrad)"/><path d="M40 25 C45 15 55 10 65 15" fill="none" stroke="#4ade80" stroke-width="4" stroke-linecap="round"/><defs><linearGradient id="mangoGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fef08a"/><stop offset="40%" stop-color="#fb923c"/><stop offset="80%" stop-color="#dc2626"/><stop offset="100%" stop-color="#7f1d1d"/></linearGradient></defs></svg>`;
                case '777': return `<svg viewBox="0 0 100 100"><rect width="100" height="100" fill="url(#goldBg777)" rx="8"/><text x="50%" y="55%" dominant-baseline="middle" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="60" font-weight="900" fill="#000" stroke="#fff" stroke-width="1.5">777</text><defs><linearGradient id="goldBg777" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fef08a"/><stop offset="50%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#f59e0b"/></linearGradient></defs></svg>`;
                default: return `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="#fff"/></svg>`;
            }
        }

        const fruits = [
            { icon: '🍏', name: 'Green Apple', basePay: 1, prob: 8.0 },
            { icon: '🍓', name: 'Strawberry', basePay: 2, prob: 4.0 },
            { icon: '🍋', name: 'Lemon', basePay: 3, prob: 3.0 },
            { icon: '🍍', name: 'Pineapple', basePay: 4, prob: 2.0 },
            { icon: '🥥', name: 'Coconut', basePay: 5, prob: 1.5 },
            { icon: '🍒', name: 'Cherry', basePay: 8, prob: 1.0 },
            { icon: '🍎', name: 'Apple', basePay: 10, prob: 0.8 },
            { icon: '🍉', name: 'Melon', basePay: 15, prob: 0.5 },
            { icon: '🍌', name: 'Banana', basePay: 20, prob: 0.3 },
            { icon: '🍇', name: 'Grape', basePay: 50, prob: 0.2 },
            { icon: '🔔', name: 'Bell', basePay: 60, prob: 0.1 },
            { icon: '🍊', name: 'Orange', basePay: 120, prob: 0.05 },
            { icon: '🥭', name: 'Mango', basePay: 210, prob: 0.04 },
            { icon: '777', name: 'JACKPOT', basePay: 1000, prob: 0.01, isJackpot: true }
        ];

        const ITEM_HEIGHT = 90;
        const NUM_ITEMS = 60; 
        const WIN_INDEX = 55; 

        let spinResults = [null, null, null];
        let lastSpinFruit = null;

        function initReels() {
            for (let col = 0; col < 3; col++) {
                const strip = document.getElementById(`strip-${col + 1}`);
                strip.innerHTML = '';
                for (let i = 0; i < NUM_ITEMS; i++) {
                    const fruit = fruits[Math.floor(Math.random() * (fruits.length - 1))];
                    const div = document.createElement('div');
                    div.className = `reel-item`;
                    div.innerHTML = getFruitSVG(fruit.icon); 
                    strip.appendChild(div);
                }
                strip.style.transform = `translateY(-${ITEM_HEIGHT}px)`;
            }
            updateBetUI();
        }

        window.spinSlots = async () => {
            initAudio();
            if (isSpinning || isProcessingTx || !currentUser) return;
            
            if (userBalance < currentBet) {
                alert(`Insufficient balance. You need ${currencySymbol}${currentBet} to spin.`);
                return;
            }

            isSpinning = true;
            isProcessingTx = true;
            document.getElementById('spin-btn').disabled = true;
            document.getElementById('spin-btn').innerText = "SPINNING...";

            // 1. FAKE SPIN ANIMATION (Starts instantly)
            let fakeSpinInterval = setInterval(() => {
                document.querySelectorAll('.reel-strip').forEach(strip => {
                    strip.style.transform = `translateY(${Math.random() * -500}px)`;
                });
            }, 50);

            // 2. SETUP ABORT CONTROLLER TIMEOUT
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 8000); // 8 second limit

            try {
                // 3. GET SECURE TOKEN FROM FIREBASE AUTH
                const idToken = await currentUser.getIdToken();

                // 4. CALL VERCEL SECURE SERVER
                const response = await fetch('https://jakipot.vercel.app/api/play', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${idToken}`
                    },
                    body: JSON.stringify({ gameType: 'fruit_777', betAmount: currentBet }),
                    signal: controller.signal
                });

                clearTimeout(timeoutId); // Stop timer

                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    throw new Error(errData.error || `Server Error (${response.status})`);
                }

                const data = await response.json();
                if (data.error) throw new Error(data.error);

                // 5. STOP FAKE SPIN & UPDATE BALANCES
                clearInterval(fakeSpinInterval);
                userBalance = data.newBalance;
                dailyLoss = data.newDailyLoss;
                updateBalanceUI();
                updateBetUI();

                // 6. SET THE REAL RESULTS FROM SERVER
                let winAmount = data.payoutAmount;

                if (data.winFruit) {
                    const serverFruit = fruits.find(f => f.icon === data.winFruit.icon);
                    spinResults = [serverFruit, serverFruit, serverFruit];
                    lastSpinFruit = serverFruit;
                    pendingWin = winAmount; 
                } else {
                    spinResults = [
                        fruits[Math.floor(Math.random() * 9)],
                        fruits[Math.floor(Math.random() * 9)],
                        fruits[Math.floor(Math.random() * 9)]
                    ];
                    while (spinResults[0].icon === spinResults[1].icon && spinResults[1].icon === spinResults[2].icon) {
                        spinResults[1] = fruits[Math.floor(Math.random() * 9)];
                    }
                    lastSpinFruit = null;
                    pendingWin = 0;
                }

                isProcessingTx = false;
                
                // 7. PLAY THE REAL ANIMATION
                animateColumn(0, 3000);
                animateColumn(1, 3500);
                animateColumn(2, 4000);

            } catch (e) {
                clearTimeout(timeoutId);
                clearInterval(fakeSpinInterval); // ✅ FIXED: Stop the fake spin!
                
                if (e.name === 'AbortError') {
                    alert("Request Timed Out! Vercel is taking too long to respond.");
                } else {
                    console.error("Transaction failed:", e);
                    alert(e.message || "Failed to process spin. Please check your connection.");
                }
                
                isSpinning = false; isProcessingTx = false;
                document.getElementById('spin-btn').disabled = false;
                document.getElementById('spin-btn').innerText = `SPIN - ${currencySymbol}${currentBet}`;
            }
        };

        function animateColumn(colIndex, duration) {
            const strip = document.getElementById(`strip-${colIndex + 1}`);
            const targetFruit = spinResults[colIndex];
            
            strip.innerHTML = '';
            strip.style.transform = `translateY(0px)`;
            
            for (let i = 0; i < NUM_ITEMS; i++) {
                let fruit = (i === WIN_INDEX) ? targetFruit : fruits[Math.floor(Math.random() * 9)];
                const div = document.createElement('div');
                div.className = `reel-item`;
                div.innerHTML = getFruitSVG(fruit.icon); 
                strip.appendChild(div);
            }

            const targetY = - ( (WIN_INDEX * ITEM_HEIGHT) - ITEM_HEIGHT );
            let startTime = performance.now();
            let lastTickIndex = -1;

            function animate(time) {
                const elapsed = time - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const easeOut = 1 - Math.pow(1 - progress, 4);
                const currentY = 0 + (targetY - 0) * easeOut;
                strip.style.transform = `translateY(${currentY}px)`;

                const currentIndex = Math.floor(Math.abs(currentY) / ITEM_HEIGHT);
                if (currentIndex !== lastTickIndex) {
                    playSound('tick');
                    lastTickIndex = currentIndex;
                }

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    if (colIndex === 2) {
                        isSpinning = false;
                        document.getElementById('spin-btn').disabled = false;
                        document.getElementById('spin-btn').innerText = `SPIN - ${currencySymbol}${currentBet}`;
                        evaluateResult();
                    }
                }
            }
            requestAnimationFrame(animate);
        }

        function evaluateResult() {
            if (lastSpinFruit) {
                const winAmount = pendingWin;
                
                if (winAmount >= 15) {
                    showBigWin(winAmount);
                } else {
                    showSmallWin(lastSpinFruit, winAmount);
                }
            } else {
                updateBetUI(); 
            }
        }

        function showBigWin(winAmount) {
            playSound('big_win');
            const overlay = document.getElementById('big-win-overlay');
            const amountEl = document.getElementById('big-win-amount');
            
            overlay.classList.add('active');
            
            let startAmount = 0;
            const duration = 2000; 
            const startTime = performance.now();
            
            function updateCounter(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const easeOut = 1 - Math.pow(1 - progress, 3); 
                const currentVal = winAmount * easeOut;
                
                amountEl.innerText = `${currencySymbol}${currentVal.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
                
                if (progress < 1) {
                    bigWinAnimationId = requestAnimationFrame(updateCounter);
                } else {
                    amountEl.innerText = `${currencySymbol}${winAmount.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
                }
            }
            bigWinAnimationId = requestAnimationFrame(updateCounter);
        }

        function showSmallWin(fruit, winAmount) {
            playSound('win');
            const overlay = document.getElementById('result-overlay');
            const card = document.getElementById('result-card');
            const icon = document.getElementById('result-icon');
            const title = document.getElementById('result-title');
            const msg = document.getElementById('result-msg');

            card.classList.remove('jackpot-mode');

            if (fruit.isJackpot) {
                card.classList.add('jackpot-mode');
                icon.innerHTML = getFruitSVG('777');
                title.innerText = 'JAKIPOT 777!';
                msg.innerText = `MASSIVE WIN! You hit the jackpot for ${currencySymbol}${winAmount.toLocaleString()}!`;
            } else {
                icon.innerHTML = getFruitSVG(fruit.icon);
                title.innerText = 'You Won!';
                msg.innerText = `3x ${fruit.name}! You won ${currencySymbol}${winAmount.toLocaleString()}!`;
            }

            overlay.classList.add('active');
        }

        // --- COLLECT LOGIC (Just closes the modal, server already paid) ---
        window.collectWin = () => {
            document.getElementById('result-overlay').classList.remove('active');
            document.getElementById('big-win-overlay').classList.remove('active');
            pendingWin = 0;
            lastSpinFruit = null;
            updateBetUI();
        };

    </script>
</body>
