<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JAKIPOT - Fruit Slots 777</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #040b16;
            --bg-panel: #0f172a;
            --cyan: #00D9FF;
            --cyan-glow: rgba(0, 217, 255, 0.3);
            --gold: #fbbf24;
            --gold-glow: rgba(251, 191, 36, 0.5);
            --emerald: #10b981;
            --text-white: #ffffff;
            --text-muted: #8b9bb4;
            --border-light: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: var(--bg-deep); color: var(--text-white); 
            height: 100vh; display: flex; flex-direction: column; 
            overflow: hidden; align-items: center; justify-content: center;
            background-image: radial-gradient(circle at 50% 50%, rgba(0, 217, 255, 0.05) 0%, transparent 60%);
        }

        .top-header {
            position: absolute; top: 0; left: 0; width: 100%;
            display: flex; align-items: center; justify-content: space-between;
            padding: 15px 20px; background: rgba(10, 25, 47, 0.8); backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-light); z-index: 10;
        }
        .back-btn { background: transparent; border: none; cursor: pointer; color: var(--cyan); display: flex; align-items: center; padding: 4px; }
        .back-btn svg { width: 24px; height: 24px; fill: currentColor; }
        .header-title { font-size: 16px; font-weight: 900; color: var(--text-white); letter-spacing: 1.5px; text-transform: uppercase; text-shadow: 0 0 10px var(--cyan-glow); }
        .wallet-balance { font-size: 14px; font-weight: 800; color: var(--gold); background: rgba(251, 191, 36, 0.1); padding: 6px 12px; border-radius: 20px; border: 1px solid rgba(251,191,36,0.3); }

        .game-container {
            display: flex; flex-direction: column; align-items: center; 
            width: 100%; max-width: 400px; margin-top: 40px;
        }

        .slot-machine {
            display: flex; gap: 8px; padding: 15px;
            background: var(--bg-panel); border-radius: 20px;
            border: 4px solid #1e293b; box-shadow: 0 0 40px rgba(0,0,0,0.8);
            position: relative;
        }

        .reel-column {
            width: 90px; height: 270px; 
            background: #000; border-radius: 10px; overflow: hidden;
            position: relative; box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }

        .reel-strip { position: absolute; top: 0; left: 0; width: 100%; display: flex; flex-direction: column; }

        .reel-item {
            height: 90px; display: flex; justify-content: center; align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        
        .reel-item svg { width: 65px; height: 65px; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.6)); }

        .payline-overlay {
            position: absolute; top: 50%; left: 0; width: 100%; height: 90px;
            transform: translateY(-50%);
            border-top: 2px solid var(--cyan); border-bottom: 2px solid var(--cyan);
            background: rgba(0, 217, 255, 0.1); z-index: 5; pointer-events: none;
            box-shadow: 0 0 15px var(--cyan-glow);
        }

        .bet-controls {
            display: flex; align-items: center; justify-content: space-between;
            width: 100%; max-width: 280px; margin-top: 25px;
            background: var(--bg-panel); padding: 8px; border-radius: 12px;
            border: 1px solid var(--border-light);
        }
        .adj-btn { background: transparent; border: none; color: var(--cyan); font-size: 24px; font-weight: 900; width: 50px; height: 40px; cursor: pointer; }
        .bet-display { display: flex; align-items: center; gap: 5px; }
        .currency-symbol { font-size: 16px; color: var(--text-muted); font-weight: 800; }
        .bet-input { background: transparent; border: none; color: var(--white); font-size: 22px; font-weight: 900; width: 80px; text-align: center; outline: none; }
        
        .quick-bets { display: flex; gap: 8px; width: 100%; max-width: 280px; margin-top: 10px; }
        .q-btn { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid var(--border-light); color: var(--text-muted); padding: 8px 0; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .q-btn.active { background: rgba(0, 217, 255, 0.1); color: var(--cyan); border-color: var(--cyan); }

        .spin-btn {
            margin-top: 20px; padding: 18px 60px; border-radius: 50px;
            border: none; background: linear-gradient(90deg, #f59e0b, #fbbf24);
            color: #000; font-size: 20px; font-weight: 900; text-transform: uppercase;
            letter-spacing: 2px; cursor: pointer; transition: 0.2s;
            box-shadow: 0 4px 20px var(--gold-glow);
        }
        .spin-btn:active { transform: scale(0.95); }
        .spin-btn:disabled { background: #334155; color: var(--text-muted); box-shadow: none; cursor: not-allowed; }

        .result-overlay {
            position: fixed; inset: 0; background: rgba(4, 11, 22, 0.9);
            backdrop-filter: blur(10px); display: none; justify-content: center; align-items: center;
            z-index: 100; opacity: 0; transition: opacity 0.3s;
        }
        .result-overlay.active { display: flex; opacity: 1; }

        .result-card {
            background: var(--bg-panel); border: 2px solid var(--gold);
            border-radius: 24px; padding: 30px; text-align: center;
            box-shadow: 0 0 50px var(--gold-glow); max-width: 350px; width: 90%;
            transform: scale(0.8); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .result-overlay.active .result-card { transform: scale(1); }

        .result-title { font-size: 24px; font-weight: 900; color: var(--gold); text-transform: uppercase; margin-bottom: 10px; }
        .result-icon { margin-bottom: 15px; display: flex; justify-content: center; }
        .result-icon svg { width: 80px; height: 80px; }
        .result-msg { font-size: 15px; color: var(--text-muted); margin-bottom: 20px; }
        
        .btn-close-modal {
            width: 100%; padding: 14px; border-radius: 10px; border: none;
            background: var(--gold); color: #000; font-size: 16px; font-weight: 900;
            cursor: pointer; text-transform: uppercase;
        }

        #jackpot-flash { position: fixed; inset: 0; background: white; z-index: 99; display: none; opacity: 0; }
        .jackpot-mode .result-card { border-color: #ef4444; box-shadow: 0 0 80px #ef4444; }
        .jackpot-mode .result-title { color: #ef4444; text-shadow: 0 0 20px #ef4444; font-size: 36px; }
        .jackpot-mode .btn-close-modal { background: #ef4444; color: white; }
    </style>
</head>
<body>

    <header class="top-header">
        <button class="back-btn" onclick="window.location.href='home.html'">
            <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </button>
        <div class="header-title">Fruit 777</div>
        <div class="wallet-balance" id="wallet-balance">Loading...</div>
    </header>

    <div class="game-container">
        <div class="slot-machine">
            <div class="reel-column" id="col-1"><div class="reel-strip" id="strip-1"></div></div>
            <div class="reel-column" id="col-2"><div class="reel-strip" id="strip-2"></div></div>
            <div class="reel-column" id="col-3"><div class="reel-strip" id="strip-3"></div></div>
            <div class="payline-overlay"></div>
        </div>
        
        <div class="bet-controls">
            <button class="adj-btn" onclick="adjustBet(-10)">−</button>
            <div class="bet-display">
                <span class="currency-symbol" id="currency-symbol">K</span>
                <input type="number" id="bet-input" class="bet-input" value="30" readonly>
            </div>
            <button class="adj-btn" onclick="adjustBet(10)">+</button>
        </div>
        <div class="quick-bets">
            <button class="q-btn active" onclick="setBet(30)">K30</button>
            <button class="q-btn" onclick="setBet(50)">K50</button>
            <button class="q-btn" onclick="setBet(100)">K100</button>
            <button class="q-btn" onclick="setBet(200)">K200</button>
        </div>

        <button class="spin-btn" id="spin-btn" onclick="spinSlots()">SPIN - K30</button>
    </div>

    <div id="jackpot-flash"></div>

    <div class="result-overlay" id="result-overlay">
        <div class="result-card" id="result-card">
            <div class="result-icon" id="result-icon"></div>
            <div class="result-title" id="result-title">You Won!</div>
            <div class="result-msg" id="result-msg">Cherry Bonus</div>
            <button class="btn-close-modal" onclick="closeModal()">COLLECT</button>
        </div>
    </div>

    <script type="module">
        // LOCKED TO 13.1.0 AS REQUESTED
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, addDoc, serverTimestamp, writeBatch, increment, onSnapshot } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBpKp2TePXAmJjc_qR-bJPCZJ123QsCyxw",
            authDomain: "jakipot.firebaseapp.com",
            projectId: "jakipot",
            storageBucket: "jakipot.firebasestorage.app",
            messagingSenderId: "396191754293",
            appId: "1:396191754293:web:5b11a11d82e773d19ee97c",
            measurementId: "G-L1CLB5TDHV"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- STATE ---
        let currentUser = null;
        let userBalance = 0;
        let userCurrency = 'ZMW';
        let currencySymbol = 'K';
        let currentBet = 30.00;
        let isSpinning = false;
        let isProcessingTx = false;

        const CURRENCY_MAP = {
            'ZMW': 'K', 'USD': '$', 'NGN': '₦', 'EUR': '€', 'GBP': '£', 
            'ZAR': 'R', 'KES': 'KSh', 'GHS': 'GH₵', 'TZS': 'TSh', 
            'UGX': 'USh', 'BWP': 'P', 'MWK': 'MK', 'MZN': 'MT', 
            'NAD': 'N$', 'AOA': 'Kz', 'PHP': '₱', 'IDR': 'Rp', 
            'PKR': '₨', 'BDT': '৳'
        };

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.replace('login.html'); return; }
            currentUser = user;

            onSnapshot(doc(db, 'users', user.uid), (snap) => {
                if (snap.exists()) {
                    userCurrency = snap.data().currency || 'ZMW';
                    currencySymbol = CURRENCY_MAP[userCurrency] || userCurrency;
                    document.getElementById('currency-symbol').innerText = currencySymbol;
                    document.querySelectorAll('.q-btn').forEach(btn => {
                        const val = btn.innerText.replace('K', '');
                        btn.innerText = `${currencySymbol}${val}`;
                    });
                    updateBetUI();
                }
            });

            onSnapshot(doc(db, 'wallets', user.uid), (snap) => {
                if (snap.exists()) {
                    userBalance = snap.data().balance || 0;
                    updateBalanceUI();
                }
            });

            initReels();
        });

        function updateBalanceUI() {
            document.getElementById('wallet-balance').innerText = `${currencySymbol} ${userBalance.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
        }

        function updateBetUI() {
            document.getElementById('bet-input').value = currentBet;
            document.getElementById('spin-btn').innerText = `SPIN - ${currencySymbol}${currentBet}`;
            
            document.querySelectorAll('.q-btn').forEach(btn => {
                const btnVal = parseInt(btn.innerText.replace(currencySymbol, ''));
                if (btnVal === currentBet) btn.classList.add('active');
                else btn.classList.remove('active');
            });
        }

        window.adjustBet = (amount) => {
            if (isSpinning || isProcessingTx) return;
            let newVal = currentBet + amount;
            if (newVal < 30) newVal = 30; 
            if (newVal > 10000) newVal = 10000; 
            currentBet = newVal;
            updateBetUI();
        };

        window.setBet = (amount) => {
            if (isSpinning || isProcessingTx) return;
            currentBet = amount;
            updateBetUI();
        };

        // --- AUDIO ENGINE ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(type) {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;

            if (type === 'tick') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.02);
                gain.gain.setValueAtTime(0.05, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.03);
                osc.connect(gain); osc.connect(audioCtx.destination);
                osc.start(now); osc.stop(now + 0.03);
            } 
            else if (type === 'win') {
                const notes = [523.25, 659.25, 783.99];
                notes.forEach((freq, i) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + i * 0.1);
                    gain.gain.setValueAtTime(0.2, now + i * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.1 + 0.3);
                    osc.connect(gain); osc.connect(audioCtx.destination);
                    osc.start(now + i * 0.1); osc.stop(now + i * 0.1 + 0.3);
                });
            } 
            else if (type === 'jackpot') {
                const notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, i) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(freq, now + i * 0.08);
                    gain.gain.setValueAtTime(0.15, now + i * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.08 + 0.4);
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(now + i * 0.08); osc.stop(now + i * 0.08 + 0.4);
                });
            }
        }

        // --- CUSTOM SVG FRUITS ---
        function getFruitSVG(icon) {
            switch(icon) {
                case '🍋': return `<svg viewBox="0 0 100 100"><path d="M20 50 C20 30 40 20 50 20 C60 20 80 30 80 50 C80 70 60 80 50 80 C40 80 20 70 20 50 Z" fill="url(#lemonGrad)"/><path d="M50 20 L50 10 M50 80 L50 90" stroke="#4ade80" stroke-width="4" stroke-linecap="round"/><defs><linearGradient id="lemonGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fef08a"/><stop offset="50%" stop-color="#facc15"/><stop offset="100%" stop-color="#ca8a04"/></linearGradient></defs></svg>`;
                case '🍒': return `<svg viewBox="0 0 100 100"><path d="M50 50 Q60 20 80 30" fill="none" stroke="#4ade80" stroke-width="6"/><path d="M50 50 Q40 20 20 30" fill="none" stroke="#4ade80" stroke-width="6"/><circle cx="50" cy="70" r="20" fill="url(#cherryGrad1)"/><circle cx="20" cy="70" r="20" fill="url(#cherryGrad2)"/><defs><radialGradient id="cherryGrad1" cx="30%" cy="30%" r="70%"><stop offset="0%" stop-color="#fca5a5"/><stop offset="60%" stop-color="#ef4444"/><stop offset="100%" stop-color="#991b1b"/></radialGradient><radialGradient id="cherryGrad2" cx="30%" cy="30%" r="70%"><stop offset="0%" stop-color="#fca5a5"/><stop offset="60%" stop-color="#dc2626"/><stop offset="100%" stop-color="#7f1d1d"/></radialGradient></defs></svg>`;
                case '🍌': return `<svg viewBox="0 0 100 100"><path d="M20 30 C30 90 70 90 80 30 C70 60 50 60 20 30 Z" fill="url(#bananaGrad)" stroke="#78350f" stroke-width="2"/><defs><linearGradient id="bananaGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fef08a"/><stop offset="100%" stop-color="#facc15"/></linearGradient></defs></svg>`;
                case '🍎': return `<svg viewBox="0 0 100 100"><path d="M50 25 C30 25 15 45 15 65 C15 85 35 95 50 95 C65 95 85 85 85 65 C85 45 70 25 50 25 Z" fill="url(#appleGrad)"/><path d="M50 25 Q55 15 60 10" stroke="#78350f" stroke-width="4" fill="none"/><defs><radialGradient id="appleGrad" cx="40%" cy="30%" r="60%"><stop offset="0%" stop-color="#fca5a5"/><stop offset="50%" stop-color="#ef4444"/><stop offset="100%" stop-color="#991b1b"/></radialGradient></defs></svg>`;
                case '🍉': return `<svg viewBox="0 0 100 100"><path d="M10 50 A40 40 0 0 0 90 50 Z" fill="#22c55e"/><path d="M15 50 A35 35 0 0 0 85 50 Z" fill="#ef4444"/><circle cx="35" cy="60" r="3" fill="#000"/><circle cx="50" cy="65" r="3" fill="#000"/><circle cx="65" cy="60" r="3" fill="#000"/></svg>`;
                case '🍇': return `<svg viewBox="0 0 100 100"><circle cx="50" cy="30" r="12" fill="url(#grapeGrad)"/><circle cx="35" cy="45" r="12" fill="url(#grapeGrad)"/><circle cx="65" cy="45" r="12" fill="url(#grapeGrad)"/><circle cx="20" cy="60" r="12" fill="url(#grapeGrad)"/><circle cx="50" cy="60" r="12" fill="url(#grapeGrad)"/><circle cx="80" cy="60" r="12" fill="url(#grapeGrad)"/><circle cx="35" cy="75" r="12" fill="url(#grapeGrad)"/><circle cx="65" cy="75" r="12" fill="url(#grapeGrad)"/><circle cx="50" cy="90" r="12" fill="url(#grapeGrad)"/><defs><radialGradient id="grapeGrad" cx="30%" cy="30%" r="70%"><stop offset="0%" stop-color="#d8b4fe"/><stop offset="60%" stop-color="#a855f7"/><stop offset="100%" stop-color="#581c87"/></radialGradient></defs></svg>`;
                case '🔔': return `<svg viewBox="0 0 100 100"><path d="M50 15 C30 15 25 40 25 60 L15 75 L85 75 L75 60 C75 40 70 15 50 15 Z" fill="url(#bellGrad)"/><circle cx="50" cy="85" r="8" fill="#b45309"/><rect x="15" y="75" width="70" height="6" rx="3" fill="#78350f"/><defs><linearGradient id="bellGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fef08a"/><stop offset="50%" stop-color="#facc15"/><stop offset="100%" stop-color="#ca8a04"/></linearGradient></defs></svg>`;
                case '⭐': return `<svg viewBox="0 0 100 100"><polygon points="50,10 61,35 88,35 66,55 74,82 50,65 26,82 34,55 12,35 39,35" fill="url(#starGrad)" stroke="#b45309" stroke-width="2"/><defs><linearGradient id="starGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fef08a"/><stop offset="50%" stop-color="#facc15"/><stop offset="100%" stop-color="#ca8a04"/></linearGradient></defs></svg>`;
                case '777': return `<svg viewBox="0 0 100 100"><rect width="100" height="100" fill="url(#goldBg777)" rx="8"/><text x="50%" y="55%" dominant-baseline="middle" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="60" font-weight="900" fill="#000" stroke="#fff" stroke-width="1.5">777</text><defs><linearGradient id="goldBg777" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fef08a"/><stop offset="50%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#f59e0b"/></linearGradient></defs></svg>`;
                default: return `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="#fff"/></svg>`;
            }
        }

        // --- GAME DATA ---
        const fruits = [
            { icon: '🍋', name: 'Lemon', multiplier: 2, isJackpot: false },     
            { icon: '🍒', name: 'Cherry', multiplier: 3, isJackpot: false },    
            { icon: '🍌', name: 'Banana', multiplier: 4, isJackpot: false },    
            { icon: '🍎', name: 'Apple', multiplier: 5, isJackpot: false },     
            { icon: '🍉', name: 'Melon', multiplier: 6, isJackpot: false },     
            { icon: '🍇', name: 'Grape', multiplier: 7, isJackpot: false },     
            { icon: '🔔', name: 'Bell', multiplier: 8, isJackpot: false },      
            { icon: '⭐', name: 'Star', multiplier: 9, isJackpot: false },      
            { icon: '777', name: 'JACKPOT', multiplier: 10, isJackpot: true }   
        ];

        const ITEM_HEIGHT = 90;
        const NUM_ITEMS = 60; 
        const WIN_INDEX = 55; 

        let spinResults = [null, null, null];

        function initReels() {
            for (let col = 0; col < 3; col++) {
                const strip = document.getElementById(`strip-${col + 1}`);
                strip.innerHTML = '';
                for (let i = 0; i < NUM_ITEMS; i++) {
                    const fruit = fruits[Math.floor(Math.random() * (fruits.length - 1))];
                    const div = document.createElement('div');
                    div.className = `reel-item ${fruit.isJackpot ? 'jackpot' : ''}`;
                    div.innerHTML = getFruitSVG(fruit.icon); 
                    strip.appendChild(div);
                }
                strip.style.transform = `translateY(-${ITEM_HEIGHT}px)`;
            }
            updateBetUI();
        }

        function getSpinOutcome() {
            const rand = Math.random() * 100;
            if (rand < 78.0) return null; 
            if (rand < 84.0) return fruits.find(f => f.icon === '🍋'); 
            if (rand < 89.0) return fruits.find(f => f.icon === '🍒'); 
            if (rand < 93.0) return fruits.find(f => f.icon === '🍌'); 
            if (rand < 96.0) return fruits.find(f => f.icon === '🍎'); 
            if (rand < 98.0) return fruits.find(f => f.icon === '🍉'); 
            if (rand < 99.0) return fruits.find(f => f.icon === '🍇'); 
            if (rand < 99.5) return fruits.find(f => f.icon === '🔔'); 
            if (rand < 99.8) return fruits.find(f => f.icon === '⭐'); 
            return fruits.find(f => f.icon === '777'); 
        }

        window.spinSlots = async () => {
            initAudio();
            if (isSpinning || isProcessingTx || !currentUser) return;
            
            if (userBalance < currentBet) {
                alert(`Insufficient balance. You need ${currencySymbol}${currentBet} to spin.`);
                return;
            }

            isSpinning = true;
            isProcessingTx = true;
            document.getElementById('spin-btn').disabled = true;
            
            const winFruit = getSpinOutcome();
            let multiplier = 0;
            let winAmount = 0;

            if (winFruit) {
                spinResults = [winFruit, winFruit, winFruit];
                multiplier = winFruit.multiplier;
                winAmount = currentBet * multiplier;
            } else {
                spinResults = [
                    fruits[Math.floor(Math.random() * (fruits.length - 1))],
                    fruits[Math.floor(Math.random() * (fruits.length - 1))],
                    fruits[Math.floor(Math.random() * (fruits.length - 1))]
                ];
                while (spinResults[0].icon === spinResults[1].icon && spinResults[1].icon === spinResults[2].icon) {
                    spinResults[1] = fruits[Math.floor(Math.random() * (fruits.length - 1))];
                }
            }

            try {
                const batch = writeBatch(db);
                const walletRef = doc(db, 'wallets', currentUser.uid);
                
                // CRITICAL FIX: Combine deduction and payout into ONE net transaction
                // to satisfy the strict Firestore security rules.
                const netChange = winAmount - currentBet;
                const txRef = doc(collection(db, 'transactions'));
                
                batch.update(walletRef, { 
                    balance: increment(netChange),
                    lastTxId: txRef.id 
                });

                batch.set(txRef, {
                    uid: currentUser.uid, 
                    type: 'fruit_777_result', 
                    amount: netChange, 
                    status: 'completed', 
                    createdAt: serverTimestamp()
                });

                // Create Game Session Audit Trail
                const sessionRef = doc(collection(db, 'game_sessions'));
                batch.set(sessionRef, {
                    uid: currentUser.uid,
                    gameType: 'fruit_777',
                    betAmount: currentBet,
                    multiplier: multiplier,
                    payoutAmount: winAmount,
                    status: 'completed',
                    createdAt: serverTimestamp()
                });

                await batch.commit();

            } catch (e) {
                console.error("Transaction failed:", e);
                alert("Failed to process spin. Please check your connection.");
                isSpinning = false;
                isProcessingTx = false;
                document.getElementById('spin-btn').disabled = false;
                return;
            }

            isProcessingTx = false;
            animateColumn(0, 3000);
            animateColumn(1, 3500);
            animateColumn(2, 4000);
        };

        function animateColumn(colIndex, duration) {
            const strip = document.getElementById(`strip-${colIndex + 1}`);
            const targetFruit = spinResults[colIndex];
            
            strip.innerHTML = '';
            strip.style.transform = `translateY(0px)`;
            
            for (let i = 0; i < NUM_ITEMS; i++) {
                let fruit = (i === WIN_INDEX) ? targetFruit : fruits[Math.floor(Math.random() * (fruits.length - 1))];
                const div = document.createElement('div');
                div.className = `reel-item ${fruit.isJackpot ? 'jackpot' : ''}`;
                div.innerHTML = getFruitSVG(fruit.icon); 
                strip.appendChild(div);
            }

            const targetY = - ( (WIN_INDEX * ITEM_HEIGHT) - ITEM_HEIGHT );
            
            let startTime = performance.now();
            let lastTickIndex = -1;

            function animate(time) {
                const elapsed = time - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const easeOut = 1 - Math.pow(1 - progress, 4);
                
                const currentY = 0 + (targetY - 0) * easeOut;
                strip.style.transform = `translateY(${currentY}px)`;

                const currentIndex = Math.floor(Math.abs(currentY) / ITEM_HEIGHT);
                if (currentIndex !== lastTickIndex) {
                    playSound('tick');
                    lastTickIndex = currentIndex;
                }

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    if (colIndex === 2) {
                        isSpinning = false;
                        document.getElementById('spin-btn').disabled = false;
                        evaluateResult();
                    }
                }
            }
            requestAnimationFrame(animate);
        }

        function evaluateResult() {
            if (spinResults[0].icon === spinResults[1].icon && spinResults[1].icon === spinResults[2].icon) {
                const winAmount = currentBet * spinResults[0].multiplier;
                showWin(spinResults[0], winAmount);
            }
        }

        function showWin(fruit, winAmount) {
            const overlay = document.getElementById('result-overlay');
            const card = document.getElementById('result-card');
            const icon = document.getElementById('result-icon');
            const title = document.getElementById('result-title');
            const msg = document.getElementById('result-msg');

            card.classList.remove('jackpot-mode');

            if (fruit.isJackpot) {
                playSound('jackpot');
                const flash = document.getElementById('jackpot-flash');
                flash.style.display = 'block';
                flash.style.opacity = '1';
                setTimeout(() => { flash.style.opacity = '0'; }, 200);
                setTimeout(() => { flash.style.display = 'none'; }, 500);

                card.classList.add('jackpot-mode');
                icon.innerHTML = getFruitSVG('777');
                title.innerText = 'JAKIPOT 777!';
                msg.innerText = `MASSIVE WIN! You hit the jackpot for ${currencySymbol}${winAmount.toFixed(2)}!`;
            } else {
                playSound('win');
                icon.innerHTML = getFruitSVG(fruit.icon);
                title.innerText = 'You Won!';
                msg.innerText = `3x ${fruit.name}! You won ${currencySymbol}${winAmount.toFixed(2)}!`;
            }

            overlay.classList.add('active');
        }

        window.closeModal = () => {
            document.getElementById('result-overlay').classList.remove('active');
        };

    </script>
</body>
</html>
