name: Deploy Jakipot to Firebase

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Secret is Loaded
        env:
          FIREBASE_SECRET: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JAKIPOT }}
        run: |
          if [ -z "$FIREBASE_SECRET" ]; then
            echo "❌ ERROR: The secret is completely EMPTY."
            exit 1
          else
            echo "✅ SUCCESS: Secret is loaded. Length is ${#FIREBASE_SECRET} characters."
          fi

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JAKIPOT }}
          projectId: jakipot
          target: jakipot-win
          channelId: live
          firebaseToolsVersion: 15.34.0
