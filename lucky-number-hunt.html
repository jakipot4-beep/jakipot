<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>JAKIPOT - Lucky Number Hunt</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Segoe UI', Roboto, sans-serif; }

  :root {
    --gold-1: #fef9c3; --gold-2: #fde047; --gold-3: #facc15;
    --gold-4: #eab308; --gold-5: #a16207; --gold-6: #78350f;
    --dark-0: #050505; --dark-1: #0a0a0a; --dark-2: #1a1a1a; --dark-3: #262626;
    --red: #dc2626; --green: #10b981; --blue: #3b82f6;
  }

  html, body {
    background: var(--dark-0);
    background-image:
      radial-gradient(ellipse at 50% 0%, #1c1000 0%, transparent 55%),
      radial-gradient(ellipse at 50% 100%, #0a0500 0%, transparent 60%),
      radial-gradient(ellipse at 50% 50%, #0a0a0a 0%, #000 100%);
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    color: #f5f5f5;
    font-size: 14px;
  }

  .starfield {
    position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: 0.4;
    background-image:
      radial-gradient(1px 1px at 15% 25%, #fff, transparent),
      radial-gradient(1px 1px at 75% 40%, #fff, transparent),
      radial-gradient(1px 1px at 40% 70%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 85% 15%, #fde047, transparent),
      radial-gradient(1px 1px at 60% 85%, #fff, transparent),
      radial-gradient(1px 1px at 25% 90%, #fde047, transparent);
    animation: twinkle 4s ease-in-out infinite;
  }
  @keyframes twinkle { 0%,100% { opacity: 0.4; } 50% { opacity: 0.7; } }

  .app { 
    position: relative; 
    z-index: 1; 
    max-width: 480px; 
    margin: 0 auto; 
    padding: 8px 12px; 
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  /* HEADER */
  .header { text-align: center; margin-bottom: 4px; }
  .brand { font-size: 10px; font-weight: 900; color: var(--gold-4); letter-spacing: 4px; text-shadow: 0 0 10px rgba(250,204,21,0.4); }
  .title {
    font-size: 20px; font-weight: 900;
    background: linear-gradient(180deg, var(--gold-1) 0%, var(--gold-3) 40%, var(--gold-5) 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    letter-spacing: 1px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); line-height: 1;
  }

  /* TOP ROW: JACKPOT & STATS */
  .top-row { display: flex; gap: 8px; margin-bottom: 8px; }
  
  .jackpot-hero {
    flex: 1;
    position: relative; padding: 8px; border-radius: 12px;
    background: linear-gradient(135deg, rgba(250, 204, 21, 0.15) 0%, rgba(120, 53, 15, 0.3) 50%, rgba(0,0,0,0.6) 100%);
    border: 1.5px solid rgba(250, 204, 21, 0.4); overflow: hidden;
    box-shadow: 0 0 20px rgba(250, 204, 21, 0.2), inset 0 0 20px rgba(250, 204, 21, 0.05);
    text-align: center; display: flex; flex-direction: column; justify-content: center;
  }
  .jackpot-label { font-size: 8px; font-weight: 800; color: var(--gold-4); letter-spacing: 1.5px; margin-bottom: 2px; }
  .jackpot-amount {
    font-size: 24px; font-weight: 900;
    background: linear-gradient(180deg, #fff 0%, var(--gold-2) 40%, var(--gold-4) 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    letter-spacing: 1px; line-height: 1;
    filter: drop-shadow(0 0 10px rgba(250,204,21,0.6)); animation: jackpotPulse 2s ease-in-out infinite;
  }
  @keyframes jackpotPulse { 0%, 100% { filter: drop-shadow(0 0 10px rgba(250,204,21,0.6)); } 50% { filter: drop-shadow(0 0 20px rgba(250,204,21,1)); } }

  .stats-col { display: flex; flex-direction: column; gap: 4px; width: 100px; }
  .stat-box { background: linear-gradient(180deg, rgba(30, 30, 30, 0.9) 0%, rgba(10, 10, 10, 0.9) 100%); border: 1px solid rgba(250, 204, 21, 0.25); border-radius: 8px; padding: 4px; text-align: center; display: flex; justify-content: space-between; align-items: center; }
  .stat-label { font-size: 8px; font-weight: 800; color: #888; margin-left: 4px; }
  .stat-value { font-size: 12px; font-weight: 900; color: var(--gold-2); }
  .stat-value.pulse { animation: statPulse 0.6s ease-out; }
  @keyframes statPulse { 0% { transform: scale(1); color: var(--gold-2); } 50% { transform: scale(1.3); color: #fff; } 100% { transform: scale(1); color: var(--gold-2); } }

  /* DISPLAY AREA */
  .display-area {
    position: relative;
    background: linear-gradient(180deg, rgba(40, 25, 10, 0.95) 0%, rgba(15, 10, 5, 0.95) 100%);
    border: 2px solid rgba(250, 204, 21, 0.4);
    border-radius: 12px;
    padding: 8px;
    margin-bottom: 8px;
    text-align: center;
    box-shadow: 0 4px 15px rgba(0,0,0,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    height: 70px;
  }
  .display-slot {
    width: 54px; height: 54px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #3a2a10, #0a0500);
    border: 2px solid rgba(250, 204, 21, 0.5);
    display: flex; justify-content: center; align-items: center;
    box-shadow: inset 0 4px 10px rgba(0,0,0,0.9);
    flex-shrink: 0;
  }
  .display-number {
    font-size: 28px; font-weight: 900;
    background: linear-gradient(180deg, #fff 0%, var(--gold-2) 50%, var(--gold-5) 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    line-height: 1;
  }
  .display-number.draw-anim { animation: drawShake 0.1s infinite; }
  @keyframes drawShake { 0%, 100% { transform: translateX(-2px); } 50% { transform: translateX(2px); } }
  
  .display-text-col { display: flex; flex-direction: column; text-align: left; flex: 1; }
  .display-label { font-size: 9px; font-weight: 800; color: var(--gold-4); letter-spacing: 1.5px; margin-bottom: 2px; }
  .display-result { font-size: 12px; font-weight: 700; color: #a3a3a3; line-height: 1.2; }
  .display-result.win { color: var(--gold-2); text-shadow: 0 0 10px rgba(250,204,21,0.6); }
  .display-result.lose { color: #ef4444; }
  .display-result.jackpot { color: #38bdf8; font-weight: 900; text-shadow: 0 0 10px rgba(56,189,248,0.8); }

  .display-area.jackpot-win { border-color: #38bdf8; box-shadow: 0 0 20px rgba(56, 189, 248, 0.6); }
  .display-area.jackpot-win .display-slot { border-color: #38bdf8; }

  /* NUMBER GRID */
  .board-label { font-size: 9px; font-weight: 800; color: var(--gold-4); letter-spacing: 1px; margin-bottom: 6px; text-align: center; }
  .number-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    margin-bottom: 8px;
    flex: 1;
    align-content: center;
  }
  .num-ball {
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #fff9c4, #facc15 40%, #a16207 100%);
    border: 2px solid #fde047;
    box-shadow: 0 2px 5px rgba(0,0,0,0.6), inset 0 -3px 6px rgba(0,0,0,0.3);
    display: flex; justify-content: center; align-items: center;
    font-size: 18px; font-weight: 900; color: #451a03;
    cursor: pointer; transition: all 0.2s;
    position: relative; overflow: hidden;
  }
  .num-ball::after {
    content: ''; position: absolute; top: 12%; left: 22%; width: 30%; height: 30%;
    background: rgba(255,255,255,0.65); border-radius: 50%; filter: blur(1px);
  }
  .num-ball:active { transform: scale(0.92); }
  .num-ball.selected {
    border-color: #fff; box-shadow: 0 0 15px #facc15, 0 0 25px #facc15; transform: scale(1.05); z-index: 10;
  }
  .num-ball.disabled { opacity: 0.4; pointer-events: none; }

  /* CONTROLS (BET & BUTTONS) */
  .instruction { text-align: center; font-size: 11px; color: #a3a3a3; margin-bottom: 6px; min-height: 14px; font-weight: 600; }
  
  .bet-panel {
    display: flex; justify-content: space-between; align-items: center;
    background: rgba(20, 20, 20, 0.9); border: 1px solid rgba(250, 204, 21, 0.3);
    border-radius: 10px; padding: 4px 8px; margin-bottom: 8px;
  }
  .bet-btn {
    width: 34px; height: 34px; border-radius: 8px; border: 1.5px solid var(--gold-4);
    background: rgba(250, 204, 21, 0.15); color: var(--gold-2);
    font-size: 20px; font-weight: 900; cursor: pointer;
    display: flex; justify-content: center; align-items: center;
  }
  .bet-btn:active { transform: scale(0.88); }
  .bet-center { display: flex; flex-direction: column; align-items: center; flex: 1; }
  .bet-amount { font-size: 16px; font-weight: 900; color: #fff; }
  .bet-label { font-size: 7px; color: #888; font-weight: 700; }
  .max-bet-btn {
    background: var(--gold-3); border: none; border-radius: 4px; color: #000;
    font-size: 8px; font-weight: 900; padding: 2px 8px; margin-top: 2px; cursor: pointer;
  }

  .actions { display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; }
  .btn-primary { width: 100%; height: 44px; border-radius: 10px; border: none; cursor: pointer; font-size: 14px; font-weight: 900; letter-spacing: 1px; background: linear-gradient(180deg, var(--green) 0%, #047857 100%); color: #fff; box-shadow: 0 3px 0 #064e3b; transition: all 0.1s; display: flex; justify-content: center; align-items: center; }
  .btn-primary:active { transform: translateY(2px); box-shadow: 0 1px 0 #064e3b; }
  .btn-primary:disabled { background: #374151; color: #6b7280; box-shadow: 0 3px 0 #111827; }
  .btn-secondary { width: 100%; height: 44px; border-radius: 10px; border: 2px solid var(--gold-4); cursor: pointer; font-size: 14px; font-weight: 900; letter-spacing: 1px; background: transparent; color: var(--gold-2); transition: all 0.1s; display: none; }
  .btn-secondary:active { transform: translateY(2px); }

  /* HISTORY & RULES (Sideways scroll to save space) */
  .bottom-info { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
  
  .section-label { font-size: 8px; font-weight: 800; color: var(--gold-4); letter-spacing: 1px; margin-bottom: 2px; }
  
  .history-list { 
    display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px;
    -ms-overflow-style: none; scrollbar-width: none;
  }
  .history-list::-webkit-scrollbar { display: none; }
  .history-empty { color: #555; font-size: 9px; font-style: italic; padding: 4px 0; }
  .history-item { 
    display: flex; gap: 4px; align-items: center; background: rgba(20,20,20,0.8); 
    border: 1px solid rgba(250,204,21,0.2); border-radius: 6px; padding: 4px 8px; font-size: 9px; white-space: nowrap;
  }
  .h-round { color: #666; font-weight: 700; }
  .h-nums { color: var(--gold-4); font-weight: 700; }
  .h-points { font-weight: 900; }
  .h-points.win { color: var(--green); }
  .h-points.loss { color: #ef4444; }

  .prob-row { display: flex; justify-content: space-between; font-size: 9px; color: #888; padding: 1px 0; }
  .prob-row span:last-child { font-weight: 700; color: #ccc; }

  /* MUTE */
  .mute-btn { position: fixed; top: 8px; right: 8px; width: 28px; height: 28px; border-radius: 50%; background: rgba(0,0,0,0.6); border: 1px solid rgba(250, 204, 21, 0.3); color: var(--gold-4); display: flex; justify-content: center; align-items: center; cursor: pointer; z-index: 100; }
  .mute-btn svg { width: 14px; height: 14px; }

  /* FLOATING TEXT */
  .floating-pts { position: fixed; font-size: 24px; font-weight: 900; pointer-events: none; z-index: 500; animation: floatUp 1.5s ease-out forwards; }
  .floating-pts.win { color: var(--gold-2); text-shadow: 0 0 15px rgba(250, 204, 21, 1); }
  .floating-pts.loss { color: #ef4444; text-shadow: 0 0 15px rgba(239, 68, 68, 1); }
  @keyframes floatUp { 0% { opacity: 0; transform: translateY(0) scale(0.5); } 20% { opacity: 1; transform: translateY(-15px) scale(1.1); } 100% { opacity: 0; transform: translateY(-80px) scale(0.8); } }

  /* JACKPOT OVERLAY */
  .jackpot-overlay { position: fixed; inset: 0; background: radial-gradient(circle at 50% 50%, rgba(250, 204, 21, 0.4) 0%, rgba(0, 0, 0, 0.98) 70%); display: none; justify-content: center; align-items: center; flex-direction: column; z-index: 1000; padding: 20px; text-align: center; }
  .jackpot-overlay.active { display: flex; }
  .jp-rays { position: absolute; inset: 0; background: conic-gradient(from 0deg, transparent 0deg, rgba(250,204,21,0.2) 20deg, transparent 40deg, transparent 60deg, rgba(250,204,21,0.2) 80deg, transparent 100deg, transparent 120deg, rgba(250,204,21,0.2) 140deg, transparent 160deg, transparent 180deg, rgba(250,204,21,0.2) 200deg, transparent 220deg, transparent 240deg, rgba(250,204,21,0.2) 260deg, transparent 280deg, transparent 300deg, rgba(250,204,21,0.2) 320deg, transparent 340deg); animation: raysRotate 10s linear infinite; pointer-events: none; }
  @keyframes raysRotate { to { transform: rotate(360deg); } }
  .jp-content { position: relative; z-index: 2; }
  .jp-title { font-size: 28px; font-weight: 900; letter-spacing: 3px; background: linear-gradient(180deg, #fff 0%, var(--gold-2) 40%, var(--gold-5) 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px; }
  .jp-points { font-size: 50px; font-weight: 900; color: #fff; text-shadow: 0 0 30px rgba(250, 204, 21, 1); line-height: 1; margin-bottom: 20px; }
  .jp-btn { padding: 12px 40px; border-radius: 30px; border: 2px solid var(--gold-2); background: var(--gold-3); color: #000; font-size: 14px; font-weight: 900; cursor: pointer; box-shadow: 0 4px 0 var(--gold-6); }
  .jp-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--gold-6); }

  .sparkle { position: absolute; border-radius: 50%; pointer-events: none; }
  @keyframes sparkleFall { 0% { transform: translateY(-100vh) rotate(0deg); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translateY(100vh) rotate(720deg); opacity: 0; } }

  /* --- NUMBER THEMED LOADER --- */
  #loaderOverlay { 
    position: fixed; inset: 0; z-index: 99999; 
    background: radial-gradient(circle at center, #1c1000 0%, #000 100%); 
    display: flex; flex-direction: column; justify-content: center; align-items: center; 
    transition: opacity 0.5s ease; 
  }
  .loader-content { position: relative; z-index: 2; text-align: center; width: 100%; max-width: 300px; }
  
  .loader-numbers {
    display: flex; justify-content: center; gap: 10px; margin-bottom: 25px;
  }
  .loader-num {
    width: 40px; height: 40px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #fff9c4, #facc15 40%, #a16207 100%);
    border: 2px solid #fde047;
    display: flex; justify-content: center; align-items: center;
    font-size: 16px; font-weight: 900; color: #451a03;
    animation: bounceNum 1.2s ease-in-out infinite alternate;
    box-shadow: 0 0 15px rgba(250, 204, 21, 0.4);
  }
  .loader-num:nth-child(1) { animation-delay: 0s; }
  .loader-num:nth-child(2) { animation-delay: 0.2s; }
  .loader-num:nth-child(3) { animation-delay: 0.4s; }
  
  @keyframes bounceNum {
    0% { transform: translateY(0); filter: brightness(0.8); }
    100% { transform: translateY(-15px); filter: brightness(1.2); }
  }

  .loader-title { font-size: 24px; font-weight: 900; color: #facc15; letter-spacing: 2px; margin-bottom: 5px; text-shadow: 0 0 10px rgba(250, 204, 21, 0.5); }
  .loader-sub { font-size: 12px; color: #aaa; font-weight: 700; margin-bottom: 25px; letter-spacing: 1px; }
  
  .loader-track { 
    width: 100%; height: 12px; background: rgba(0,0,0,0.8); 
    border-radius: 10px; overflow: hidden; border: 1px solid rgba(250, 204, 21, 0.3); 
    box-shadow: inset 0 0 10px rgba(0,0,0,1); 
  }
  .loader-fill { 
    height: 100%; width: 0%; 
    background: linear-gradient(90deg, #a16207, #facc15, #fff); 
    border-radius: 10px; 
    transition: width 0.3s ease; 
    box-shadow: 0 0 10px #facc15; 
  }
  .loader-percent { margin-top: 10px; font-size: 13px; font-weight: 900; color: #facc15; letter-spacing: 1px; }

</style>
</head>
<body>

<!-- LOADING SCREEN -->
<div id="loaderOverlay">
  <div class="loader-content">
    <div class="loader-numbers">
      <div class="loader-num">7</div>
      <div class="loader-num">3</div>
      <div class="loader-num">12</div>
    </div>
    <div class="loader-title">JAKIPOT</div>
    <div class="loader-sub">Loading Lucky Numbers...</div>
    <div class="loader-track"><div class="loader-fill" id="loaderFill"></div></div>
    <div class="loader-percent" id="loaderPercent">0%</div>
  </div>
</div>

<div class="starfield"></div>

<button class="mute-btn" id="muteBtn">
  <svg id="muteIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
</button>

<div class="app">
  <div class="header">
    <div class="brand">JAKIPOT</div>
    <div class="title">LUCKY NUMBER HUNT</div>
  </div>

  <div class="top-row">
    <div class="jackpot-hero">
      <div class="jackpot-label">JACKPOT</div>
      <div class="jackpot-amount">150x</div>
    </div>
    <div class="stats-col">
      <div class="stat-box">
        <div class="stat-label">BAL</div>
        <div class="stat-value" id="balance">Loading...</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">RND</div>
        <div class="stat-value" id="roundNum">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">BEST</div>
        <div class="stat-value" id="personalBest">0</div>
      </div>
    </div>
  </div>

  <!-- DISPLAY AREA -->
  <div class="display-area" id="displayArea">
    <div class="display-slot">
      <div class="display-number" id="displayNumber">?</div>
    </div>
    <div class="display-text-col">
      <div class="display-label">DRAWN NUMBER</div>
      <div class="display-result" id="displayResult">Select a number</div>
    </div>
  </div>

  <!-- NUMBER BOARD -->
  <div class="board-label">SELECT YOUR LUCKY NUMBER</div>
  <div class="number-grid" id="numberGrid"></div>

  <p class="instruction" id="instruction">Pick a number from 1 to 12</p>

  <!-- BETTING -->
  <div class="bet-panel">
    <button class="bet-btn" id="betMinusBtn" type="button">−</button>
    <div class="bet-center">
      <div class="bet-amount" id="betAmount">10</div>
      <div class="bet-label">BET</div>
      <button class="max-bet-btn" id="maxBetBtn" type="button">MAX</button>
    </div>
    <button class="bet-btn" id="betPlusBtn" type="button">+</button>
  </div>

  <div class="actions">
    <button class="btn-primary" id="confirmBtn" disabled>CONFIRM PICK</button>
    <button class="btn-secondary" id="playAgainBtn">PLAY AGAIN</button>
  </div>

  <!-- BOTTOM INFO -->
  <div class="bottom-info">
    <div>
      <div class="section-label">RECENT HISTORY</div>
      <div class="history-list" id="historyList">
        <div class="history-empty">No history</div>
      </div>
    </div>
    <div>
      <div class="section-label">RULES</div>
      <div class="prob-row"><span>No Match</span><span>0x</span></div>
      <div class="prob-row"><span>Match (12 balls / 24 pool)</span><span>10x - 150x</span></div>
    </div>
  </div>
</div>

<!-- JACKPOT OVERLAY -->
<div class="jackpot-overlay" id="jackpotOverlay">
  <div class="jp-rays"></div>
  <div class="jp-content">
    <div class="jp-title">GRAND JACKPOT!</div>
    <div class="jp-points" id="jpPoints">+0</div>
    <button class="jp-btn" id="jpContinueBtn">CONTINUE</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
  import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBpKp2TePXAmJjc_qR-bJPCZJ123QsCyxw",
    authDomain: "jakipot.firebaseapp.com",
    projectId: "jakipot",
    storageBucket: "jakipot.firebasestorage.app",
    messagingSenderId: "396191754293",
    appId: "1:396191754293:web:5b11a11d82e773d19ee97c",
    measurementId: "G-L1CLB5TDHV"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let currentUser = null;
  let balance = 0;
  let currencySymbol = 'K';
  let currentBet = 10;
  let personalBest = 0;
  let roundNumber = 0;
  let isMuted = localStorage.getItem('jakipotNumberMuted') === 'true';
  let history = [];
  let gameState = 'IDLE';
  let selectedNum = null;

  const CURRENCY_MAP = { 'ZMW': 'K', 'USD': '$', 'NGN': '₦', 'EUR': '€', 'GBP': '£', 'ZAR': 'R', 'KES': 'KSh', 'GHS': 'GH₵', 'TZS': 'TSh', 'UGX': 'USh', 'BWP': 'P', 'MWK': 'MK', 'MZN': 'MT', 'NAD': 'N$', 'AOA': 'Kz', 'PHP': '₱', 'IDR': 'Rp', 'PKR': '₨', 'BDT': '৳' };

  const balanceEl = document.getElementById('balance');
  const roundNumEl = document.getElementById('roundNum');
  const personalBestEl = document.getElementById('personalBest');
  const betAmountEl = document.getElementById('betAmount');
  const instruction = document.getElementById('instruction');
  const numberGrid = document.getElementById('numberGrid');
  const confirmBtn = document.getElementById('confirmBtn');
  const playAgainBtn = document.getElementById('playAgainBtn');
  const historyList = document.getElementById('historyList');
  const betMinusBtn = document.getElementById('betMinusBtn');
  const betPlusBtn = document.getElementById('betPlusBtn');
  const maxBetBtn = document.getElementById('maxBetBtn');
  const displayArea = document.getElementById('displayArea');
  const displayNumber = document.getElementById('displayNumber');
  const displayResult = document.getElementById('displayResult');
  const muteBtn = document.getElementById('muteBtn');
  const muteIcon = document.getElementById('muteIcon');
  const jackpotOverlay = document.getElementById('jackpotOverlay');
  const jpPoints = document.getElementById('jpPoints');
  const jpContinueBtn = document.getElementById('jpContinueBtn');
  const loaderOverlay = document.getElementById('loaderOverlay');
  const loaderFill = document.getElementById('loaderFill');
  const loaderPercent = document.getElementById('loaderPercent');

  const SVG_UNMUTED = `<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>`;
  const SVG_MUTED = `<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>`;

  function updateMuteIcon() { muteIcon.innerHTML = isMuted ? SVG_MUTED : SVG_UNMUTED; }
  updateMuteIcon();

  muteBtn.addEventListener('click', () => {
    isMuted = !isMuted;
    localStorage.setItem('jakipotNumberMuted', isMuted);
    updateMuteIcon();
    if (!isMuted) initAudio();
  });

  // Loader Progress
  let loadProgress = 0;
  const loaderInterval = setInterval(() => {
    if (loadProgress < 90) { loadProgress += Math.random() * 15; updateLoader(loadProgress); }
  }, 100);
  function updateLoader(val) { loaderFill.style.width = val + '%'; loaderPercent.textContent = Math.floor(val) + '%'; }
  function finishLoading() {
    clearInterval(loaderInterval); updateLoader(100);
    setTimeout(() => { loaderOverlay.style.opacity = '0'; setTimeout(() => loaderOverlay.style.display = 'none', 500); }, 400);
  }

  let audioCtx = null;
  function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); }
  function playTone(freq, duration, type, volume) {
    if (isMuted || !audioCtx) return;
    const t = audioCtx.currentTime; const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
    osc.type = type || 'sine'; osc.frequency.setValueAtTime(freq, t);
    gain.gain.setValueAtTime(volume || 0.1, t); gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
    osc.connect(gain).connect(audioCtx.destination); osc.start(t); osc.stop(t + duration);
  }
  function playSelect() { playTone(800, 0.08, 'sine', 0.08); }
  function playDrawTick() { playTone(500 + Math.random() * 300, 0.04, 'square', 0.04); }
  function playWin() { [523, 659, 783].forEach((f, i) => setTimeout(() => playTone(f, 0.25, 'sine', 0.1), i * 100)); }
  function playLose() { playTone(150, 0.4, 'sawtooth', 0.1); }
  function playJackpot() { [523, 659, 783, 1046, 1318, 1568].forEach((f, i) => setTimeout(() => playTone(f, 0.4, 'triangle', 0.12), i * 100)); }

  onAuthStateChanged(auth, (user) => {
    if (!user) { window.location.replace('login.html'); return; }
    currentUser = user;

    onSnapshot(doc(db, 'users', user.uid), (snap) => {
      if (snap.exists()) {
        const userCurrency = snap.data().currency || 'ZMW';
        currencySymbol = CURRENCY_MAP[userCurrency] || userCurrency;
        updateBetUI();
      }
    });

    onSnapshot(doc(db, 'wallets', user.uid), (snap) => {
      if (snap.exists()) {
        balance = snap.data().balance || 0;
        balanceEl.textContent = `${currencySymbol} ${balance.toLocaleString(undefined, {minimumFractionDigits: 2})}`;
        finishLoading();
      }
    });
  });

  function buildGrid() {
    numberGrid.innerHTML = '';
    for (let i = 1; i <= 12; i++) {
      const ball = document.createElement('div');
      ball.className = 'num-ball';
      ball.textContent = i;
      ball.dataset.num = i;
      ball.addEventListener('click', () => selectNumber(i, ball));
      numberGrid.appendChild(ball);
    }
  }

  function selectNumber(num, el) {
    if (gameState !== 'IDLE') return;
    if (balance < currentBet) {
      instruction.textContent = 'Not enough balance!';
      instruction.style.color = '#ef4444';
      setTimeout(() => { instruction.textContent = 'Pick a number from 1 to 12'; instruction.style.color = '#a3a3a3'; }, 2000);
      return;
    }
    document.querySelectorAll('.num-ball').forEach(b => b.classList.remove('selected'));
    el.classList.add('selected');
    selectedNum = num;
    gameState = 'SELECTED';
    confirmBtn.disabled = false;
    instruction.textContent = `Picked ${num}. Confirm to draw!`;
    instruction.style.color = '#facc15';
    displayResult.textContent = `You selected number ${num}`;
    displayResult.className = 'display-result';
    displayNumber.textContent = num;
    playSelect();
  }

  function updateBetUI() {
    betAmountEl.textContent = currentBet.toLocaleString();
    betAmountEl.classList.remove('flash');
    void betAmountEl.offsetWidth;
    betAmountEl.classList.add('flash');
    setTimeout(() => betAmountEl.classList.remove('flash'), 200);
  }

  function changeBet(amount) {
    if (gameState !== 'IDLE') return;
    let newBet = currentBet + amount;
    if (newBet < 10) newBet = 10;
    const maxAllowed = Math.min(balance, 1000);
    if (newBet > maxAllowed) newBet = Math.max(10, maxAllowed);
    if (newBet !== currentBet) {
      currentBet = newBet;
      updateBetUI();
      playSelect();
    }
  }

  betMinusBtn.addEventListener('click', (e) => { e.preventDefault(); changeBet(-10); });
  betPlusBtn.addEventListener('click', (e) => { e.preventDefault(); changeBet(10); });
  maxBetBtn.addEventListener('click', (e) => { e.preventDefault(); if (gameState === 'IDLE') changeBet(Math.min(balance, 1000) - currentBet); });

  async function confirmDraw() {
    if (gameState !== 'SELECTED') return;
    gameState = 'DRAWING';
    confirmBtn.disabled = true;
    document.querySelectorAll('.num-ball').forEach(b => b.classList.add('disabled'));
    instruction.textContent = 'Drawing...';
    instruction.style.color = '#a3a3a3';
    displayResult.textContent = 'Drawing...';
    displayResult.className = 'display-result';
    displayArea.classList.remove('jackpot-win');
    
    displayNumber.classList.add('draw-anim');
    
    // 1. FAKE DRAW ANIMATION (Spins instantly to hide Vercel delay)
    let cycleCount = 0;
    const cycleInterval = setInterval(() => {
      displayNumber.textContent = Math.floor(Math.random() * 24) + 1;
      if (cycleCount % 2 === 0) playDrawTick();
      cycleCount++;
    }, 50);

    try {
      // 2. CALL SECURE VERCEL BACKEND
      const idToken = await currentUser.getIdToken();
      const response = await fetch('https://jakipot.vercel.app/api/play', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${idToken}` },
        body: JSON.stringify({ gameType: 'lucky_number', betAmount: currentBet, selectedNum: selectedNum })
      });

      const data = await response.json();
      if (data.error) throw new Error(data.error);

      // 3. STOP ANIMATION AND SHOW REAL RESULT
      clearInterval(cycleInterval);
      displayNumber.classList.remove('draw-anim');
      
      const winData = data.winData;
      const winAmount = data.payoutAmount;
      
      balance = data.newBalance;
      balanceEl.textContent = `${currencySymbol} ${balance.toLocaleString(undefined, {minimumFractionDigits: 2})}`;

      displayNumber.textContent = winData.drawnNum;
      
      if (winAmount > 0) {
        if (winAmount > personalBest) {
          personalBest = winAmount;
          personalBestEl.textContent = personalBest.toLocaleString();
        }
        instruction.textContent = `${winData.resultName}!`;
        instruction.style.color = '#facc15';
        displayResult.textContent = `${winData.resultName} · +${winAmount.toLocaleString()}`;
        displayResult.className = 'display-result win';
        
        if (winData.resultName === 'Jackpot Match') {
          displayArea.classList.add('jackpot-win');
          displayResult.className = 'display-result jackpot';
          playJackpot();
          jpPoints.textContent = '+' + winAmount.toLocaleString();
          jackpotOverlay.classList.add('active');
        } else {
          playWin();
        }
        showFloatingPoints(winAmount, true);
      } else {
        instruction.textContent = `No match. Lost.`;
        instruction.style.color = '#ef4444';
        displayResult.textContent = `Drawn ${winData.drawnNum} · No Match`;
        displayResult.className = 'display-result lose';
        playLose();
        showFloatingPoints(-currentBet, false);
      }

      addHistory(selectedNum, winData.drawnNum, winData.resultName, winAmount);
      
      roundNumber++;
      roundNumEl.textContent = roundNumber;
      gameState = 'REVEALED';
      confirmBtn.style.display = 'none';
      playAgainBtn.style.display = 'flex';
      
      if (balance < currentBet) { 
        currentBet = Math.max(10, Math.min(balance, 1000)); 
        betAmountEl.textContent = currentBet; 
      }

    } catch (error) {
      clearInterval(cycleInterval);
      displayNumber.classList.remove('draw-anim');
      console.error("Server Error:", error);
      alert(error.message || "Failed to draw number.");
      
      // Refund UI if server fails
      displayNumber.textContent = '?';
      displayResult.textContent = 'Error occurred';
      instruction.textContent = 'Something went wrong. Try again.';
      
      gameState = 'IDLE';
      confirmBtn.disabled = false;
      document.querySelectorAll('.num-ball').forEach(b => b.classList.remove('disabled'));
    }
  }

  confirmBtn.addEventListener('click', confirmDraw);

  function resetGame() {
    gameState = 'IDLE';
    selectedNum = null;
    displayNumber.textContent = '?';
    displayResult.textContent = 'Select a number';
    displayResult.className = 'display-result';
    displayArea.classList.remove('jackpot-win');
    document.querySelectorAll('.num-ball').forEach(b => b.classList.remove('selected', 'disabled'));
    confirmBtn.disabled = true;
    confirmBtn.style.display = 'flex';
    playAgainBtn.style.display = 'none';
    instruction.textContent = 'Pick a number from 1 to 12';
    instruction.style.color = '#a3a3a3';
  }

  function addHistory(sel, draw, result, pts) {
    history.unshift({ round: roundNumber, sel, draw, result, pts });
    if (history.length > 10) history.pop();
    
    historyList.innerHTML = '';
    if (history.length === 0) {
      historyList.innerHTML = '<div class="history-empty">No history</div>';
      return;
    }
    
    history.forEach(h => {
      const div = document.createElement('div');
      div.className = 'history-item';
      const ptsClass = h.pts > 0 ? 'win' : 'loss';
      div.innerHTML = `<span class="h-round">#${h.round}</span> <span class="h-nums">${h.sel}→${h.draw}</span> <span class="h-points ${ptsClass}">${h.pts > 0 ? '+' + h.pts : '0'}</span>`;
      historyList.appendChild(div);
    });
  }

  function showFloatingPoints(points, isWin) {
    const el = document.createElement('div');
    el.className = 'floating-pts ' + (isWin ? 'win' : 'loss');
    el.textContent = (points > 0 ? '+' : '') + points.toLocaleString();
    el.style.left = '50%';
    el.style.top = '30%';
    el.style.transform = 'translate(-50%, -50%)';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1500);
  }

  jpContinueBtn.addEventListener('click', () => { jackpotOverlay.classList.remove('active'); });
  playAgainBtn.addEventListener('click', resetGame);

  buildGrid();
  betAmountEl.textContent = currentBet.toLocaleString();
  document.body.addEventListener('pointerdown', initAudio, { once: true });

</script>
</body>
</html>
