<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>JAKIPOT - Lucky Target</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Segoe UI', Roboto, sans-serif; }

  :root {
    --gold-1: #fef9c3; --gold-2: #fde047; --gold-3: #facc15;
    --gold-4: #eab308; --gold-5: #a16207; --gold-6: #78350f;
    --dark-0: #050505; --dark-1: #0a0a0a; --dark-2: #1a1a1a;
    --red: #dc2626; --green: #10b981;
  }

  html, body {
    background: var(--dark-0);
    background-image:
      radial-gradient(ellipse at 50% 0%, #1c1000 0%, transparent 55%),
      radial-gradient(ellipse at 50% 100%, #0a0500 0%, transparent 60%),
      radial-gradient(ellipse at 50% 50%, #0a0a0a 0%, #000 100%);
    height: 100vh; width: 100vw; overflow: hidden;
    color: #f5f5f5; font-size: 14px;
    display: flex; justify-content: center;
  }

  .starfield {
    position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: 0.4;
    background-image:
      radial-gradient(1px 1px at 15% 25%, #fff, transparent),
      radial-gradient(1px 1px at 75% 40%, #fff, transparent),
      radial-gradient(1px 1px at 40% 70%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 85% 15%, #fde047, transparent),
      radial-gradient(1px 1px at 60% 85%, #fff, transparent),
      radial-gradient(1px 1px at 25% 90%, #fde047, transparent);
    animation: twinkle 4s ease-in-out infinite;
  }
  @keyframes twinkle { 0%,100% { opacity: 0.4; } 50% { opacity: 0.7; } }

  .app { 
    position: relative; z-index: 1; max-width: 480px; 
    width: 100%; padding: 8px 12px; height: 100%;
    display: flex; flex-direction: column; justify-content: space-between;
  }

  /* HEADER */
  .header { text-align: center; margin-bottom: 4px; }
  .brand { font-size: 10px; font-weight: 900; color: var(--gold-4); letter-spacing: 4px; text-shadow: 0 0 10px rgba(250,204,21,0.4); }
  .title {
    font-size: 20px; font-weight: 900;
    background: linear-gradient(180deg, var(--gold-1) 0%, var(--gold-3) 40%, var(--gold-5) 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    letter-spacing: 1px; line-height: 1; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
  }

  /* STATS ROW */
  .stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 6px; }
  .stat-box { background: linear-gradient(180deg, rgba(30, 30, 30, 0.9) 0%, rgba(10, 10, 10, 0.9) 100%); border: 1px solid rgba(250, 204, 21, 0.25); border-radius: 8px; padding: 4px 8px; text-align: center; display: flex; justify-content: space-between; align-items: center; }
  .stat-label { font-size: 8px; font-weight: 800; color: #888; letter-spacing: 0.5px; }
  .stat-value { font-size: 13px; font-weight: 900; color: var(--gold-2); text-shadow: 0 0 8px rgba(250, 204, 21, 0.3); }
  .stat-value.pulse { animation: statPulse 0.6s ease-out; }
  @keyframes statPulse { 0% { transform: scale(1); } 50% { transform: scale(1.3); color: #fff; } 100% { transform: scale(1); } }

  /* TARGET */
  .target-container {
    position: relative; flex: 1; display: flex; justify-content: center; align-items: center;
    min-height: 0; margin-bottom: 6px;
  }
  .target-inner {
    position: relative;
    width: 100%;
    max-width: 260px;
    aspect-ratio: 1 / 1;
    background: radial-gradient(circle, rgba(250, 204, 21, 0.05) 0%, transparent 70%);
    border-radius: 50%;
    border: 2px solid rgba(120, 53, 15, 0.4);
    box-shadow: 0 0 40px rgba(0,0,0,0.8), inset 0 0 30px rgba(0,0,0,0.9);
    overflow: hidden;
  }

  #target-svg { width: 100%; height: 100%; display: block; }

  #aim-line {
    position: absolute;
    top: 0; bottom: 0;
    width: 3px;
    background: linear-gradient(180deg, transparent, #fff, #facc15, #fff, transparent);
    box-shadow: 0 0 15px #facc15, 0 0 30px #facc15;
    left: 50%;
    transform: translateX(-50%);
    pointer-events: none;
    opacity: 0;
    z-index: 10;
  }
  #aim-line.active { opacity: 1; }

  #dart-wrapper {
    position: absolute;
    bottom: -50px;
    left: 50%;
    transform: translateX(-50%);
    width: 26px;
    height: 90px;
    pointer-events: none;
    z-index: 20;
    opacity: 0;
    transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.1s;
  }
  #dart-wrapper.throwing { opacity: 1; }

  #hit-marker {
    position: absolute;
    width: 18px; height: 18px;
    border-radius: 50%;
    border: 2px solid #fff;
    background: rgba(255,255,255,0.2);
    box-shadow: 0 0 15px #fff, 0 0 30px #facc15;
    transform: translate(-50%, -50%) scale(0);
    pointer-events: none;
    z-index: 15;
    transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  #hit-marker.show { transform: translate(-50%, -50%) scale(1); }
  #hit-marker.miss { border-color: #ef4444; box-shadow: 0 0 15px #ef4444, 0 0 30px #ef4444; background: rgba(239,68,68,0.3); }

  /* CONTROLS */
  .controls { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }

  .instruction { text-align: center; font-size: 11px; color: #a3a3a3; font-weight: 600; height: 14px; transition: all 0.3s; }
  .instruction.highlight { color: var(--gold-2); font-weight: 700; }

  .bet-panel {
    display: flex; justify-content: space-between; align-items: center;
    background: rgba(20, 20, 20, 0.9); border: 1px solid rgba(250, 204, 21, 0.3);
    border-radius: 8px; padding: 4px 8px;
  }
  .bet-btn {
    width: 34px; height: 34px; border-radius: 8px;
    border: 1.5px solid var(--gold-4);
    background: rgba(250, 204, 21, 0.15);
    color: var(--gold-2); font-size: 20px; font-weight: 900;
    cursor: pointer; display: flex; justify-content: center; align-items: center;
    user-select: none;
  }
  .bet-btn:active { transform: scale(0.88); }
  .bet-center { display: flex; flex-direction: column; align-items: center; flex: 1; }
  .bet-amount { font-size: 16px; font-weight: 900; color: #fff; transition: all 0.15s; }
  .bet-amount.flash { transform: scale(1.3); color: var(--gold-2); }
  .bet-label { font-size: 7px; color: #888; font-weight: 700; }
  .max-bet-btn {
    background: var(--gold-3); border: none; border-radius: 4px; color: #000;
    font-size: 8px; font-weight: 900; padding: 2px 8px; margin-top: 2px; cursor: pointer;
  }

  .actions { display: flex; flex-direction: column; gap: 6px; }
  .btn-primary { 
    width: 100%; height: 44px; border-radius: 10px; border: none; cursor: pointer; 
    font-size: 14px; font-weight: 900; letter-spacing: 1px; 
    background: linear-gradient(180deg, var(--green) 0%, #047857 100%); 
    color: #fff; box-shadow: 0 3px 0 #064e3b; 
    display: flex; justify-content: center; align-items: center; 
    transition: all 0.1s;
  }
  .btn-primary:active { transform: translateY(2px); box-shadow: 0 1px 0 #064e3b; }
  .btn-primary:disabled { background: #374151; color: #6b7280; box-shadow: 0 3px 0 #111827; cursor: not-allowed; }
  .btn-secondary { 
    width: 100%; height: 44px; border-radius: 10px; border: 2px solid var(--gold-4); 
    cursor: pointer; font-size: 14px; font-weight: 900; letter-spacing: 1px; 
    background: transparent; color: var(--gold-2); display: none;
  }
  .btn-secondary:active { transform: translateY(2px); }

  /* HISTORY (horizontal) */
  .history-list { 
    display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px;
    -ms-overflow-style: none; scrollbar-width: none; height: 22px;
  }
  .history-list::-webkit-scrollbar { display: none; }
  .history-empty { color: #555; font-size: 9px; font-style: italic; padding: 4px 0; }
  .history-item { 
    display: flex; gap: 4px; align-items: center; background: rgba(20,20,20,0.8); 
    border: 1px solid rgba(250,204,21,0.2); border-radius: 4px; padding: 2px 6px; 
    font-size: 9px; white-space: nowrap;
  }
  .h-round { color: #666; font-weight: 700; }
  .h-reward { color: var(--gold-4); font-weight: 700; }
  .h-points { font-weight: 900; }
  .h-points.win { color: var(--green); }
  .h-points.loss { color: #ef4444; }

  /* RULES (compact) */
  .rules-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .rule-item { display: flex; justify-content: space-between; font-size: 9px; color: #888; padding: 1px 0; }
  .rule-item span:first-child { display: flex; align-items: center; gap: 4px; }
  .rule-item span:last-child { font-weight: 700; color: #ccc; }
  .rule-dot { width: 6px; height: 6px; border-radius: 50%; }

  /* MUTE */
  .mute-btn { position: fixed; top: 8px; right: 8px; width: 28px; height: 28px; border-radius: 50%; background: rgba(0,0,0,0.6); border: 1px solid rgba(250, 204, 21, 0.3); color: var(--gold-4); display: flex; justify-content: center; align-items: center; cursor: pointer; z-index: 100; }
  .mute-btn svg { width: 14px; height: 14px; }

  /* FLOATING TEXT */
  .floating-pts { position: fixed; font-size: 22px; font-weight: 900; pointer-events: none; z-index: 500; animation: floatUp 1.5s ease-out forwards; }
  .floating-pts.win { color: var(--gold-2); text-shadow: 0 0 15px rgba(250, 204, 21, 1); }
  .floating-pts.loss { color: #ef4444; text-shadow: 0 0 15px rgba(239, 68, 68, 1); }
  @keyframes floatUp { 0% { opacity: 0; transform: translateY(0) scale(0.5); } 20% { opacity: 1; transform: translateY(-15px) scale(1.1); } 100% { opacity: 0; transform: translateY(-80px) scale(0.8); } }

  /* --- TARGET THEMED LOADER --- */
  #loaderOverlay { 
    position: fixed; inset: 0; z-index: 99999; 
    background: radial-gradient(circle at center, #1c1000 0%, #000 100%); 
    display: flex; flex-direction: column; justify-content: center; align-items: center; 
    transition: opacity 0.5s ease; 
  }
  .loader-content { position: relative; z-index: 2; text-align: center; width: 100%; max-width: 300px; }
  
  .loader-target-icon {
    width: 100px; height: 100px; margin: 0 auto 20px;
    border-radius: 50%;
    background: radial-gradient(circle, #facc15 0%, #dc2626 20%, #fff 40%, #333 60%, #000 100%);
    border: 4px solid rgba(250, 204, 21, 0.3);
    box-shadow: 0 0 30px rgba(250, 204, 21, 0.4);
    animation: targetPulse 1.5s ease-in-out infinite alternate;
    position: relative;
  }
  .loader-target-icon::after {
    content: ''; position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
    width: 4px; height: 110px; background: rgba(255,255,255,0.6);
    box-shadow: 0 0 10px #fff; animation: scanLine 1.5s ease-in-out infinite;
  }
  @keyframes targetPulse { 0% { transform: scale(0.95); } 100% { transform: scale(1.05); } }
  @keyframes scanLine { 0% { top: -10px; opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { top: 100px; opacity: 0; } }

  .loader-title { font-size: 24px; font-weight: 900; color: #facc15; letter-spacing: 2px; margin-bottom: 5px; text-shadow: 0 0 10px rgba(250, 204, 21, 0.5); }
  .loader-sub { font-size: 12px; color: #aaa; font-weight: 700; margin-bottom: 25px; letter-spacing: 1px; }
  
  .loader-track { 
    width: 100%; height: 12px; background: rgba(0,0,0,0.8); 
    border-radius: 10px; overflow: hidden; border: 1px solid rgba(250, 204, 21, 0.3); 
    box-shadow: inset 0 0 10px rgba(0,0,0,1); 
  }
  .loader-fill { 
    height: 100%; width: 0%; 
    background: linear-gradient(90deg, #a16207, #facc15, #fff); 
    border-radius: 10px; 
    transition: width 0.3s ease; 
    box-shadow: 0 0 10px #facc15; 
  }
  .loader-percent { margin-top: 10px; font-size: 13px; font-weight: 900; color: #facc15; letter-spacing: 1px; }

  @media (max-width: 380px) {
    .title { font-size: 18px; }
    .target-inner { max-width: 220px; }
  }
</style>
</head>
<body>

<!-- LOADING SCREEN -->
<div id="loaderOverlay">
  <div class="loader-content">
    <div class="loader-target-icon"></div>
    <div class="loader-title">JAKIPOT</div>
    <div class="loader-sub">Calibrating Target...</div>
    <div class="loader-track"><div class="loader-fill" id="loaderFill"></div></div>
    <div class="loader-percent" id="loaderPercent">0%</div>
  </div>
</div>

<div class="starfield"></div>

<button class="mute-btn" id="muteBtn">
  <svg id="muteIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
</button>

<div class="app">
  <div class="header">
    <div class="brand">JAKIPOT</div>
    <div class="title">LUCKY TARGET</div>
  </div>

  <div class="stats-row">
    <div class="stat-box">
      <div class="stat-label">BALANCE</div>
      <div class="stat-value" id="balance">Loading...</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">BEST</div>
      <div class="stat-value" id="personalBest">0</div>
    </div>
  </div>

  <div class="target-container">
    <div class="target-inner">
      <svg id="target-svg" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="t-bull" cx="50%" cy="50%"><stop offset="0%" stop-color="#ff4444"/><stop offset="100%" stop-color="#991b1b"/></radialGradient>
          <radialGradient id="t-inner" cx="50%" cy="50%"><stop offset="0%" stop-color="#facc15"/><stop offset="100%" stop-color="#a16207"/></radialGradient>
          <radialGradient id="t-middle" cx="50%" cy="50%"><stop offset="0%" stop-color="#262626"/><stop offset="100%" stop-color="#0a0a0a"/></radialGradient>
          <radialGradient id="t-outer" cx="50%" cy="50%"><stop offset="0%" stop-color="#92400e"/><stop offset="100%" stop-color="#451a03"/></radialGradient>
          <radialGradient id="t-miss" cx="50%" cy="50%"><stop offset="0%" stop-color="#1a1a1a"/><stop offset="100%" stop-color="#000"/></radialGradient>
        </defs>
        <circle cx="150" cy="150" r="145" fill="url(#t-miss)" stroke="#222" stroke-width="1"/>
        <circle cx="150" cy="150" r="105" fill="url(#t-outer)" stroke="#facc15" stroke-width="2"/>
        <circle cx="150" cy="150" r="70" fill="url(#t-middle)" stroke="#facc15" stroke-width="2"/>
        <circle cx="150" cy="150" r="30" fill="url(#t-inner)" stroke="#fff" stroke-width="2"/>
        <circle cx="150" cy="150" r="10" fill="url(#t-bull)" stroke="#fff" stroke-width="1.5"/>
        <line x1="150" y1="5" x2="150" y2="20" stroke="#facc15" stroke-width="2" opacity="0.4"/>
        <line x1="150" y1="280" x2="150" y2="295" stroke="#facc15" stroke-width="2" opacity="0.4"/>
        <line x1="5" y1="150" x2="20" y2="150" stroke="#facc15" stroke-width="2" opacity="0.4"/>
        <line x1="280" y1="150" x2="295" y2="150" stroke="#facc15" stroke-width="2" opacity="0.4"/>
      </svg>

      <div id="aim-line"></div>
      <div id="hit-marker"></div>

      <div id="dart-wrapper">
        <svg viewBox="0 0 30 100" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="dart-gold" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#fef9c3"/><stop offset="50%" stop-color="#facc15"/><stop offset="100%" stop-color="#a16207"/>
            </linearGradient>
          </defs>
          <path d="M 15 100 L 0 70 L 15 80 Z" fill="#dc2626" stroke="#000" stroke-width="1"/>
          <path d="M 15 100 L 30 70 L 15 80 Z" fill="#dc2626" stroke="#000" stroke-width="1"/>
          <rect x="13" y="40" width="4" height="40" fill="url(#dart-gold)" stroke="#78350f" stroke-width="1"/>
          <polygon points="15,0 12,40 18,40" fill="#e5e5e5" stroke="#404040" stroke-width="1"/>
        </svg>
      </div>
    </div>
  </div>

  <div class="controls">
    <p class="instruction" id="instruction">Set your bet and throw!</p>

    <div class="bet-panel">
      <button class="bet-btn" id="betMinusBtn">−</button>
      <div class="bet-center">
        <div class="bet-amount" id="betAmount">3</div>
        <div class="bet-label">BET</div>
        <button class="max-bet-btn" id="maxBetBtn">MAX</button>
      </div>
      <button class="bet-btn" id="betPlusBtn">+</button>
    </div>

    <div class="actions">
      <button class="btn-primary" id="throwBtn">THROW DART</button>
      <button class="btn-secondary" id="playAgainBtn">PLAY AGAIN</button>
    </div>

    <div class="history-list" id="historyList">
      <div class="history-empty">No throws yet</div>
    </div>

    <div class="rules-row">
      <div class="rule-item"><span><span class="rule-dot" style="background:#dc2626"></span>Bullseye</span><span>4x</span></div>
      <div class="rule-item"><span><span class="rule-dot" style="background:#facc15"></span>Inner</span><span>1.5x</span></div>
      <div class="rule-item"><span><span class="rule-dot" style="background:#525252"></span>Middle</span><span>0.5x</span></div>
      <div class="rule-item"><span><span class="rule-dot" style="background:#78350f"></span>Outer</span><span>0.15x</span></div>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
  import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBpKp2TePXAmJjc_qR-bJPCZJ123QsCyxw",
    authDomain: "jakipot.firebaseapp.com",
    projectId: "jakipot",
    storageBucket: "jakipot.firebasestorage.app",
    messagingSenderId: "396191754293",
    appId: "1:396191754293:web:5b11a11d82e773d19ee97c",
    measurementId: "G-L1CL5TDHV"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let currentUser = null;
  let balance = 0;
  let currencySymbol = 'K';
  let currentBet = 3;
  let personalBest = 0;
  let isMuted = localStorage.getItem('jakipotTargetMuted') === 'true';
  let history = [];
  let throwNumber = 0;

  let gameState = 'IDLE';
  let aimPosition = 0;
  let aimDirection = 1;
  let animationFrameId = null;

  const CURRENCY_MAP = { 'ZMW': 'K', 'USD': '$', 'NGN': '₦', 'EUR': '€', 'GBP': '£', 'ZAR': 'R', 'KES': 'KSh', 'GHS': 'GH₵', 'TZS': 'TSh', 'UGX': 'USh', 'BWP': 'P', 'MWK': 'MK', 'MZN': 'MT', 'NAD': 'N$', 'AOA': 'Kz', 'PHP': '₱', 'IDR': 'Rp', 'PKR': '₨', 'BDT': '৳' };

  const balanceEl = document.getElementById('balance');
  const personalBestEl = document.getElementById('personalBest');
  const betAmountEl = document.getElementById('betAmount');
  const instruction = document.getElementById('instruction');
  const throwBtn = document.getElementById('throwBtn');
  const playAgainBtn = document.getElementById('playAgainBtn');
  const historyList = document.getElementById('historyList');
  const betMinusBtn = document.getElementById('betMinusBtn');
  const betPlusBtn = document.getElementById('betPlusBtn');
  const maxBetBtn = document.getElementById('maxBetBtn');
  const aimLine = document.getElementById('aim-line');
  const dartWrapper = document.getElementById('dart-wrapper');
  const hitMarker = document.getElementById('hit-marker');
  const targetInner = document.querySelector('.target-inner');
  const muteBtn = document.getElementById('muteBtn');
  const muteIcon = document.getElementById('muteIcon');
  const loaderOverlay = document.getElementById('loaderOverlay');
  const loaderFill = document.getElementById('loaderFill');
  const loaderPercent = document.getElementById('loaderPercent');

  const SVG_UNMUTED = `<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>`;
  const SVG_MUTED = `<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>`;

  function updateMuteIcon() { muteIcon.innerHTML = isMuted ? SVG_MUTED : SVG_UNMUTED; }
  updateMuteIcon();

  muteBtn.addEventListener('click', () => {
    isMuted = !isMuted;
    localStorage.setItem('jakipotTargetMuted', isMuted);
    updateMuteIcon();
    if (!isMuted) initAudio();
  });

  // Loader Progress
  let loadProgress = 0;
  const loaderInterval = setInterval(() => {
    if (loadProgress < 90) { loadProgress += Math.random() * 15; updateLoader(loadProgress); }
  }, 100);
  function updateLoader(val) { loaderFill.style.width = val + '%'; loaderPercent.textContent = Math.floor(val) + '%'; }
  function finishLoading() {
    clearInterval(loaderInterval); updateLoader(100);
    setTimeout(() => { loaderOverlay.style.opacity = '0'; setTimeout(() => loaderOverlay.style.display = 'none', 500); }, 400);
  }

  let audioCtx = null;
  function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); }
  function playTone(freq, duration, type, volume) {
    if (isMuted || !audioCtx) return;
    const t = audioCtx.currentTime; const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
    osc.type = type || 'sine'; osc.frequency.setValueAtTime(freq, t);
    gain.gain.setValueAtTime(volume || 0.1, t); gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
    osc.connect(gain).connect(audioCtx.destination); osc.start(t); osc.stop(t + duration);
  }
  function playAimSound() { playTone(400, 0.05, 'sine', 0.05); }
  function playThrowSound() { playTone(600, 0.2, 'triangle', 0.1); }
  function playWinSound() { [523, 659, 783].forEach((f, i) => setTimeout(() => playTone(f, 0.25, 'sine', 0.1), i * 100)); }
  function playLoseSound() { playTone(200, 0.4, 'sawtooth', 0.1); }
  function playBullseyeSound() { [523, 659, 783, 1046, 1318].forEach((f, i) => setTimeout(() => playTone(f, 0.3, 'triangle', 0.12), i * 80)); }

  onAuthStateChanged(auth, (user) => {
    if (!user) { window.location.replace('login.html'); return; }
    currentUser = user;

    onSnapshot(doc(db, 'users', user.uid), (snap) => {
      // ✅ FIXED: Removed () from exists
      if (snap.exists) {
        const userCurrency = snap.data().currency || 'ZMW';
        currencySymbol = CURRENCY_MAP[userCurrency] || userCurrency;
        updateBetDisplay();
      }
    });

    onSnapshot(doc(db, 'wallets', user.uid), (snap) => {
      // ✅ FIXED: Removed () from exists
      if (snap.exists) {
        balance = snap.data().balance || 0;
        balanceEl.textContent = `${currencySymbol} ${balance.toLocaleString(undefined, {minimumFractionDigits: 2})}`;
        finishLoading();
      }
    });
  });

  function changeBet(amount) {
    if (gameState === 'AIMING' || gameState === 'THROWING') return;
    let newBet = currentBet + amount;
    if (newBet < 3) newBet = 3;
    const maxBet = Math.min(balance, 1000);
    if (newBet > maxBet) newBet = maxBet;
    if (newBet < 3 && maxBet >= 3) newBet = 3;
    if (newBet !== currentBet) {
      currentBet = newBet;
      updateBetDisplay();
      playAimSound();
    }
  }

  function setMaxBet() {
    if (gameState === 'AIMING' || gameState === 'THROWING') return;
    const maxBet = Math.min(balance, 1000);
    if (maxBet >= 3) {
      currentBet = maxBet;
      updateBetDisplay();
      playAimSound();
    }
  }

  function updateBetDisplay() {
    betAmountEl.textContent = currentBet.toLocaleString();
    betAmountEl.classList.remove('flash');
    void betAmountEl.offsetWidth;
    betAmountEl.classList.add('flash');
    setTimeout(() => betAmountEl.classList.remove('flash'), 200);
  }

  betMinusBtn.addEventListener('click', (e) => { e.preventDefault(); changeBet(-3); });
  betPlusBtn.addEventListener('click', (e) => { e.preventDefault(); changeBet(3); });
  maxBetBtn.addEventListener('click', (e) => { e.preventDefault(); setMaxBet(); });

  function startAiming() {
    if (gameState !== 'IDLE' && gameState !== 'REVEALED') return;
    if (balance < currentBet) {
      instruction.textContent = 'Not enough balance!';
      instruction.style.color = '#ef4444';
      setTimeout(() => { instruction.textContent = 'Set your bet and throw!'; instruction.style.color = ''; }, 2000);
      return;
    }

    initAudio();
    gameState = 'AIMING';
    aimDirection = 1;
    aimPosition = -257;
    aimLine.classList.add('active');
    throwBtn.textContent = 'STOP & THROW!';
    throwBtn.style.background = 'linear-gradient(180deg, #dc2626 0%, #991b1b 100%)';
    throwBtn.style.boxShadow = '0 3px 0 #450a0a';
    instruction.textContent = 'Aim moving FAST... tap STOP!';
    instruction.classList.add('highlight');

    function animateAim() {
      if (gameState !== 'AIMING') return;
      aimPosition += aimDirection * 35;
      if (aimPosition >= 257) { aimPosition = 257; aimDirection = -1; }
      else if (aimPosition <= -257) { aimPosition = -257; aimDirection = 1; }
      
      const visualPercent = ((aimPosition + 257) / (257 * 2)) * 100;
      aimLine.style.left = visualPercent + '%';
      
      animationFrameId = requestAnimationFrame(animateAim);
    }
    animateAim();
  }

  async function stopAndThrow() {
    if (gameState !== 'AIMING') return;
    
    cancelAnimationFrame(animationFrameId);
    gameState = 'THROWING';
    aimLine.classList.remove('active');
    throwBtn.disabled = true;
    instruction.textContent = 'Dart is flying...';
    instruction.classList.remove('highlight');
    
    playThrowSound();

    // ✅ FIXED: Calculate startY and endY ONCE, before any setTimeout
    const rect = targetInner.getBoundingClientRect();
    const startY = rect.height + 50;
    const endY = (rect.height / 2) - 50;

    // 1. FAKE THROW ANIMATION (Throws to a random spot while waiting for Vercel)
    const fakePercent = 30 + Math.random() * 40;
    dartWrapper.classList.add('throwing');
    dartWrapper.style.transform = 'translateX(-50%) translateY(0px)';
    
    setTimeout(() => {
      dartWrapper.style.transform = `translateX(calc(${fakePercent}% - 50%)) translateY(${endY - startY}px)`;
    }, 50);

    try {
      // 2. CALL SECURE VERCEL BACKEND
      const idToken = await currentUser.getIdToken();
      const response = await fetch('https://jakipot.vercel.app/api/play', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${idToken}` },
        body: JSON.stringify({ gameType: 'lucky_target', betAmount: currentBet })
      });

      const data = await response.json();
      if (data.error) throw new Error(data.error);

      // 3. UPDATE BALANCE
      balance = data.newBalance;
      balanceEl.textContent = `${currencySymbol} ${balance.toLocaleString(undefined, {minimumFractionDigits: 2})}`;

      // 4. MOVE DART TO REAL RESULT (from server)
      const winData = data.winData;
      const winAmount = data.payoutAmount;
      const visualPercent = winData.visualPos;

      // ✅ FIXED: startY and endY are now in scope here
      setTimeout(() => {
        dartWrapper.style.transform = `translateX(calc(${visualPercent}% - 50%)) translateY(${endY - startY}px)`;
        
        setTimeout(() => {
          hitMarker.style.left = visualPercent + '%';
          hitMarker.style.top = '50%';
          
          if (winData.name === 'Miss') hitMarker.classList.add('miss');
          else hitMarker.classList.remove('miss');
          hitMarker.classList.add('show');

          if (winAmount > 0) {
            balanceEl.classList.remove('pulse');
            void balanceEl.offsetWidth;
            balanceEl.classList.add('pulse');
            
            if (winAmount > personalBest) {
              personalBest = winAmount;
              personalBestEl.textContent = personalBest.toLocaleString();
              personalBestEl.classList.remove('pulse');
              void personalBestEl.offsetWidth;
              personalBestEl.classList.add('pulse');
            }

            if (winData.name === 'Bullseye') {
              playBullseyeSound();
              instruction.textContent = `BULLSEYE! +${currencySymbol}${winAmount.toLocaleString()}!`;
              instruction.style.color = '#facc15';
            } else {
              playWinSound();
              instruction.textContent = `${winData.name} hit! +${currencySymbol}${winAmount.toLocaleString()}`;
              instruction.style.color = '#facc15';
            }

            showFloatingPoints(winAmount, visualPercent, true);
          } else {
            playLoseSound();
            instruction.textContent = `MISSED! Lost ${currencySymbol}${currentBet.toLocaleString()}`;
            instruction.style.color = '#ef4444';
            showFloatingPoints(-currentBet, visualPercent, false);
          }

          addHistory(winData.name, winAmount);
          
          gameState = 'REVEALED';
          throwBtn.style.display = 'none';
          playAgainBtn.style.display = 'flex';

        }, 400);
      }, 200);

    } catch (error) {
      console.error("Server Error:", error);
      alert(error.message || "Failed to throw dart.");
      resetGame();
    }
  }

  function resetGame() {
    gameState = 'IDLE';
    aimPosition = 0;
    aimLine.classList.remove('active');
    dartWrapper.classList.remove('throwing');
    dartWrapper.style.transform = 'translateX(-50%) translateY(0px)';
    hitMarker.classList.remove('show', 'miss');
    
    throwBtn.textContent = 'THROW DART';
    throwBtn.style.background = 'linear-gradient(180deg, var(--green) 0%, #047857 100%)';
    throwBtn.style.boxShadow = '0 3px 0 #064e3b';
    throwBtn.disabled = false;
    throwBtn.style.display = 'flex';
    playAgainBtn.style.display = 'none';
    
    instruction.textContent = 'Set your bet and throw!';
    instruction.classList.remove('highlight');
    instruction.style.color = '';

    if (balance < currentBet) {
      currentBet = Math.max(3, Math.min(balance, 1000));
      updateBetDisplay();
    }
  }

  function showFloatingPoints(points, xPercent, isWin) {
    const el = document.createElement('div');
    el.className = 'floating-pts ' + (isWin ? 'win' : 'loss');
    el.textContent = (points > 0 ? '+' : '') + points.toLocaleString();
    const rect = targetInner.getBoundingClientRect();
    el.style.left = `calc(${xPercent}% + ${rect.left}px)`;
    el.style.top = `calc(40% + ${rect.top}px)`;
    el.style.transform = 'translate(-50%, -50%)';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1500);
  }

  function addHistory(zoneName, amount) {
    throwNumber++;
    history.unshift({ num: throwNumber, zone: zoneName, amount });
    if (history.length > 10) history.pop();
    
    historyList.innerHTML = '';
    if (history.length === 0) {
      historyList.innerHTML = '<div class="history-empty">No throws yet</div>';
      return;
    }
    
    history.forEach((h) => {
      const div = document.createElement('div');
      div.className = 'history-item';
      const amountClass = h.amount > 0 ? 'win' : 'loss';
      div.innerHTML = `<span class="h-round">#${h.num}</span><span class="h-reward">${h.zone}</span><span class="h-points ${amountClass}">${h.amount > 0 ? '+' + h.amount.toLocaleString() : '0'}</span>`;
      historyList.appendChild(div);
    });
  }

  throwBtn.addEventListener('click', () => {
    if (gameState === 'IDLE' || gameState === 'REVEALED') startAiming();
    else if (gameState === 'AIMING') stopAndThrow();
  });

  playAgainBtn.addEventListener('click', resetGame);

  betAmountEl.textContent = currentBet.toLocaleString();
  document.body.addEventListener('pointerdown', initAudio, { once: true });

</script>
</body>
