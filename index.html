<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JAKIPOT - Welcome</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #040b16; 
            --cyan: #00D9FF; 
            --emerald: #10b981; 
            --text-white: #ffffff;
            --text-muted: #8b9bb4; 
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        
        body { 
            background: var(--bg-deep); color: var(--text-white); 
            height: 100vh; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; padding: 20px;
            background-image: radial-gradient(circle at 50% 0%, rgba(0, 217, 255, 0.15) 0%, transparent 60%);
            overflow: hidden;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 50px;
            animation: fadeInDown 1s ease;
        }

        .bird-icon {
            font-size: 80px;
            filter: drop-shadow(0 0 20px rgba(0, 217, 255, 0.5));
            margin-bottom: 15px;
            animation: float 3s ease-in-out infinite;
        }

        .title {
            font-size: 36px;
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--text-white);
        }

        .title span {
            color: var(--cyan);
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 500;
            margin-top: 10px;
            letter-spacing: 1px;
        }

        .action-buttons {
            width: 100%;
            max-width: 350px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            animation: fadeInUp 1s ease 0.3s forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        .btn {
            width: 100%;
            padding: 18px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-decoration: none;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            border: none;
        }

        .btn-register {
            background: var(--emerald);
            color: var(--text-white);
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.4);
        }

        .btn-register:hover, .btn-register:active {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.6);
        }

        .btn-login {
            background: transparent;
            color: var(--text-white);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-login:hover, .btn-login:active {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--cyan);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <div class="bird-icon">🐦</div>
        <div class="title">JAKI<span>POT</span></div>
        <div class="subtitle">GLOBAL INVESTMENT & GAMING</div>
    </div>

    <div class="action-buttons">
        <!-- Points to register.html -->
        <a href="register.html" class="btn btn-register">GET STARTED</a>
        
        <!-- Points to login.html -->
        <a href="login.html" class="btn btn-login">I ALREADY HAVE AN ACCOUNT</a>
    </div>

</body>
</html>
