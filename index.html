
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jakipot</title>
  <meta name="description" content="Welcome to Jakipot, your world of games.">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0b1020;
      color: white;
      font-family: Arial, sans-serif;
      min-height: 100vh;
    }

    header {
      padding: 20px;
      background: #151d33;
      text-align: center;
      border-bottom: 1px solid #293451;
    }

    header h1 {
      color: #58e6c5;
      font-size: 30px;
    }

    header p {
      color: #aab5cc;
      margin-top: 8px;
    }

    main {
      max-width: 900px;
      margin: auto;
      padding: 25px 16px;
    }

    .welcome {
      text-align: center;
      padding: 35px 15px;
    }

    .welcome h2 {
      font-size: 28px;
      margin-bottom: 12px;
    }

    .welcome p {
      color: #aab5cc;
      line-height: 1.6;
    }

    .games {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 15px;
      margin-top: 25px;
    }

    .game {
      background: #151d33;
      border: 1px solid #293451;
      border-radius: 14px;
      padding: 25px 15px;
      text-align: center;
    }

    .game .symbol {
      font-size: 35px;
      margin-bottom: 12px;
    }

    .game h3 {
      color: #58e6c5;
      margin-bottom: 8px;
    }

    .game p {
      color: #aab5cc;
      font-size: 13px;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #77839e;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <header>
    <h1>JAKIPOT</h1>
    <p>Your Game. Your Moment.</p>
  </header>

  <main>
    <section class="welcome">
      <h2>Welcome to Jakipot 🎮</h2>
      <p>Discover exciting games and enjoy your gaming experience.</p>
    </section>

    <section class="games">
      <div class="game">
        <div class="symbol">🎯</div>
        <h3>Arcade</h3>
        <p>Classic arcade fun</p>
      </div>

      <div class="game">
        <div class="symbol">🧩</div>
        <h3>Puzzle</h3>
        <p>Challenge your mind</p>
      </div>

      <div class="game">
        <div class="symbol">🏆</div>
        <h3>Challenges</h3>
        <p>Test your skills</p>
      </div>
    </section>
  </main>

  <footer>
    © 2026 Jakipot. All rights reserved.
  </footer>

</body>
</html>
