<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JAKIPOT - Super Spin</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --green-bg: #064e3b; 
            --gold-light: #fcf6ba;
            --gold-main: #bf953f;
            --gold-dark: #aa771c;
            --text-main: #ffffff;
            --emerald: #10b981;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; font-family: 'Roboto', sans-serif; }
        
        body { 
            background-color: var(--green-bg);
            background-image: 
                linear-gradient(45deg, rgba(0,0,0,0.6) 25%, transparent 25%, transparent 75%, rgba(0,0,0,0.6) 75%, rgba(0,0,0,0.6)),
                linear-gradient(45deg, rgba(0,0,0,0.6) 25%, transparent 25%, transparent 75%, rgba(0,0,0,0.6) 75%, rgba(0,0,0,0.6));
            background-size: 80px 80px;
            background-position: 0 0, 40px 40px;
            background-color: #053b2b;
            color: var(--text-main); 
            min-height: 100vh; 
            display: flex; flex-direction: column; align-items: center;
            overflow-y: auto; 
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: ''; position: fixed; inset: 0;
            background: radial-gradient(circle at 50% 50%, transparent 0%, rgba(0,0,0,0.8) 100%);
            pointer-events: none; z-index: 1;
        }

        .app-container {
            width: 100%; max-width: 500px; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            position: relative; z-index: 10; padding-bottom: 30px;
        }

        /* TOP BAR */
        .top-bar {
            width: 100%; display: flex; justify-content: space-between; align-items: center;
            padding: 15px 20px; z-index: 20; flex-shrink: 0;
        }
        .icon-btn {
            background: rgba(0,0,0,0.6); border: 2px solid rgba(255,255,255,0.3);
            color: #fff; width: 40px; height: 40px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-size: 20px; cursor: pointer; text-decoration: none;
        }
        
        .mute-btn {
            background: rgba(0,0,0,0.6); border: 2px solid rgba(255,255,255,0.3);
            color: #fff; width: 40px; height: 40px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer;
        }
        .mute-btn svg { width: 20px; height: 20px; fill: #fff; }
        
        .balance-display {
            display: flex; align-items: center; background: rgba(0,0,0,0.8);
            border: 2px solid var(--gold-main); border-radius: 20px;
            padding: 6px 15px; gap: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .coin-icon {
            width: 24px; height: 24px; border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #fcf6ba, #bf953f);
            display: flex; justify-content: center; align-items: center;
            font-size: 14px; color: #8b6508; font-weight: 900;
        }
        .balance-value { font-size: 16px; font-weight: 900; }

        /* WHEEL WRAPPER */
        .wheel-wrapper {
            position: relative; width: 95%; max-width: 400px;
            aspect-ratio: 1 / 1;
            margin: 10px 0 20px 0;
            flex-shrink: 0;
        }

        /* DARK OUTER RING */
        .outer-rim {
            position: absolute; inset: 0;
            border-radius: 50%;
            background: #0a0a0a;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.9), 0 10px 25px rgba(0,0,0,0.9);
            border: 2px solid #000;
            z-index: 1;
        }

        /* NEON LIGHT RING */
        .neon-ring {
            position: absolute; inset: 3%; 
            border-radius: 50%;
            border: 3px solid #222; 
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
            z-index: 2;
            transition: 0.3s;
        }
        .neon-ring.spinning {
            animation: neonFlash 0.3s infinite alternate;
        }
        @keyframes neonFlash {
            0% { border-color: #00e5ff; box-shadow: inset 0 0 15px #00e5ff, 0 0 15px #00e5ff; }
            50% { border-color: #f04491; box-shadow: inset 0 0 15px #f04491, 0 0 15px #f04491; }
            100% { border-color: #ffeb3b; box-shadow: inset 0 0 15px #ffeb3b, 0 0 15px #ffeb3b; }
        }

        /* GOLD INNER BORDER */
        .inner-rim {
            position: absolute; inset: 6%; 
            border-radius: 50%;
            background: transparent;
            border: 4px solid var(--gold-main);
            box-shadow: 0 0 15px rgba(191, 149, 63, 0.5);
            z-index: 3;
        }

        /* THE WHEEL */
        .wheel {
            position: absolute; inset: 0;
            border-radius: 50%; overflow: hidden;
            /* CSS transition is applied dynamically in JS to prevent glitching */
            z-index: 1;
        }

        /* CENTER HUB */
        .center-hub {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 24%; height: 24%; border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #4fc3f7, #0288d1, #01579b);
            border: 4px solid var(--gold-main);
            box-shadow: 0 0 20px rgba(0,0,0,0.8), inset 0 0 15px rgba(255,255,255,0.5);
            z-index: 10; display: flex; justify-content: center; align-items: center;
            font-family: 'Arial Black', sans-serif; font-size: 14px; font-weight: 900; color: #fff;
            text-shadow: 1px 1px 2px #000;
        }

        /* POINTER */
        .pointer-wrapper {
            position: absolute; top: -15px; left: 50%; transform: translateX(-50%);
            z-index: 15; display: flex; flex-direction: column; align-items: center;
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.8));
        }
        .pointer-diamond {
            width: 40px; height: 40px;
            background: radial-gradient(circle at 30% 30%, #80d8ff, #0288d1);
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
            border: 2px solid #e1f5fe;
            z-index: 2;
        }
        .pointer-arrow {
            width: 0; height: 0;
            border-left: 12px solid transparent; border-right: 12px solid transparent;
            border-top: 20px solid #ffd700;
            margin-top: -4px;
            filter: drop-shadow(0 0 5px #000);
        }

        /* CONTROL SECTION */
        .control-section {
            width: 100%;
            display: flex; flex-direction: column; align-items: center;
            gap: 15px;
            padding: 0 20px;
            flex-shrink: 0;
        }

        /* BET CONTROLS */
        .bet-controls {
            display: flex; align-items: center; justify-content: space-between;
            width: 100%; max-width: 350px;
        }
        .bet-btn {
            width: 60px; height: 60px; border-radius: 15px;
            background: linear-gradient(180deg, #ff4081, #c2185b);
            border: 3px solid #f8bbd0; color: #fff; font-size: 28px; font-weight: 900;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 5px 0 #880e4f, 0 8px 15px rgba(0,0,0,0.5);
            cursor: pointer;
        }
        .bet-btn:active { transform: translateY(5px); box-shadow: 0 0 0 #880e4f, 0 4px 8px rgba(0,0,0,0.5); }
        
        .bet-display {
            flex: 1; margin: 0 15px; background: rgba(0,0,0,0.9);
            border: 3px solid var(--gold-main); border-radius: 15px;
            padding: 8px; display: flex; flex-direction: column; align-items: center;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
        }
        .bet-value { font-size: 24px; font-weight: 900; color: #fff; }
        .bet-sub { font-size: 11px; color: #aaa; font-weight: 700; margin-top: 2px; }
        .bet-sub span { color: #ffeb3b; }

        /* BOTTOM CONTROLS */
        .bottom-controls {
            display: flex; justify-content: center; align-items: flex-end;
            width: 100%; max-width: 350px; gap: 15px;
        }

        .max-bet-btn {
            width: 75px; height: 75px; border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ffd54f, #f57f17);
            border: 3px solid #fff9c4; color: #fff; font-size: 13px; font-weight: 900;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            box-shadow: 0 5px 0 #e65100, 0 8px 15px rgba(0,0,0,0.5); cursor: pointer;
            text-shadow: 1px 1px 2px #000;
        }
        .max-bet-btn:active { transform: translateY(5px); box-shadow: 0 0 0 #e65100, 0 4px 8px rgba(0,0,0,0.5); }

        .spin-btn {
            flex: 1; height: 75px; border-radius: 40px;
            background: linear-gradient(180deg, #4caf50 0%, #2e7d32 100%);
            border: 4px solid #a5d6a7; color: #fff; font-size: 32px; font-weight: 900;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            box-shadow: 0 6px 0 #1b5e20, 0 10px 20px rgba(0,0,0,0.6); cursor: pointer;
            position: relative; overflow: hidden;
        }
        .spin-btn::after {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 40%;
            background: linear-gradient(180deg, rgba(255,255,255,0.4) 0%, transparent 100%);
            border-radius: 40px 40px 0 0;
        }
        .spin-btn:active { transform: translateY(6px); box-shadow: 0 0 0 #1b5e20, 0 4px 10px rgba(0,0,0,0.6); }
        .spin-btn:disabled { opacity: 0.7; cursor: not-allowed; }
        
        .spin-sub { font-size: 11px; font-weight: 700; margin-top: -2px; letter-spacing: 1px; }

        /* FULL SCREEN GREEN BIG WIN OVERLAY */
        .big-win-overlay {
            position: fixed; inset: 0;
            background: radial-gradient(circle at 50% 50%, #10b981 0%, #053b2b 100%);
            display: none; flex-direction: column; justify-content: center; align-items: center;
            z-index: 9999;
            opacity: 0; transition: opacity 0.5s ease;
            text-align: center;
        }
        .big-win-overlay.active { display: flex; opacity: 1; }
        
        .big-win-title {
            font-family: 'Arial Black', sans-serif;
            font-size: 45px; font-weight: 900; color: #ffffff;
            text-transform: uppercase; letter-spacing: 3px;
            text-shadow: 0 4px 15px rgba(0,0,0,0.6);
            margin-bottom: 20px;
            animation: bounceIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .big-win-amount {
            font-family: 'Arial Black', sans-serif;
            font-size: 85px; font-weight: 900; color: #ffffff;
            text-shadow: 0 0 30px rgba(255,255,255,0.8), 0 10px 20px rgba(0,0,0,0.5);
            font-variant-numeric: tabular-nums;
        }

        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* LOADER OVERLAY */
        #loaderOverlay {
            position: fixed; inset: 0; z-index: 99999;
            background: radial-gradient(circle at center, #064e3b 0%, #021a13 100%);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 0.5s ease;
        }
        
        .loader-blur-bg {
            position: absolute; inset: 0;
            background: conic-gradient(from 0deg, transparent, rgba(250, 204, 21, 0.2), transparent, rgba(250, 204, 21, 0.2), transparent);
            filter: blur(40px);
            animation: spinBlur 4s linear infinite;
            opacity: 0.5;
        }

        @keyframes spinBlur { 100% { transform: rotate(360deg); } }

        .loader-content {
            position: relative; z-index: 2;
            text-align: center; width: 100%; max-width: 300px;
        }

        .loader-wheel-icon {
            width: 100px; height: 100px; margin: 0 auto 20px;
            border-radius: 50%; border: 4px solid rgba(250, 204, 21, 0.3);
            background: conic-gradient(#facc15 0deg 90deg, #dc2626 90deg 180deg, #3b82f6 180deg 270deg, #10b981 270deg 360deg);
            filter: blur(3px);
            animation: spinBlur 2s linear infinite;
            box-shadow: 0 0 30px rgba(250, 204, 21, 0.4);
        }

        .loader-title {
            font-size: 24px; font-weight: 900; color: #facc15; letter-spacing: 2px;
            margin-bottom: 5px; text-shadow: 0 0 10px rgba(250, 204, 21, 0.5);
        }

        .loader-sub {
            font-size: 12px; color: #aaa; font-weight: 700; margin-bottom: 25px;
        }

        .loader-track {
            width: 100%; height: 12px; background: rgba(255,255,255,0.05);
            border-radius: 10px; overflow: hidden; border: 1px solid rgba(250, 204, 21, 0.2);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }

        .loader-fill {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, #bf953f, #facc15, #fff);
            border-radius: 10px;
            transition: width 0.3s ease;
            box-shadow: 0 0 10px #facc15;
        }

        .loader-percent {
            margin-top: 10px; font-size: 13px; font-weight: 900; color: #facc15;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <!-- LOADING SCREEN -->
    <div id="loaderOverlay">
        <div class="loader-blur-bg"></div>
        <div class="loader-content">
            <div class="loader-wheel-icon"></div>
            <div class="loader-title">JAKIPOT</div>
            <div class="loader-sub">Loading Super Spin...</div>
            <div class="loader-track">
                <div class="loader-fill" id="loaderFill"></div>
            </div>
            <div class="loader-percent" id="loaderPercent">0%</div>
        </div>
    </div>

    <div class="app-container">
        
        <!-- TOP BAR -->
        <div class="top-bar">
            <a href="home.html" class="icon-btn"><</a>
            <div class="balance-display">
                <div class="coin-icon" id="currency-icon">C</div>
                <div class="balance-value" id="ui-balance">Loading...</div>
            </div>
            <button class="mute-btn" id="mute-btn" onclick="toggleMute()">
                <svg id="mute-icon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            </button>
        </div>

        <!-- WHEEL -->
        <div class="wheel-wrapper">
            <div class="outer-rim"></div>
            <div class="neon-ring" id="neon-ring"></div>
            <div class="inner-rim">
                <div class="wheel" id="wheel">
                    <!-- SVG injected here -->
                </div>
            </div>
            <div class="pointer-wrapper">
                <div class="pointer-diamond"></div>
                <div class="pointer-arrow"></div>
            </div>
            <div class="center-hub">
                WINWIN
            </div>
        </div>

        <!-- CONTROLS -->
        <div class="control-section">
            <div class="bet-controls">
                <button class="bet-btn" onclick="changeBet(-2)">−</button>
                <div class="bet-display">
                    <div class="bet-value" id="ui-bet">2</div>
                    <div class="bet-sub">Win up to <span id="ui-max-win">200</span></div>
                </div>
                <button class="bet-btn" onclick="changeBet(2)">+</button>
            </div>

            <div class="bottom-controls">
                <button class="max-bet-btn" onclick="maxBet()">MAX<br>BET</button>
                <button class="spin-btn" id="spin-btn" onclick="spinWheel()">
                    SPIN!
                    <div class="spin-sub">HOLD FOR AUTO</div>
                </button>
            </div>
        </div>

    </div>

    <!-- FULL SCREEN GREEN BIG WIN OVERLAY -->
    <div class="big-win-overlay" id="big-win-overlay">
        <div class="big-win-title">BIG WIN!</div>
        <div class="big-win-amount" id="big-win-amount">0</div>
    </div>

    <!-- FIREBASE INTEGRATION -->
    <script type="module">
        // ==========================================
        // 1. FIREBASE SETUP (v13.3.0)
        // ==========================================
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBpKp2TePXAmJjc_qR-bJPCZJ123QsCyxw",
            authDomain: "jakipot.firebaseapp.com",
            projectId: "jakipot",
            storageBucket: "jakipot.firebasestorage.app",
            messagingSenderId: "396191754293",
            appId: "1:396191754293:web:5b11a11d82e773d19ee97c",
            measurementId: "G-L1CL5TDHV"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // ==========================================
        // 2. GAME DATA & VARIABLES
        // ==========================================
        const WHEEL_DATA = [
            { base: 100,  color: '#28a745', text: '#ffffff' },
            { base: 0.5,  color: '#808080', text: '#ffffff' },
            { base: 50,   color: '#ffd700', text: '#000000' },
            { base: 0.8,  color: '#ffffff', text: '#000000' },
            { base: 10,   color: '#ff0000', text: '#ffffff' },
            { base: 0.9,  color: '#000000', text: '#ffffff' },
            { base: 5.0,  color: '#ff8c00', text: '#ffffff' },
            { base: 1.2,  color: '#9b59b6', text: '#ffffff' },
            { base: 1.5,  color: '#00e5ff', text: '#000000' },
            { base: 2.0,  color: '#1e90ff', text: '#ffffff' },
            { base: 3.0,  color: '#ff69b4', text: '#ffffff' }
        ];

        let currentUser = null;
        let balance = 0; 
        let currencySymbol = 'K';
        let currentBet = 2; 
        let isSpinning = false;
        let currentRotation = 0;
        let isMuted = localStorage.getItem('jakipotFruitMuted') === 'true';

        // DOM Elements
        const wheelEl = document.getElementById('wheel');
        const neonRing = document.getElementById('neon-ring');
        const spinBtn = document.getElementById('spin-btn');
        const uiBalance = document.getElementById('ui-balance');
        const uiBet = document.getElementById('ui-bet');
        const uiMaxWin = document.getElementById('ui-max-win');
        const muteIcon = document.getElementById('mute-icon');
        const currencyIcon = document.getElementById('currency-icon');
        
        const bigWinOverlay = document.getElementById('big-win-overlay');
        const bigWinAmount = document.getElementById('big-win-amount');

        const CURRENCY_MAP = {
            'ZMW': 'K', 'USD': '$', 'NGN': '₦', 'EUR': '€', 'GBP': '£', 
            'ZAR': 'R', 'KES': 'KSh', 'GHS': 'GH₵', 'TZS': 'TSh', 
            'UGX': 'USh', 'BWP': 'P', 'MWK': 'MK', 'MZN': 'MT', 
            'NAD': 'N$', 'AOA': 'Kz', 'PHP': '₱', 'IDR': 'Rp', 
            'PKR': '₨', 'BDT': '৳'
        };

        // Loader Elements
        const loaderOverlay = document.getElementById('loaderOverlay');
        const loaderFill = document.getElementById('loaderFill');
        const loaderPercent = document.getElementById('loaderPercent');
        let loadProgress = 0;

        // Loader Simulation
        const loaderInterval = setInterval(() => {
            if (loadProgress < 90) {
                loadProgress += Math.random() * 15;
                if (loadProgress > 90) loadProgress = 90;
                updateLoader(loadProgress);
            }
        }, 100);

        function updateLoader(val) {
            if (loaderFill) loaderFill.style.width = val + '%';
            if (loaderPercent) loaderPercent.textContent = Math.floor(val) + '%';
        }

        function finishLoading() {
            clearInterval(loaderInterval);
            updateLoader(100);
            setTimeout(() => {
                loaderOverlay.style.opacity = '0';
                setTimeout(() => loaderOverlay.style.display = 'none', 500);
            }, 400);
        }

        // ==========================================
        // 3. AUTHENTICATION & BALANCE SYNC
        // ==========================================
        onAuthStateChanged(auth, async (user) => {
            if (!user) { 
                window.location.replace('login.html'); 
                return; 
            }
            currentUser = user;

            // Get User Currency
            onSnapshot(doc(db, 'users', user.uid), (snap) => {
                // ✅ FIXED: Added () for Web SDK
                if (snap.exists()) {
                    const data = snap.data();
                    const userCurrency = data.currency || 'ZMW';
                    currencySymbol = CURRENCY_MAP[userCurrency] || userCurrency;
                    currencyIcon.innerText = currencySymbol;
                    updateUI();
                }
            });

            // Get Wallet Balance
            onSnapshot(doc(db, 'wallets', user.uid), (snap) => {
                // ✅ FIXED: Added () for Web SDK
                if (snap.exists()) {
                    balance = snap.data().balance || 0;
                    updateUI();
                    finishLoading(); // Hide loader once loaded
                }
            });
        });

        // ==========================================
        // 4. UI & AUDIO LOGIC
        // ==========================================
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playTick() {
            if (isMuted || !audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.02);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.03);
        }

        function playWinSound() {
            if (isMuted || !audioCtx) return;
            const notes = [523.25, 659.25, 783.99];
            notes.forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime + i * 0.1);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime + i * 0.1);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + i * 0.1 + 0.3);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(audioCtx.currentTime + i * 0.1); osc.stop(audioCtx.currentTime + i * 0.1 + 0.3);
            });
        }

        function playBigWinSound() {
            if (isMuted || !audioCtx) return;
            const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51]; 
            notes.forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime + i * 0.08);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime + i * 0.08);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + i * 0.08 + 0.5);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(audioCtx.currentTime + i * 0.08); osc.stop(audioCtx.currentTime + i * 0.08 + 0.5);
            });
        }

        const SVG_UNMUTED = `<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>`;
        const SVG_MUTED = `<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>`;

        function updateMuteIcon() {
            muteIcon.innerHTML = isMuted ? SVG_MUTED : SVG_UNMUTED;
        }

        window.toggleMute = () => {
            isMuted = !isMuted;
            localStorage.setItem('jakipotFruitMuted', isMuted);
            updateMuteIcon();
            if (!isMuted) initAudio();
        };
        updateMuteIcon();

        function renderWheel() {
            const size = 1000;
            const center = size / 2;
            const radius = center - 10;
            const angleStep = 360 / WHEEL_DATA.length;

            let svgContent = `<svg viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg">`;

            WHEEL_DATA.forEach((item, i) => {
                const startAngle = i * angleStep - (angleStep / 2);
                const endAngle = startAngle + angleStep;
                
                const startRad = (startAngle - 90) * Math.PI / 180;
                const endRad = (endAngle - 90) * Math.PI / 180;

                const x1 = center + radius * Math.cos(startRad);
                const y1 = center + radius * Math.sin(startRad);
                const x2 = center + radius * Math.cos(endRad);
                const y2 = center + radius * Math.sin(endRad);

                // Draw Slice
                svgContent += `<path id="slice-${i}" d="M ${center} ${center} L ${x1} ${y1} A ${radius} ${radius} 0 0 1 ${x2} ${y2} Z" fill="${item.color}" stroke="#111" stroke-width="4" />`;

                // Draw Gold Coin
                const coinAngle = startAngle + (angleStep / 2);
                const coinRad = (coinAngle - 90) * Math.PI / 180;
                const coinRadius = radius * 0.85;
                const cx = center + coinRadius * Math.cos(coinRad);
                const cy = center + coinRadius * Math.sin(coinRad);

                svgContent += `<circle cx="${cx}" cy="${cy}" r="22" fill="#bf953f" stroke="#fff" stroke-width="2"/>`;
                svgContent += `<circle cx="${cx}" cy="${cy}" r="16" fill="#fcf6ba" />`;
                svgContent += `<circle cx="${cx}" cy="${cy}" r="12" fill="#bf953f" />`;
                svgContent += `<text x="${cx}" y="${cy + 4}" fill="#8b6508" font-family="Arial" font-weight="900" font-size="14" text-anchor="middle">C</text>`;

                // Draw Number Text
                const textAngle = startAngle + (angleStep / 2);
                const textRad = (textAngle - 90) * Math.PI / 180;
                const textRadius = radius * 0.58; 
                
                const tx = center + textRadius * Math.cos(textRad);
                const ty = center + textRadius * Math.sin(textRad);

                let displayValue = item.base * currentBet;
                let displayText = Number.isInteger(displayValue) ? displayValue.toString() : displayValue.toFixed(1);
                if (displayValue >= 1000) displayText = displayValue.toLocaleString('en-US');

                let fontSize = '45px'; 
                if (displayText.length > 3) fontSize = '35px';
                if (displayText.length > 5) fontSize = '25px';

                let finalRotation = textAngle;
                if (textAngle > 90 && textAngle < 270) finalRotation += 180;

                svgContent += `<text x="${tx}" y="${ty}" fill="${item.text}" style="text-shadow: 2px 2px 2px rgba(0,0,0,0.8);" font-family="Arial Black, sans-serif" font-weight="900" font-size="${fontSize}" text-anchor="middle" dominant-baseline="middle" transform="rotate(${finalRotation}, ${tx}, ${ty})">${displayText}</text>`;
            });

            svgContent += `</svg>`;
            wheelEl.innerHTML = svgContent;
        }

        function updateUI() {
            uiBalance.innerText = balance.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            uiBet.innerText = currentBet.toLocaleString('en-US');
            uiMaxWin.innerText = (100 * currentBet).toLocaleString('en-US');
            renderWheel();
        }

        window.changeBet = (amount) => {
            if (isSpinning) return;
            currentBet += amount;
            if (currentBet < 2) currentBet = 2;
            const maxAllowed = Math.min(balance, 25000);
            if (currentBet > maxAllowed) currentBet = Math.max(2, maxAllowed); 
            updateUI();
        }

        window.maxBet = () => {
            if (isSpinning) return;
            currentBet = Math.max(2, Math.min(balance, 25000));
            updateUI();
        }

        // ==========================================
        // 5. SPIN LOGIC (SECURE VERCEL API)
        // ==========================================
        window.spinWheel = async () => {
            initAudio();

            if (isSpinning || !currentUser) {
                if(!currentUser) alert("Please log in to play.");
                return;
            }
            if (balance < currentBet) {
                alert("Not enough balance!");
                return;
            }

            isSpinning = true;
            spinBtn.disabled = true;
            neonRing.classList.add('spinning');

            // 1. FAKE SPIN ANIMATION (Starts instantly)
            let spinSpeed = 0;
            let fakeInterval = setInterval(() => {
                spinSpeed += 15;
                wheelEl.style.transition = 'none'; // Remove transition for instant rotation
                wheelEl.style.transform = `rotate(${spinSpeed}deg)`;
            }, 16); // ~60fps

            // 2. SETUP ABORT CONTROLLER TIMEOUT
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 8000); // 8 second limit

            try {
                // 3. GET SECURE TOKEN
                const idToken = await currentUser.getIdToken();

                // 4. CALL VERCEL SECURE SERVER
                const response = await fetch('https://jakipot.vercel.app/api/play', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${idToken}`
                    },
                    body: JSON.stringify({ gameType: 'super_spin', betAmount: currentBet }),
                    signal: controller.signal
                });

                clearTimeout(timeoutId); // Stop timer

                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    throw new Error(errData.error || `Server Error (${response.status})`);
                }

                const data = await response.json();
                if (data.error) throw new Error(data.error);

                // 5. STOP FAKE SPIN
                clearInterval(fakeInterval);

                // 6. UPDATE BALANCES
                balance = data.newBalance;
                updateUI();

                const winIndex = data.winData.winIndex;
                const winAmount = data.payoutAmount;

                // 7. ANIMATE TO THE REAL RESULT
                const angleStep = 360 / WHEEL_DATA.length;
                const targetModulo = 360 - (winIndex * angleStep);
                let currentModulo = spinSpeed % 360;
                let diff = targetModulo - currentModulo;
                if (diff <= 0) diff += 360;
                
                const baseSpins = 360 * 8;
                const targetRotation = spinSpeed + baseSpins + diff;
                
                // Apply the real CSS transition for the final spin
                wheelEl.style.transition = 'transform 6s cubic-bezier(0.15, 0.9, 0.15, 1)';
                wheelEl.style.transform = `rotate(${targetRotation}deg)`;
                currentRotation = targetRotation;

                let tickCount = 0;
                const tickInterval = setInterval(() => {
                    if (tickCount > 50) { clearInterval(tickInterval); return; }
                    playTick(); tickCount++;
                }, 100);

                setTimeout(() => {
                    clearInterval(tickInterval);
                    isSpinning = false;
                    spinBtn.disabled = false;
                    neonRing.classList.remove('spinning');
                    
                    // Highlight winning slice
                    const sliceEl = document.getElementById(`slice-${winIndex}`);
                    if (sliceEl) {
                        sliceEl.style.stroke = "#fff";
                        sliceEl.style.strokeWidth = "8";
                        sliceEl.style.filter = "drop-shadow(0 0 15px rgba(255,255,255,0.8))";
                        setTimeout(() => {
                            sliceEl.style.stroke = "#111";
                            sliceEl.style.strokeWidth = "4";
                            sliceEl.style.filter = "none";
                        }, 3000);
                    }

                    // Show Win Animations
                    const isBigWin = WHEEL_DATA[winIndex].base >= 10;
                    if (isBigWin) {
                        playBigWinSound();
                        bigWinOverlay.classList.add('active');
                        animateValue(bigWinAmount, 0, winAmount, 2000); 
                        setTimeout(() => bigWinOverlay.classList.remove('active'), 3500);
                    } else if (winAmount > 0) {
                        playWinSound();
                    }
                }, 6100);

            } catch (e) {
                clearTimeout(timeoutId);
                clearInterval(fakeInterval); // ✅ FIXED: Stop the fake spin!
                
                if (e.name === 'AbortError') {
                    alert("Request Timed Out! Vercel is taking too long to respond.");
                } else {
                    alert(e.message || "An error occurred.");
                }
                
                isSpinning = false;
                spinBtn.disabled = false;
                neonRing.classList.remove('spinning');
            }
        };

        function animateValue(obj, start, end, duration) {
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                const easeOut = 1 - Math.pow(1 - progress, 3); 
                const currentVal = Math.floor((end - start) * easeOut + start);
                obj.innerHTML = currentVal.toLocaleString('en-US');
                if (progress < 1) {
                    window.requestAnimationFrame(step);
                } else {
                    obj.innerHTML = end.toLocaleString('en-US');
                }
            };
            window.requestAnimationFrame(step);
        }

        // Initialize Wheel display
        renderWheel();
    </script>
</body>
