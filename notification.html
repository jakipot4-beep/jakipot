<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MyChat - Notifications</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* =========================================
           1. THEME & VARIABLES
           ========================================= */
        :root {
            --bg: #FFFFFF;
            --text-main: #000000;
            --text-muted: #555555;
            --primary-orange: #FF8C00;
            --link-blue: #007BFF;
            --border: #E4EAE6;
        }

        body.dark-mode {
            --bg: #0B141A;
            --text-main: #FFFFFF;
            --text-muted: #8696A0;
            --primary-orange: #FF9800;
            --link-blue: #00D9FF;
            --border: #222D34;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background-color: var(--bg); 
            color: var(--text-main); 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            transition: background-color 0.3s, color 0.3s;
        }

        /* =========================================
           2. HEADER
           ========================================= */
        .header {
            display: flex; align-items: center; gap: 15px;
            padding: 15px 20px; background: var(--bg);
            position: sticky; top: 0; z-index: 10;
            border-bottom: 1px solid var(--border);
        }

        .back-btn {
            background: transparent; border: none; cursor: pointer;
            width: 36px; height: 36px; border-radius: 50%;
            display: grid; place-items: center; color: var(--text-main);
        }
        .back-btn svg { width: 24px; height: 24px; fill: currentColor; }

        .header h1 { font-size: 20px; font-weight: 800; color: var(--primary-orange); }

        /* =========================================
           3. MAIN CONTENT (BOOK STYLE)
           ========================================= */
        .content { 
            flex: 1; 
            padding: 30px 25px; 
            max-width: 700px; 
            margin: 0 auto; 
            width: 100%;
            overflow-y: auto;
        }

        .notice-item {
            margin-bottom: 40px;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* The Orange Title */
        .notice-title {
            font-size: 22px;
            font-weight: 800;
            color: var(--primary-orange);
            margin-bottom: 8px;
            line-height: 1.3;
        }

        /* The Date */
        .notice-date {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        /* The White Body Text */
        .notice-body {
            font-size: 16px;
            line-height: 1.6;
            color: var(--text-main);
            margin-bottom: 15px;
            white-space: pre-wrap; /* Preserves line breaks */
        }

        /* The Blue Link */
        .notice-link {
            display: inline-block;
            font-size: 16px;
            font-weight: 700;
            color: var(--link-blue);
            text-decoration: none;
            padding: 8px 0;
            border-bottom: 2px solid var(--link-blue);
            margin-top: 5px;
            transition: opacity 0.2s;
        }
        .notice-link:active { opacity: 0.7; }

        /* Divider */
        .divider {
            height: 1px;
            background: var(--border);
            margin: 30px 0;
            border: none;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            margin-top: 100px;
            color: var(--text-muted);
        }
        .empty-state h3 { font-size: 18px; color: var(--primary-orange); margin-bottom: 10px; }
        .empty-state p { font-size: 14px; }

    </style>
</head>
<body>

    <!-- HEADER -->
    <header class="header">
        <button class="back-btn" onclick="history.back()">
            <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </button>
        <h1>News & Alerts</h1>
    </header>

    <!-- MAIN CONTENT -->
    <main class="content" id="notifications-feed">
        <!-- Notifications will load here -->
        <div class="empty-state">
            <h3>Loading...</h3>
            <p>Fetching the latest updates from Jakipot.</p>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
        import { getFirestore, collection, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBpKp2TePXAmJjc_qR-bJPCZJ123QsCyxw",
            authDomain: "jakipot.firebaseapp.com",
            projectId: "jakipot",
            storageBucket: "jakipot.firebasestorage.app",
            messagingSenderId: "396191754293",
            appId: "1:396191754293:web:5b11a11d82e773d19ee97c"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Apply Theme
        if (localStorage.getItem('mychat_theme') === 'dark') {
            document.body.classList.add('dark-mode');
        }

        // Auth & Load Data
        onAuthStateChanged(auth, (user) => {
            if (!user) { window.location.replace('login.html'); return; }
            loadNotifications();
        });

        function loadNotifications() {
            const feed = document.getElementById('notifications-feed');
            
            // Listen to 'notifications' collection ordered by newest first
            const q = query(collection(db, 'notifications'), orderBy('createdAt', 'desc'));

            onSnapshot(q, (snapshot) => {
                feed.innerHTML = '';

                if (snapshot.empty) {
                    feed.innerHTML = `
                        <div class="empty-state">
                            <h3>No News Yet</h3>
                            <p>When the Admin posts about new games or plans, they will appear here.</p>
                        </div>
                    `;
                    return;
                }

                let isFirst = true;
                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    
                    // Format Date
                    const dateObj = data.createdAt ? new Date(data.createdAt.toMillis()) : new Date();
                    const dateStr = dateObj.toLocaleDateString('en-US', { 
                        weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' 
                    });

                    // Build Link HTML (only shows if admin added a URL)
                    const linkHtml = data.linkUrl 
                        ? `<a href="${data.linkUrl}" class="notice-link" target="_blank">${data.linkText || 'Learn More →'}</a>` 
                        : '';

                    // Add divider between multiple posts
                    const divider = !isFirst ? '<hr class="divider">' : '';
                    isFirst = false;

                    feed.innerHTML += `
                        ${divider}
                        <div class="notice-item">
                            <h2 class="notice-title">${data.title || 'Untitled Update'}</h2>
                            <div class="notice-date">${dateStr}</div>
                            <div class="notice-body">${data.body || ''}</div>
                            ${linkHtml}
                        </div>
                    `;
                });
            });
        }
    </script>
</body>
</html>
