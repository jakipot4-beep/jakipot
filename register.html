<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Create Account - Jakipot</title>
    <style>
        :root {
            --bg-dark: #060b19;
            --bg-card: #111827;
            --emerald: #10b981;
            --emerald-glow: rgba(16, 185, 129, 0.4);
            --light-blue: #38bdf8;
            --white: #ffffff;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --border-color: #1e293b;
            --input-bg: #0f172a;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }
        
        body { 
            background: var(--bg-dark); 
            color: var(--white); 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            padding: 20px; 
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(16, 185, 129, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(56, 189, 248, 0.05) 0%, transparent 40%);
        }

        /* Navigation */
        .nav-bar {
            width: 100%;
            max-width: 450px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            margin-bottom: 30px;
            animation: slideDownFade 0.6s ease;
        }
        .back-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: color 0.3s;
        }
        .back-link:hover { color: var(--emerald); }
        .login-link {
            font-size: 14px;
            color: var(--text-muted);
        }
        .login-link a {
            color: var(--light-blue);
            text-decoration: none;
            font-weight: 700;
            transition: color 0.3s;
        }
        .login-link a:hover { color: var(--emerald); }

        /* Header */
        .header { 
            text-align: center; 
            margin-bottom: 30px; 
            animation: slideUpFade 0.7s ease;
        }
        .logo-svg {
            width: 80px; 
            height: 80px;
            filter: drop-shadow(0 0 15px var(--emerald-glow));
            margin-bottom: 15px;
        }
        .header h1 { 
            font-size: 22px; 
            font-weight: 900; 
            letter-spacing: 1px; 
            color: var(--white); 
        }
        .header p { 
            font-size: 14px; 
            color: var(--light-blue); 
            margin-top: 8px; 
            font-weight: 500;
        }

        /* Card */
        .card {
            background: var(--bg-card); 
            padding: 30px 25px; 
            border-radius: 20px;
            width: 100%; 
            max-width: 450px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            border: 1px solid var(--border-color); 
            animation: slideUpFade 0.7s ease 0.1s forwards;
            opacity: 0; 
            transform: translateY(20px);
        }

        /* Google Button */
        .btn-google {
            width: 100%; 
            padding: 14px; 
            background: var(--white); 
            color: #333;
            border: none; 
            border-radius: 12px; 
            font-size: 16px; 
            font-weight: 700;
            cursor: pointer; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 10px;
            transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
        }
        .btn-google:hover:not(:disabled) { 
            transform: translateY(-2px); 
            box-shadow: 0 5px 15px rgba(255,255,255,0.1); 
        }
        .btn-google:active:not(:disabled) { transform: scale(0.98); }
        .btn-google:disabled { opacity: 0.6; cursor: not-allowed; }
        .google-icon { width: 22px; height: 22px; }

        /* Divider */
        .divider {
            display: flex; 
            align-items: center; 
            text-align: center;
            margin: 25px 0; 
            color: var(--text-muted); 
            font-size: 11px; 
            font-weight: 700; 
            letter-spacing: 1px;
        }
        .divider::before, .divider::after {
            content: ''; 
            flex: 1; 
            border-bottom: 1px solid var(--border-color);
        }
        .divider:not(:empty)::before { margin-right: 15px; }
        .divider:not(:empty)::after { margin-left: 15px; }

        /* Inputs */
        .input-group { 
            position: relative; 
            margin-bottom: 15px; 
        }
        .input-icon {
            position: absolute; 
            left: 15px; 
            top: 50%; 
            transform: translateY(-50%);
            width: 20px; 
            height: 20px; 
            fill: var(--text-muted);
            transition: fill 0.3s;
            pointer-events: none;
        }
        .input-field {
            width: 100%; 
            padding: 15px 45px 15px 45px; 
            border-radius: 12px;
            border: 1.5px solid #334155; 
            background: var(--input-bg); 
            color: var(--white);
            font-size: 15px; 
            transition: border-color 0.3s, background 0.3s, box-shadow 0.3s;
        }
        .input-field:focus { 
            outline: none; 
            border-color: var(--emerald); 
            background: rgba(6, 11, 25, 0.8);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
        }
        .input-group:focus-within .input-icon { fill: var(--emerald); }
        .input-field::placeholder { color: #64748b; }

        /* Phone Specific */
        .phone-group {
            display: flex;
            gap: 10px;
        }
        .country-select {
            width: 120px;
            padding: 15px 10px;
            border-radius: 12px;
            border: 1.5px solid #334155;
            background: var(--input-bg);
            color: var(--white);
            font-size: 14px;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%2394a3b8%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 10px top 50%;
            background-size: 10px auto;
            cursor: pointer;
        }
        .country-select:focus {
            outline: none;
            border-color: var(--emerald);
        }
        .phone-input-wrapper {
            position: relative;
            flex: 1;
        }
        .phone-input-wrapper .input-field {
            padding-left: 15px;
        }

        /* Password Toggle */
        .toggle-password {
            position: absolute; 
            right: 15px; 
            top: 50%; 
            transform: translateY(-50%);
            width: 20px; 
            height: 20px; 
            fill: var(--text-muted); 
            cursor: pointer;
            transition: fill 0.3s;
            z-index: 10;
        }
        .toggle-password:hover { fill: var(--emerald); }

        /* Button */
        .btn-continue {
            width: 100%; 
            padding: 16px; 
            background: var(--emerald); 
            color: var(--white);
            border: none; 
            border-radius: 12px; 
            font-size: 16px; 
            font-weight: 800;
            cursor: pointer; 
            margin-top: 10px; 
            transition: background 0.3s, transform 0.2s;
            box-shadow: 0 4px 15px var(--emerald-glow);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .btn-continue:hover:not(:disabled) { 
            background: #059669; 
            transform: translateY(-2px); 
        }
        .btn-continue:active:not(:disabled) { transform: scale(0.98); }
        .btn-continue:disabled { opacity: 0.6; cursor: not-allowed; }

        /* Error */
        .error { 
            color: var(--danger); 
            margin-top: 12px; 
            font-size: 13px; 
            text-align: center; 
            min-height: 18px;
            font-weight: 500;
        }

        /* =========================================
           META-STYLE AI WIDGET
           ========================================= */
        .ai-fab {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--bg-card);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.4);
            border: 2px solid var(--emerald);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .ai-fab:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 25px rgba(16, 185, 129, 0.6);
        }
        .ai-fab:active { transform: scale(0.92); }
        
        /* Rotating Ring Effect */
        .ai-ring {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, transparent, var(--emerald), var(--light-blue), var(--emerald), transparent);
            animation: spin 3s linear infinite;
            position: relative;
        }
        .ai-ring::after {
            content: '';
            position: absolute;
            inset: 4px;
            background: var(--bg-card);
            border-radius: 50%;
        }

        /* AI Chat Bubble */
        .ai-bubble {
            position: fixed;
            bottom: 95px;
            right: 25px;
            max-width: 280px;
            background: var(--bg-card);
            color: var(--white);
            padding: 14px 18px;
            border-radius: 18px 18px 0 18px;
            font-size: 13.5px;
            line-height: 1.5;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(16, 185, 129, 0.3);
            z-index: 999;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.3s, transform 0.3s;
            pointer-events: none;
        }
        .ai-bubble.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }
        .ai-bubble::before {
            content: '';
            position: absolute;
            bottom: -8px;
            right: 20px;
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 10px solid var(--bg-card);
        }

        /* Animations */
        @keyframes slideUpFade {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideDownFade {
            0% { opacity: 0; transform: translateY(-10px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

        function getFlagEmoji(countryCode) {
            if(!countryCode) return '';
            return countryCode.toUpperCase().replace(/./g, char => String.fromCodePoint(char.charCodeAt(0) + 127397));
        }

        const selectEl = document.getElementById('country-code');
        countryCodes.forEach(country => {
            const option = document.createElement('option');
            option.value = country.dial_code;
            option.textContent = `${getFlagEmoji(country.code)} ${country.name} (${country.dial_code})`;
            if (country.code === 'ZM') option.selected = true; 
            selectEl.appendChild(option);
        });

        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const refCode = urlParams.get('ref') || urlParams.get('referral');
            if (refCode) {
                document.getElementById('reg-referral').value = refCode.toUpperCase();
            }
        });

        window.togglePassword = () => {
            const pwdInput = document.getElementById('reg-password');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
            } else {
                pwdInput.type = 'password';
            }
        };

        window.signInWithGoogle = async () => {
            if (isSubmitting) return;
            errorDiv.innerText = "";
            isSubmitting = true;
            
            const googleBtn = document.getElementById('google-btn');
            const originalHTML = googleBtn.innerHTML;
            googleBtn.disabled = true;
            googleBtn.innerHTML = '<span style="opacity:.7">Connecting...</span>';

            const provider = new GoogleAuthProvider();
            provider.setCustomParameters({ prompt: 'select_account' });

            try {
                const result = await signInWithPopup(auth, provider);

                sessionStorage.setItem('signupMethod', 'google');
                sessionStorage.setItem('signupEmail', (result.user.email || '').toLowerCase());
                if (result.user.displayName) {
                    sessionStorage.setItem('signupName', result.user.displayName);
                }

                window.location.href = 'register2.html';
            } catch (error) {
                console.error('[Google Auth]', error);
                if (error.code === 'auth/popup-blocked') {
                    errorDiv.innerText = 'Popup blocked. Please allow popups and try again.';
                } else if (error.code === 'auth/popup-closed-by-user' || error.code === 'auth/cancelled-popup-request') {
                    errorDiv.innerText = 'Sign-in cancelled.';
                } else if (error.code === 'auth/unauthorized-domain') {
                    errorDiv.innerText = 'Domain not authorized for Google Sign-In.';
                } else {
                    errorDiv.innerText = error.message || 'Google sign-in failed.';
                }
                googleBtn.disabled = false;
                googleBtn.innerHTML = originalHTML;
                isSubmitting = false;
            }
        };

        window.handleEmailSubmit = (e) => {
            e.preventDefault();
            if (isSubmitting) return;
            errorDiv.innerText = "";

            const emailInput = document.getElementById('reg-email');
            const pwdInput = document.getElementById('reg-password');
            const countryCode = document.getElementById('country-code').value;
            const phoneInput = document.getElementById('reg-phone');
            const refInput = document.getElementById('reg-referral');

            const email = emailInput.value.trim().toLowerCase();
            const password = pwdInput.value;
            const phone = phoneInput.value.trim().replace(/\D/g, '');
            const referral = refInput.value.trim().toUpperCase();
            const fullPhone = countryCode + phone;

            if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) {
                errorDiv.innerText = 'Please enter a valid email address.';
                emailInput.focus();
                return;
            }

            if (password.length < 8) {
                errorDiv.innerText = 'Password must be at least 8 characters.';
                pwdInput.focus();
                return;
            }
            if (!/[A-Z]/.test(password) || !/[a-z]/.test(password) || !/[0-9]/.test(password)) {
                errorDiv.innerText = 'Password must contain uppercase, lowercase, and a number.';
                pwdInput.focus();
                return;
            }

            if (phone.length < 6 || phone.length > 15) {
                errorDiv.innerText = 'Please enter a valid phone number.';
                phoneInput.focus();
                return;
            }

            isSubmitting = true;
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerText = 'PLEASE WAIT...';

            sessionStorage.setItem('signupMethod', 'email');
            sessionStorage.setItem('signupEmail', email);
            sessionStorage.setItem('signupPassword', password);
            sessionStorage.setItem('signupPhone', fullPhone);
            
            if (referral) {
                sessionStorage.setItem('signupReferral', referral);
            } else {
                sessionStorage.removeItem('signupReferral');
            }

            setTimeout(() => {
                window.location.href = 'register2.html';
            }, 400);
        };
        
        ['reg-email', 'reg-password', 'reg-phone', 'reg-referral'].forEach(id => {
            document.getElementById(id).addEventListener('input', () => {
                errorDiv.innerText = "";
            });
        });
