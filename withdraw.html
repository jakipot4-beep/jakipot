<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JAKIPOT - Withdraw Funds</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #040b16; --bg-card: #0f172a; --bg-elevated: #1e293b;
            --cyan: #00D9FF; --emerald: #10b981; --gold: #fbbf24; --danger: #ef4444;
            --text-white: #ffffff; --text-muted: #8b9bb4; --border-light: rgba(255, 255, 255, 0.08);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg-deep); color: var(--text-white); min-height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        .top-header { display: flex; align-items: center; justify-content: space-between; padding: 15px 20px; background: var(--bg-card); border-bottom: 1px solid var(--border-light); }
        .back-btn { background: transparent; border: none; cursor: pointer; color: var(--cyan); padding: 4px; }
        .back-btn svg { width: 24px; height: 24px; fill: currentColor; }
        .header-title { font-size: 16px; font-weight: 900; text-transform: uppercase; }
        .wallet-balance { font-size: 14px; font-weight: 800; color: var(--gold); background: rgba(251, 191, 36, 0.1); padding: 6px 12px; border-radius: 20px; border: 1px solid rgba(251,191,36,0.3); }

        .content-area { flex: 1; padding: 30px 20px; display: flex; flex-direction: column; overflow-y: auto; }
        .section-label { font-size: 13px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; margin-bottom: 10px; margin-top: 20px; letter-spacing: 1px; }
        
        .input-box { background: var(--bg-card); border: 2px solid var(--border-light); border-radius: 16px; padding: 20px; transition: border-color 0.3s; }
        .input-box:focus-within { border-color: var(--cyan); box-shadow: 0 0 15px rgba(0, 217, 255, 0.2); }
        
        .amount-input-wrap { display: flex; align-items: center; justify-content: center; gap: 10px; }
        .currency-symbol { font-size: 32px; font-weight: 800; color: var(--gold); }
        .main-input { background: transparent; border: none; color: var(--white); font-size: 40px; font-weight: 900; width: 100%; text-align: center; outline: none; }
        
        .phone-input { background: transparent; border: none; color: var(--white); font-size: 20px; font-weight: 800; width: 100%; text-align: center; outline: none; }
        .phone-label { font-size: 12px; color: var(--emerald); text-align: center; margin-top: 5px; font-weight: 700; }

        /* ✅ NEW FEE BREAKDOWN */
        .fee-breakdown {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 14px;
            padding: 15px;
            margin-top: 15px;
            display: none;
            animation: fadeIn 0.3s ease;
        }
        .fee-breakdown.show { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

        .fee-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
        }
        .fee-row span:last-child { font-weight: 800; color: var(--text-white); }
        .fee-row.total {
            border-top: 1px dashed var(--border-light);
            margin-top: 8px;
            padding-top: 12px;
            font-size: 16px;
        }
        .fee-row.total span:last-child {
            color: var(--emerald);
            font-size: 18px;
            font-weight: 900;
        }

        .btn-next { width: 100%; padding: 18px; border-radius: 14px; border: none; background: var(--cyan); color: #000; font-size: 16px; font-weight: 900; text-transform: uppercase; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 20px rgba(0, 217, 255, 0.3); margin-top: 25px; }
        .btn-next:active { transform: scale(0.98); }
        .btn-next:disabled { background: var(--danger); color: #fff; cursor: not-allowed; box-shadow: none; }

        /* --- PIN MODAL --- */
        .pin-overlay { position: fixed; inset: 0; background: rgba(4, 11, 22, 0.9); backdrop-filter: blur(10px); display: none; justify-content: center; align-items: flex-end; z-index: 100; opacity: 0; transition: opacity 0.3s; }
        .pin-overlay.active { display: flex; opacity: 1; }
        .pin-card { background: var(--bg-card); border-top: 2px solid var(--cyan); border-radius: 24px 24px 0 0; padding: 30px 20px; width: 100%; max-width: 500px; text-align: center; box-shadow: 0 -10px 40px rgba(0, 217, 255, 0.15); transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .pin-overlay.active .pin-card { transform: translateY(0); }

        .pin-title { font-size: 20px; font-weight: 900; color: var(--white); margin-bottom: 10px; }
        .pin-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 25px; }

        .pin-container { display: flex; justify-content: center; gap: 12px; margin-bottom: 25px; }
        .pin-box { width: 50px; height: 60px; background: var(--bg-elevated); border: 2px solid #334155; border-radius: 12px; text-align: center; font-size: 28px; font-weight: 900; color: var(--white); caret-color: var(--cyan); transition: all 0.3s; -webkit-text-security: disc; }
        .pin-box:focus { outline: none; border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(0, 217, 255, 0.15); }
        .pin-box.filled { border-color: var(--cyan); }

        .pin-actions { display: flex; gap: 10px; }
        .btn-pin { flex: 1; padding: 16px; border-radius: 12px; border: none; font-size: 15px; font-weight: 900; cursor: pointer; }
        .btn-cancel { background: var(--bg-elevated); color: var(--text-white); }
        .btn-confirm { background: var(--emerald); color: var(--white); box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); }
        .btn-confirm:disabled { background: #334155; color: var(--text-muted); cursor: not-allowed; box-shadow: none; }

        .error-msg { color: var(--danger); font-size: 13px; font-weight: 600; min-height: 18px; margin-bottom: 15px; }

        /* Loader Overlay */
        #loading-overlay { display: none; position: fixed; inset: 0; background: rgba(4,11,22,0.95); z-index: 9999; flex-direction: column; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        #loading-overlay.show { display: flex; }
        .spinner { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--cyan); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <header class="top-header">
        <button class="back-btn" onclick="window.location.href='wallet.html'"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
        <div class="header-title">Withdraw</div>
        <div class="wallet-balance" id="header-balance">Loading...</div>
    </header>

    <main class="content-area">
        <div class="section-label">Enter Amount to Withdraw (Min: 15)</div>
        <div class="input-box">
            <div class="amount-input-wrap">
                <span class="currency-symbol" id="currency-symbol">K</span>
                <input type="number" id="withdraw-amount" class="main-input" placeholder="0.00" min="15">
            </div>
        </div>

        <!-- ✅ FEE BREAKDOWN CALCULATOR -->
        <div class="fee-breakdown" id="fee-breakdown">
            <div class="fee-row">
                <span>Withdrawal Amount</span>
                <span id="calc-amount">K0.00</span>
            </div>
            <div class="fee-row">
                <span>Processing Fee (5%)</span>
                <span id="calc-fee" style="color: var(--danger);">-K0.00</span>
            </div>
            <div class="fee-row total">
                <span>You Will Receive</span>
                <span id="calc-net">K0.00</span>
            </div>
        </div>

        <div class="section-label">Destination Phone Number</div>
        <div class="input-box">
            <input type="tel" id="withdraw-phone" class="phone-input" placeholder="097...">
            <div class="phone-label">Ensure this number is registered in your name.</div>
        </div>

        <button class="btn-next" id="btn-withdraw" onclick="openPinModal()">WITHDRAW →</button>
    </main>

    <!-- PIN MODAL -->
    <div class="pin-overlay" id="pin-overlay">
        <div class="pin-card">
            <div class="pin-title">Security Check</div>
            <div class="pin-sub" id="pin-sub-text">Enter your 4-digit PIN to authorize this withdrawal.</div>
            
            <div class="pin-container" id="pin-container">
                <input type="password" inputmode="numeric" maxlength="1" class="pin-box" data-index="0" autocomplete="off">
                <input type="password" inputmode="numeric" maxlength="1" class="pin-box" data-index="1" autocomplete="off">
                <input type="password" inputmode="numeric" maxlength="1" class="pin-box" data-index="2" autocomplete="off">
                <input type="password" inputmode="numeric" maxlength="1" class="pin-box" data-index="3" autocomplete="off">
            </div>
            
            <div class="error-msg" id="pin-error"></div>

            <div class="pin-actions">
                <button class="btn-pin btn-cancel" id="btn-cancel-pin" onclick="closePinModal()">Cancel</button>
                <button class="btn-pin btn-confirm" id="btn-confirm-pin" onclick="processWithdrawal()" disabled>Confirm</button>
            </div>
        </div>
    </div>

    <div id="loading-overlay">
        <div class="spinner"></div>
        <div style="margin-top: 15px; font-weight: 800; color: var(--cyan);">Processing Withdrawal...</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
        import { getFirestore, doc, collection, writeBatch, serverTimestamp, increment, onSnapshot, addDoc } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyBpKp2TePXAmJjc_qR-bJPCZJ123QsCyxw", 
            authDomain: "jakipot.firebaseapp.com", 
            projectId: "jakipot", 
            storageBucket: "jakipot.firebasestorage.app", 
            messagingSenderId: "396191754293", 
            appId: "1:396191754293:web:5b11a11d82e773d19ee97c" 
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let userBalance = 0;
        let currencySymbol = 'K';
        let currentCurrencyCode = 'ZMW';
        let isProcessing = false;

        // ✅ WITHDRAWAL SETTINGS
        const MIN_WITHDRAWAL = 15;
        const FEE_PERCENTAGE = 0.05; // 5% fee

        // WATCHDOG STATE
        const WATCHDOG_KEY = 'jakipot_withdraw_fails';
        let failedAttempts = parseInt(localStorage.getItem(WATCHDOG_KEY) || '0');
        let lockoutInterval = null;

        const CURRENCY_MAP = { 
            'ZMW': 'K', 'USD': '$', 'NGN': '₦', 'EUR': '€', 'GBP': '£', 
            'ZAR': 'R', 'KES': 'KSh', 'GHS': 'GH₵', 'TZS': 'TSh', 
            'UGX': 'USh', 'BWP': 'P', 'MWK': 'MK', 'MZN': 'MT', 
            'NAD': 'N$', 'AOA': 'Kz', 'PHP': '₱', 'IDR': 'Rp', 
            'PKR': '₨', 'BDT': '৳'
        };

        // 1. Authenticate & Load Real Data
        onAuthStateChanged(auth, (user) => {
            if (!user) { 
                window.location.replace('login.html'); 
                return; 
            }
            currentUser = user;

            checkWatchdog();

            // Fetch Currency & Phone
            onSnapshot(doc(db, 'users', user.uid), (snap) => {
                if (snap.exists()) {
                    const data = snap.data();
                    currentCurrencyCode = data.currency || 'ZMW';
                    currencySymbol = CURRENCY_MAP[currentCurrencyCode] || currentCurrencyCode;
                    
                    document.getElementById('currency-symbol').innerText = currencySymbol;
                    if (data.phone) {
                        document.getElementById('withdraw-phone').value = data.phone;
                    }
                    // Recalculate fee breakdown with correct currency
                    updateFeeBreakdown();
                }
            });

            // Fetch Wallet Balance
            onSnapshot(doc(db, 'wallets', user.uid), (snap) => {
                if (snap.exists()) {
                    userBalance = snap.data().balance || 0;
                    document.getElementById('header-balance').innerText = `${currencySymbol}${userBalance.toLocaleString('en-US', {minimumFractionDigits: 2})}`;
                }
            });
        });

        // ==========================================
        // ✅ REAL-TIME FEE CALCULATOR
        // ==========================================
        const amountInput = document.getElementById('withdraw-amount');
        const feeBreakdown = document.getElementById('fee-breakdown');

        function updateFeeBreakdown() {
            const amount = parseFloat(amountInput.value);

            if (isNaN(amount) || amount <= 0) {
                feeBreakdown.classList.remove('show');
                return;
            }

            const fee = amount * FEE_PERCENTAGE;
            const net = amount - fee;

            feeBreakdown.classList.add('show');
            document.getElementById('calc-amount').innerText = `${currencySymbol}${amount.toFixed(2)}`;
            document.getElementById('calc-fee').innerText = `-${currencySymbol}${fee.toFixed(2)}`;
            document.getElementById('calc-net').innerText = `${currencySymbol}${net.toFixed(2)}`;
        }

        amountInput.addEventListener('input', updateFeeBreakdown);

        // 🐕 WATCHDOG LOGIC
        function checkWatchdog() {
            const withdrawBtn = document.getElementById('btn-withdraw');
            if (failedAttempts >= 5) {
                withdrawBtn.disabled = true;
                withdrawBtn.innerText = "ACCOUNT LOCKED (CONTACT SUPPORT)";
                withdrawBtn.style.background = "var(--danger)";
            }
        }

        async function logSecurityEvent(event, details = {}) {
            try {
                await addDoc(collection(db, 'security_logs'), {
                    event: event,
                    uid: currentUser?.uid || 'unknown',
                    timestamp: serverTimestamp(),
                    ...details
                });
            } catch (e) { console.warn('Watchdog log failed', e); }
        }

        function registerFailedAttempt() {
            failedAttempts++;
            localStorage.setItem(WATCHDOG_KEY, failedAttempts);
            
            if (failedAttempts >= 5) {
                checkWatchdog();
                closePinModal();
                alert("Too many failed attempts. Your withdrawal access has been temporarily locked for security reasons. Please contact support.");
                logSecurityEvent('account_withdraw_lockout', { attempts: failedAttempts });
            } else {
                pinError.innerText = `Incorrect PIN. You have ${5 - failedAttempts} attempts left.`;
            }
        }

        // 2. PIN Modal Logic
        const pinBoxes = document.querySelectorAll('.pin-box');
        const pinError = document.getElementById('pin-error');
        const btnConfirmPin = document.getElementById('btn-confirm-pin');

        window.openPinModal = () => {
            if (failedAttempts >= 5) return; 

            const amount = parseFloat(document.getElementById('withdraw-amount').value);
            const phone = document.getElementById('withdraw-phone').value;

            // ✅ UPDATED VALIDATION: Minimum 15
            if (!amount || amount < MIN_WITHDRAWAL) { 
                alert(`Minimum withdrawal is ${currencySymbol}${MIN_WITHDRAWAL}.`); 
                return; 
            }
            if (amount > userBalance) { 
                alert("Insufficient wallet balance."); 
                return; 
            }
            if (!phone) { 
                alert("Please enter a destination phone number."); 
                return; 
            }

            pinBoxes.forEach(box => { box.value = ''; box.classList.remove('filled'); });
            pinError.innerText = '';
            btnConfirmPin.disabled = true;
            document.getElementById('pin-overlay').classList.add('active');
            pinBoxes[0].focus();
        };

        window.closePinModal = () => {
            if (isProcessing) return;
            document.getElementById('pin-overlay').classList.remove('active');
        };

        pinBoxes.forEach((box, index) => {
            box.addEventListener('input', (e) => {
                e.target.value = e.target.value.replace(/[^0-9]/g, '');
                if (e.target.value.length === 1) {
                    e.target.classList.add('filled');
                    if (index < 3) pinBoxes[index + 1].focus();
                } else {
                    e.target.classList.remove('filled');
                }
                checkPinComplete();
            });

            box.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    pinBoxes[index - 1].focus();
                    pinBoxes[index - 1].value = '';
                    pinBoxes[index - 1].classList.remove('filled');
                    checkPinComplete();
                }
            });
        });

        function checkPinComplete() {
            let pin = "";
            pinBoxes.forEach(box => pin += box.value);
            btnConfirmPin.disabled = pin.length !== 4;
        }

        // 3. Hashing Function
        async function hashPin(pin, uid) {
            const saltedPin = pin + uid;
            const msgUint8 = new TextEncoder().encode(saltedPin);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // 4. Secure Submission
        window.processWithdrawal = async () => {
            if (isProcessing) return;
            
            let pin = "";
            pinBoxes.forEach(box => pin += box.value);
            if (pin.length !== 4) return;

            isProcessing = true;
            btnConfirmPin.disabled = true;
            btnConfirmPin.innerText = "Verifying...";
            pinError.innerText = "";

            try {
                const amount = parseFloat(document.getElementById('withdraw-amount').value);
                const phone = document.getElementById('withdraw-phone').value;
                
                // ✅ Calculate fee and net amount
                const fee = amount * FEE_PERCENTAGE;
                const netAmount = amount - fee;
                
                const pinHash = await hashPin(pin, currentUser.uid);

                const batch = writeBatch(db);
                
                // A. Deduct FULL amount from wallet (user pays fee from their balance)
                const walletRef = doc(db, 'wallets', currentUser.uid);
                const txRef = doc(collection(db, 'transactions'));
                
                batch.update(walletRef, { 
                    balance: increment(-amount),
                    lastTxId: txRef.id 
                });

                // B. Create Ledger Receipt (deducts full amount)
                batch.set(txRef, {
                    uid: currentUser.uid, 
                    type: 'withdrawal', 
                    amount: -amount, 
                    status: 'pending', 
                    createdAt: serverTimestamp()
                });

                // C. Create Withdrawal Request Document (with fee breakdown)
                const withdrawRef = doc(collection(db, 'withdrawals'));
                batch.set(withdrawRef, {
                    uid: currentUser.uid,
                    amount: amount,             // Total requested (e.g. 15)
                    fee: fee,                   // 5% fee (e.g. 0.75)
                    netAmount: netAmount,       // What user receives (e.g. 14.25)
                    currency: currentCurrencyCode,
                    destinationPhone: phone,
                    status: 'pending',
                    ledgerTxId: txRef.id,
                    pinHash: pinHash,
                    requestedAt: serverTimestamp()
                });

                await batch.commit();

                // SUCCESS: Reset Watchdog
                localStorage.removeItem(WATCHDOG_KEY);
                failedAttempts = 0;

                document.getElementById('loading-overlay').classList.add('show');
                setTimeout(() => {
                    window.location.href = 'history.html';
                }, 1500);

            } catch (error) {
                console.error("Withdrawal Error:", error);
                isProcessing = false;
                btnConfirmPin.disabled = false;
                btnConfirmPin.innerText = "Confirm";
                
                if (error.code === 'permission-denied') {
                    registerFailedAttempt();
                    logSecurityEvent('failed_withdraw_pin', { attempts: failedAttempts, amount: amount });

                    pinBoxes.forEach(box => { box.style.borderColor = 'var(--danger)'; });
                    setTimeout(() => {
                        pinBoxes.forEach(box => { box.style.borderColor = ''; box.value = ''; box.classList.remove('filled'); });
                        pinBoxes[0].focus();
                        btnConfirmPin.disabled = true;
                    }, 1000);

                    if (failedAttempts >= 3 && failedAttempts < 5) {
                        let timeLeft = 30;
                        btnConfirmPin.disabled = true;
                        btnConfirmPin.innerText = `WAIT ${timeLeft}S`;
                        
                        clearInterval(lockoutInterval);
                        lockoutInterval = setInterval(() => {
                            timeLeft--;
                            btnConfirmPin.innerText = `WAIT ${timeLeft}S`;
                            if (timeLeft <= 0) {
                                clearInterval(lockoutInterval);
                                btnConfirmPin.innerText = "Confirm";
                                btnConfirmPin.disabled = true;
                            }
                        }, 1000);
                    }
                } else {
                    pinError.innerText = "Failed to submit. Check your connection.";
                }
            }
        };
    </script>
</body>
</html>
