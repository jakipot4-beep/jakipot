<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Home - Jakipot</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #060b19; --bg-card: #0f172a; --bg-elevated: #1e293b; --royal-blue: #2563eb;
            --electric-blue: #38bdf8; --blue-glow: rgba(56, 189, 248, 0.3); --white: #ffffff;
            --text-muted: #94a3b8; --border-light: rgba(255, 255, 255, 0.08);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg-deep); color: var(--white); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; background-image: radial-gradient(circle at 50% 0%, rgba(37, 99, 235, 0.1) 0%, transparent 50%); background-attachment: fixed; }
        .top-header { position: fixed; top: 0; left: 0; width: 100%; height: 65px; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; background: rgba(6, 11, 25, 0.85); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border-light); z-index: 100; }
        .header-left { flex: 1; display: flex; justify-content: flex-start; }
        .logo-area { display: flex; align-items: center; gap: 8px; text-decoration: none; justify-content: center; }
        .logo-icon { font-size: 22px; filter: drop-shadow(0 0 10px var(--blue-glow)); }
        .logo-text { font-size: 18px; font-weight: 900; color: var(--white); letter-spacing: 1px; }
        .logo-text span { color: var(--electric-blue); }
        .header-right { flex: 1; display: flex; justify-content: flex-end; align-items: center; gap: 10px; }
        .icon-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--border-light); cursor: pointer; position: relative; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; transition: background 0.2s; }
        .icon-btn svg { width: 20px; height: 20px; fill: var(--white); }
        .main-content { flex: 1; padding: 85px 20px 100px 20px; max-width: 500px; margin: 0 auto; width: 100%; }
        .profile-section { background: var(--bg-card); border-radius: 20px; overflow: hidden; border: 1px solid var(--border-light); margin-bottom: 25px; }
        .cover-photo { height: 120px; background: linear-gradient(135deg, var(--royal-blue), var(--electric-blue)); }
        .profile-info-container { position: relative; padding: 0 20px 20px 20px; margin-top: -40px; text-align: center; z-index: 2; }
        .profile-avatar-wrapper { position: relative; width: 80px; height: 80px; margin: 0 auto 10px auto; }
        .profile-avatar { width: 80px; height: 80px; border-radius: 50%; background: var(--bg-deep); border: 4px solid var(--bg-card); display: grid; place-items: center; overflow: hidden; }
        .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .avatar-inner { width: 100%; height: 100%; border-radius: 50%; background: linear-gradient(135deg, var(--royal-blue), var(--electric-blue)); display: grid; place-items: center; font-weight: 900; color: var(--white); font-size: 28px; }
        .profile-name { font-size: 20px; font-weight: 900; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .profile-status { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
        .section-title { font-size: 18px; font-weight: 800; margin-bottom: 15px; }
        .features-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 35px; }
        .feature-card { height: 140px; border-radius: 20px; text-decoration: none; color: var(--white); display: flex; flex-direction: column; justify-content: flex-end; padding: 15px; position: relative; overflow: hidden; border: 1px solid var(--border-light); }
        .feature-card::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, rgba(6, 11, 25, 0.95) 0%, rgba(6, 11, 25, 0.4) 100%); z-index: 1; }
        .feature-card.plans { background: url('https://images.unsplash.com/photo-1639762681485-074b7f938ba0?q=80&w=400&auto=format&fit=crop') center/cover; }
        .feature-card.fruit { background: url('https://images.unsplash.com/photo-1596838132731-3301c3fd4317?q=80&w=400&auto=format&fit=crop') center/cover; }
        .feature-content { position: relative; z-index: 2; }
        .feature-title { font-size: 15px; font-weight: 800; }
        .bottom-nav { position: fixed; bottom: 20px; left: 20px; right: 20px; height: 65px; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(20px); border: 1px solid var(--border-light); border-radius: 35px; display: flex; justify-content: space-around; align-items: center; z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-muted); font-size: 10px; font-weight: 700; text-decoration: none; flex: 1; }
        .nav-item svg { width: 22px; height: 22px; fill: var(--text-muted); }
        .nav-item.active { color: var(--electric-blue); }
        .nav-item.active svg { fill: var(--electric-blue); }
    </style>
</head>
<body>
    <header class="top-header">
        <div class="header-left"><button class="icon-btn" onclick="logout()" style="color:#ef4444;"><svg viewBox="0 0 24 24" fill="#ef4444"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg></button></div>
        <a href="home.html" class="logo-area"><span class="logo-icon">🐦</span><span class="logo-text">JAKI<span>POT</span></span></a>
        <div class="header-right"></div>
    </header>

    <main class="main-content">
        <div class="profile-section">
            <div class="cover-photo"></div>
            <div class="profile-info-container">
                <div class="profile-avatar-wrapper">
                    <div class="profile-avatar" id="profile-avatar-container"><div class="avatar-inner" id="profile-initial">U</div></div>
                </div>
                <h2 class="profile-name"><span id="profile-name">User Name</span></h2>
                <div class="profile-status">Verified JAKIPOT Member</div>
            </div>
        </div>

        <h2 class="section-title">Start Earning</h2>
        <div class="features-grid">
            <a href="#" class="feature-card plans"><div class="feature-content"><div class="feature-title">Locked Plans</div></div></a>
            <a href="#" class="feature-card fruit"><div class="feature-content"><div class="feature-title">Fruit 777</div></div></a>
        </div>
    </main>

    <nav class="bottom-nav">
        <a href="home.html" class="nav-item active"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>Home</a>
        <a href="#" class="nav-item"><svg viewBox="0 0 24 24"><path d="M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6z"/></svg>Trending</a>
        <a href="#" class="nav-item"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>Machine</a>
        <a href="#" class="nav-item"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>Deposit</a>
        <a href="#" class="nav-item"><svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/></svg>Chat</a>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { initializeAppCheck, ReCaptchaV3Provider } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app-check.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBpKp2TePXAmJjc_qR-bJPCZJ123QsCyxw", authDomain: "jakipot.firebaseapp.com", projectId: "jakipot",
            storageBucket: "jakipot.firebasestorage.app", messagingSenderId: "396191754293", appId: "1:396191754293:web:5b11a11d82e773d19ee97c"
        };

        const app = initializeApp(firebaseConfig);
        initializeAppCheck(app, { provider: new ReCaptchaV3Provider('6LdQwsuAAAAAITxU1ur4P5_lw3Qg3pltPqO3D3H'), isTokenAutoRefreshEnabled: true });
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, (user) => {
            if (!user) { window.location.replace('login.html'); return; }

            onSnapshot(doc(db, 'users', user.uid), (userDoc) => {
                if (userDoc.exists()) {
                    const data = userDoc.data();
                    const name = data.fullName || 'User';
                    
                    document.getElementById('profile-name').innerText = name;
                    document.getElementById('profile-initial').innerText = name.charAt(0).toUpperCase();
                }
            });
        });

        window.logout = async () => {
            await signOut(auth);
            window.location.replace('login.html');
        };
    </script>
</body>
</html>
