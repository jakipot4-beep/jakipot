<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Profile - Jakipot</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #060b19;
            --bg-card: #0f172a;
            --bg-elevated: #1e293b;
            --royal-blue: #2563eb;
            --electric-blue: #38bdf8;
            --text-white: #ffffff;
            --text-muted: #94a3b8;
            --border-light: rgba(255, 255, 255, 0.08);
            --danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: var(--bg-deep); color: var(--text-white); 
            height: 100vh; display: flex; flex-direction: column; overflow: hidden;
            background-image: radial-gradient(circle at 50% 0%, rgba(37, 99, 235, 0.1) 0%, transparent 50%);
        }

        .top-header {
            display: flex; align-items: center; gap: 15px;
            padding: 15px 20px; background: var(--bg-card); border-bottom: 1px solid var(--border-light);
            height: 70px; z-index: 10;
        }
        .back-btn {
            background: transparent; border: none; cursor: pointer;
            width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center;
            transition: background 0.2s;
        }
        .back-btn:hover { background: rgba(255,255,255,0.05); }
        .back-btn svg { width: 24px; height: 24px; fill: var(--text-white); }
        .header-title { font-size: 18px; font-weight: 800; }

        .content-area { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 50px; max-width: 500px; margin: 0 auto; width: 100%; }

        .profile-card {
            background: var(--bg-card); border: 1px solid var(--border-light);
            border-radius: 20px; padding: 25px 20px; text-align: center; margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .avatar-wrapper { position: relative; width: 90px; height: 90px; margin: 0 auto 15px auto; }
        
        .profile-avatar {
            width: 90px; height: 90px; border-radius: 50%;
            background: linear-gradient(135deg, var(--royal-blue), var(--electric-blue));
            display: grid; place-items: center; font-weight: 900; color: var(--text-white); font-size: 32px;
            overflow: hidden; border: 3px solid var(--bg-elevated);
        }
        .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
        
        .edit-badge {
            position: absolute; bottom: 0; right: 0; width: 28px; height: 28px;
            background: var(--electric-blue); border-radius: 50%; border: 2px solid var(--bg-card);
            display: grid; place-items: center; cursor: pointer; transition: transform 0.2s;
        }
        .edit-badge:hover { transform: scale(1.1); }
        .edit-badge svg { width: 14px; height: 14px; fill: var(--bg-deep); }
        
        .profile-name { font-size: 22px; font-weight: 900; margin-bottom: 4px; }
        .profile-email { font-size: 14px; color: var(--text-muted); font-weight: 500; }

        .settings-list { display: flex; flex-direction: column; gap: 10px; }
        .settings-item {
            background: var(--bg-card); border: 1px solid var(--border-light);
            border-radius: 14px; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between;
            cursor: pointer; transition: background 0.2s; text-decoration: none;
        }
        .settings-item:hover { background: var(--bg-elevated); }
        .settings-left { display: flex; align-items: center; gap: 15px; }
        .settings-icon {
            width: 36px; height: 36px; border-radius: 10px; background: rgba(56, 189, 248, 0.1);
            display: grid; place-items: center;
        }
        .settings-icon svg { width: 18px; height: 18px; fill: var(--electric-blue); }
        .settings-text { font-size: 15px; font-weight: 600; color: var(--text-white); }
        
        /* Bonus Center special style */
        .settings-item.bonus-highlight {
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.08) 0%, rgba(236, 72, 153, 0.08) 100%);
            border-color: rgba(251, 191, 36, 0.25);
        }
        .settings-item.bonus-highlight:hover {
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.15) 0%, rgba(236, 72, 153, 0.15) 100%);
        }
        .settings-item.bonus-highlight .settings-icon {
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.2), rgba(236, 72, 153, 0.2));
        }
        .settings-item.bonus-highlight .settings-icon svg { fill: #fbbf24; }
        .settings-item.bonus-highlight .settings-text {
            color: #fbbf24;
        }
        .bonus-badge {
            font-size: 9px;
            font-weight: 900;
            background: #ef4444;
            color: #fff;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 8px;
            letter-spacing: 0.5px;
        }
        
        .settings-item.danger .settings-text { color: var(--danger); }
        .settings-item.danger .settings-icon { background: rgba(239, 68, 68, 0.1); }
        .settings-item.danger .settings-icon svg { fill: var(--danger); }
        
        .chevron { width: 18px; height: 18px; fill: var(--text-muted); }

        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100;
            display: none; justify-content: center; align-items: center; padding: 20px;
            backdrop-filter: blur(5px); opacity: 0; transition: opacity 0.3s;
        }
        .modal-overlay.active { display: flex; opacity: 1; }
        .modal-content {
            background: var(--bg-card); width: 100%; max-width: 400px;
            border-radius: 20px; padding: 25px; border: 1px solid var(--border-light);
            transform: translateY(20px); transition: transform 0.3s;
        }
        .modal-overlay.active .modal-content { transform: translateY(0); }
        .modal-title { font-size: 18px; font-weight: 800; margin-bottom: 15px; }
        .modal-input {
            width: 100%; padding: 14px; border-radius: 12px; background: var(--bg-elevated);
            border: 1px solid var(--border-light); color: var(--text-white); margin-bottom: 15px; outline: none;
            font-size: 15px;
        }
        .modal-input:focus { border-color: var(--electric-blue); }
        .modal-actions { display: flex; gap: 10px; }
        .modal-btn { flex: 1; padding: 14px; border-radius: 12px; font-weight: 800; cursor: pointer; border: none; font-size: 14px; }
        .modal-btn.cancel { background: var(--bg-elevated); color: var(--text-white); }
        .modal-btn.confirm { background: var(--royal-blue); color: var(--text-white); }
        
        .spinner {
            width: 20px; height: 20px; border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff; border-radius: 50%; animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <header class="top-header">
        <button class="back-btn" onclick="window.location.href='home.html'">
            <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </button>
        <div class="header-title">My Profile</div>
    </header>

    <main class="content-area">
        
        <div class="profile-card">
            <div class="avatar-wrapper">
                <label for="profile-upload-input" style="cursor: pointer;">
                    <div class="profile-avatar" id="profile-avatar-container">
                        <span id="profile-initial">U</span>
                    </div>
                    <div class="edit-badge">
                        <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
                    </div>
                </label>
                <input type="file" id="profile-upload-input" accept="image/jpeg,image/jpg,image/png" hidden>
            </div>
            <div class="profile-name" id="profile-name">Loading...</div>
            <div class="profile-email" id="profile-email">...</div>
        </div>

        <div class="settings-list">
            
            <a href="orders.html" class="settings-item">
                <div class="settings-left">
                    <div class="settings-icon">
                        <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
                    </div>
                    <div class="settings-text">My Orders</div>
                </div>
                <svg class="chevron" viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
            </a>

            <!-- NEW: Bonus Center link -->
            <a href="bonus.html" class="settings-item bonus-highlight">
                <div class="settings-left">
                    <div class="settings-icon">
                        <svg viewBox="0 0 24 24"><path d="M20 6h-2.18c.11-.31.18-.65.18-1 0-1.66-1.34-3-3-3-1.05 0-1.96.54-2.5 1.35l-.5.67-.5-.68C10.96 2.54 10.05 2 9 2 7.34 2 6 3.34 6 5c0 .35.07.69.18 1H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-5-2c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zM9 4c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm11 15H4v-2h16v2zm0-5H4V8h5.08L7 10.83 8.62 12 11 8.76l1-1.36 1 1.36L15.38 12 17 10.83 14.92 8H20v6z"/></svg>
                    </div>
                    <div class="settings-text">
                        Bonus Center
                        <span class="bonus-badge">NEW</span>
                    </div>
                </div>
                <svg class="chevron" viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
            </a>

            <a href="about.html" class="settings-item">
                <div class="settings-left">
                    <div class="settings-icon">
                        <svg viewBox="0 0 24 24"><path d="M11 7h2v2h-2zm0 4h2v6h-2zm1-9C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>
                    </div>
                    <div class="settings-text">About Us</div>
                </div>
                <svg class="chevron" viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
            </a>

            <div class="settings-item" onclick="openPasswordModal()">
                <div class="settings-left">
                    <div class="settings-icon">
                        <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
                    </div>
                    <div class="settings-text">Change Password</div>
                </div>
                <svg class="chevron" viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
            </div>

            <div class="settings-item danger" onclick="logout()">
                <div class="settings-left">
                    <div class="settings-icon">
                        <svg viewBox="0 0 24 24"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
                    </div>
                    <div class="settings-text">Logout</div>
                </div>
            </div>
        </div>
    </main>

    <div class="modal-overlay" id="password-modal">
        <div class="modal-content">
            <h3 class="modal-title">Change Password</h3>
            <input type="password" id="new-password" class="modal-input" placeholder="Enter new password (min 6 chars)">
            <div class="modal-actions">
                <button class="modal-btn cancel" onclick="closePasswordModal()">Cancel</button>
                <button class="modal-btn confirm" onclick="updatePassword()">Update</button>
            </div>
        </div>
    </div>

    <script type="module">
        // LOCKED TO 13.1.0
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
        import { initializeAppCheck, ReCaptchaV3Provider } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app-check.js";
        import { getAuth, onAuthStateChanged, signOut, updatePassword } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc, addDoc, collection, serverTimestamp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBpKp2TePXAmJjc_qR-bJPCZJ123QsCyxw",
            authDomain: "jakipot.firebaseapp.com",
            projectId: "jakipot",
            storageBucket: "jakipot.firebasestorage.app",
            messagingSenderId: "396191754293",
            appId: "1:396191754293:web:5b11a11d82e773d19ee97c",
            measurementId: "G-L1CLB5TDHV"
        };

        const CLOUDINARY = {
            cloudName: 'c2n8j0v',
            uploadPreset: 'doravica_unsigned',
            folder: 'jakipot/profiles'
        };

        const app = initializeApp(firebaseConfig);
        initializeAppCheck(app, { provider: new ReCaptchaV3Provider('6LdTwQsuAAAAAITxU1ur4P5_lw3Qg3pltPqO3D3H'), isTokenAutoRefreshEnabled: true });
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;

        async function logSecurityEvent(event, details = {}) {
            try {
                await addDoc(collection(db, 'security_logs'), {
                    event: event,
                    uid: currentUser?.uid || 'unknown',
                    page: 'profile.html',
                    timestamp: serverTimestamp(),
                    ...details
                });
            } catch (e) { console.warn('Guardian log failed', e); }
        }

        // 1. Auth Guard & Load Data
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.replace('login.html');
                return;
            }
            currentUser = user;

            try {
                const userDoc = await getDoc(doc(db, 'users', user.uid));
                if (userDoc.exists()) {
                    const data = userDoc.data();
                    const name = data.fullName || 'User';
                    
                    document.getElementById('profile-name').innerText = name;
                    document.getElementById('profile-email').innerText = data.email || user.email;
                    
                    if (data.profilePicUrl) {
                        document.getElementById('profile-avatar-container').innerHTML = `<img src="${data.profilePicUrl}" alt="Profile">`;
                    } else {
                        document.getElementById('profile-initial').innerText = name.charAt(0).toUpperCase();
                    }
                }
            } catch (err) {
                console.error('Error fetching profile:', err);
            }
        });

        // 2. Profile Picture Upload
        document.getElementById('profile-upload-input').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file || !currentUser) return;

            if (!['image/jpeg', 'image/jpg', 'image/png'].includes(file.type)) {
                alert('Only JPG, JPEG, or PNG allowed.');
                return;
            }
            if (file.size > 2 * 1024 * 1024) {
                alert('Image too large. Max 2MB.');
                logSecurityEvent('profile_pic_too_large', { size: file.size });
                return;
            }

            const container = document.getElementById('profile-avatar-container');
            const originalContent = container.innerHTML;
            container.innerHTML = `<div class="spinner"></div>`;

            try {
                const formData = new FormData();
                formData.append('file', file);
                formData.append('upload_preset', CLOUDINARY.uploadPreset);
                formData.append('folder', `${CLOUDINARY.folder}/${currentUser.uid}`);

                const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY.cloudName}/image/upload`, {
                    method: 'POST',
                    body: formData
                });
                
                const data = await res.json();
                if (data.secure_url) {
                    await updateDoc(doc(db, 'users', currentUser.uid), {
                        profilePicUrl: data.secure_url,
                        updatedAt: serverTimestamp()
                    });
                    container.innerHTML = `<img src="${data.secure_url}" alt="Profile">`;
                    logSecurityEvent('profile_pic_updated');
                } else {
                    throw new Error('Upload failed');
                }
            } catch (err) {
                console.error(err);
                logSecurityEvent('profile_pic_upload_failed', { reason: err.message });
                alert('Failed to upload image.');
                container.innerHTML = originalContent;
            }
        });

        // 3. Change Password Logic
        window.openPasswordModal = () => {
            document.getElementById('password-modal').classList.add('active');
        };

        window.closePasswordModal = () => {
            document.getElementById('password-modal').classList.remove('active');
            document.getElementById('new-password').value = '';
        };

        window.updatePassword = async () => {
            const newPassword = document.getElementById('new-password').value;
            
            if (!newPassword || newPassword.length < 6) {
                alert('Password must be at least 6 characters long.');
                return;
            }

            try {
                await updatePassword(currentUser, newPassword);
                alert('Password updated successfully!');
                logSecurityEvent('password_updated_successfully');
                closePasswordModal();
            } catch (err) {
                console.error(err);
                logSecurityEvent('password_update_failed', { code: err.code });
                if (err.code === 'auth/requires-recent-login') {
                    alert('Please log out and log back in to change your password for security reasons.');
                } else {
                    alert('Failed to update password. Please try again.');
                }
            }
        };

        // 4. Logout
        window.logout = async () => {
            if(confirm('Are you sure you want to logout?')) {
                await signOut(auth);
                window.location.replace('login.html');
            }
        };
    </script>
</body>
</html>
