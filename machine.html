<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JAKIPOT - Live Market Trend</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #040b16; --bg-panel: rgba(10, 25, 47, 0.95);
            --cyan: #00D9FF; --cyan-glow: rgba(0, 217, 255, 0.3);
            --emerald: #10b981; --danger: #ef4444;
            --text-white: #ffffff; --text-muted: #8b9bb4; --border-light: rgba(255, 255, 255, 0.08);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #000000; color: var(--text-white); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        .top-header { display: flex; align-items: center; justify-content: space-between; padding: 15px 20px; background: #0a0f1a; border-bottom: 1px solid rgba(255,255,255,0.05); z-index: 10; }
        .back-btn { background: transparent; border: none; cursor: pointer; color: var(--text-muted); display: flex; align-items: center; padding: 4px; }
        .back-btn svg { width: 24px; height: 24px; fill: currentColor; }
        .asset-info { display: flex; flex-direction: column; align-items: center; }
        .asset-name { font-size: 16px; font-weight: 800; color: var(--white); display: flex; align-items: center; gap: 8px; }
        .flag-wrap { width: 20px; height: 14px; border-radius: 2px; overflow: hidden; }
        .flag-wrap svg { width: 100%; height: 100%; object-fit: cover; }
        .asset-status { font-size: 11px; font-weight: 700; color: var(--cyan); text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }
        .timer-box { text-align: right; }
        .t-label { font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
        .t-value { font-size: 15px; font-weight: 900; color: var(--text-white); font-variant-numeric: tabular-nums; }

        .graph-area { flex: 1; position: relative; background: #050a12; overflow: hidden; display: flex; flex-direction: column; }
        #graph-canvas { flex: 1; width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        .market-value-display { position: absolute; top: 20px; left: 20px; z-index: 5; }
        .mv-label { font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 4px; }
        .mv-price { font-size: 32px; font-weight: 900; color: var(--text-white); line-height: 1; }
        .mv-change { font-size: 13px; font-weight: 700; color: var(--emerald); margin-top: 4px; display: flex; align-items: center; gap: 4px; }
        .mv-change svg { width: 14px; height: 14px; fill: var(--emerald); }

        .bottom-panel { background: #0a0f1a; padding: 20px; border-top: 1px solid rgba(255,255,255,0.05); flex-shrink: 0; text-align: center; z-index: 10; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 140px; gap: 10px; }
        .status-text { font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 5px; }
        .result-box { display: none; width: 100%; text-align: center; margin-bottom: 5px; }
        .result-box p { font-size: 26px; font-weight: 900; color: var(--text-white); }

        .button-row { display: flex; gap: 10px; width: 100%; justify-content: center; align-items: center; transition: all 0.3s ease; }
        .btn { border-radius: 12px; border: none; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; transition: all 0.3s ease; display: flex; justify-content: center; align-items: center; text-align: center; }
        
        .btn.small { padding: 10px; font-size: 11px; flex: 1; cursor: not-allowed; }
        .btn.big { padding: 18px; font-size: 16px; flex: 2; cursor: pointer; animation: pulse-glow 2s infinite; }

        .btn-red { background: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3); }
        .btn-green { background: rgba(16, 185, 129, 0.1); color: var(--emerald); border: 1px solid rgba(16, 185, 129, 0.3); }
        .btn-red.big { background: var(--danger); color: var(--text-white); border: none; box-shadow: 0 4px 20px rgba(239, 68, 68, 0.5); }
        .btn-green.big { background: var(--emerald); color: var(--text-white); border: none; box-shadow: 0 4px 20px rgba(16, 185, 129, 0.5); }

        @keyframes pulse-glow { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.02); } }
    </style>
</head>
<body>
    <header class="top-header">
        <button class="back-btn" onclick="window.location.href='trending-machine.html'"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
        <div class="asset-info">
            <div class="asset-name"><div class="flag-wrap" id="flag-wrap"></div><span id="asset-name">Loading...</span></div>
            <div class="asset-status" id="asset-status">LIVE MARKET</div>
        </div>
        <div class="timer-box"><div class="t-label">Duration</div><div class="t-value" id="timer-value">00:00:00</div></div>
    </header>

    <div class="graph-area">
        <canvas id="graph-canvas"></canvas>
        <div class="market-value-display">
            <div class="mv-label">Trend Value</div>
            <div class="mv-price" id="market-price">0.00</div>
            <div class="mv-change" id="market-change"><svg viewBox="0 0 24 24"><path d="M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6z"/></svg><span>0.00%</span></div>
        </div>
    </div>

    <div class="bottom-panel">
        <div class="status-text" id="status-text">Market is currently active.</div>
        <div class="result-box" id="result-box"><p id="result-amount">K 0.00</p></div>
        
        <div class="button-row" id="button-row">
            <button class="btn btn-red small" id="btn-red" onclick="claimFunds('red')">FAIR PROFIT<br>(WAITING)</button>
            <button class="btn btn-green small" id="btn-green" onclick="claimFunds('green')">HIGH PROFIT<br>(WAITING)</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, writeBatch, collection, serverTimestamp, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBpKp2TePXAmJjc_qR-bJPCZJ123QsCyxw",
            authDomain: "jakipot.firebaseapp.com",
            projectId: "jakipot",
            storageBucket: "jakipot.firebasestorage.app",
            messagingSenderId: "396191754293",
            appId: "1:396191754293:web:5b11a11d82e773d19ee97c",
            measurementId: "G-L1CLB5TDHV"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let investmentId = null;
        let investmentData = null;
        let canvas, ctx, timerInterval = null, graphInterval = null;
        let isCompleted = false;
        const currencySymbol = 'K'; // Base currency for the graph labels

        let chartPoints = [], currentPrice = 100.00, basePrice = 100.00, momentum = 0, maxPrice = 105.00, minPrice = 95.00;

        function getFlagSVG(code) {
            switch(code) {
                case 'zm': return `<svg viewBox="0 0 60 40"><rect fill="#198a00" width="60" height="40"/><rect fill="#de2010" x="40" y="20" width="15" height="10"/><rect fill="#000" x="40" y="30" width="15" height="10"/><rect fill="#ef7d00" x="40" y="10" width="15" height="10"/></svg>`;
                case 'ng': return `<svg viewBox="0 0 60 40"><rect fill="#008751" width="60" height="40"/><rect fill="#fff" x="20" width="20" height="40"/></svg>`;
                case 'us': return `<svg viewBox="0 0 60 40"><rect fill="#B22234" width="60" height="40"/><rect fill="#fff" y="3" width="60" height="3"/><rect fill="#fff" y="9" width="60" height="3"/><rect fill="#fff" y="15" width="60" height="3"/><rect fill="#fff" y="21" width="60" height="3"/><rect fill="#fff" y="27" width="60" height="3"/><rect fill="#fff" y="33" width="60" height="3"/><rect fill="#3C3B6E" width="24" height="22"/></svg>`;
                default: return `<svg viewBox="0 0 60 40"><circle cx="30" cy="20" r="18" fill="#334155"/><path d="M15,15 Q30,5 45,15 M15,25 Q30,35 45,25" stroke="#fff" stroke-width="2" fill="none"/></svg>`;
            }
        }

        window.addEventListener('load', async () => {
            // 1. Get ID from URL
            const urlParams = new URLSearchParams(window.location.search);
            investmentId = urlParams.get('id');

            if (!investmentId) {
                alert("No active trend found. Redirecting to board.");
                window.location.href = 'trending-machine.html';
                return;
            }

            // 2. Authorize User & Fetch Data
            onAuthStateChanged(auth, async (user) => {
                if (!user) { window.location.replace('login.html'); return; }
                currentUser = user;

                const invRef = doc(db, 'user_trending_investments', investmentId);
                const invSnap = await getDoc(invRef);

                if (!invSnap.exists() || invSnap.data().uid !== user.uid) {
                    alert("Invalid trend or unauthorized access.");
                    window.location.href = 'trending-machine.html';
                    return;
                }

                investmentData = invSnap.data();

                // 3. Setup UI
                document.getElementById('asset-name').innerText = `${investmentData.countryName} Market`;
                document.getElementById('flag-wrap').innerHTML = getFlagSVG(investmentData.countryCode || 'un');

                canvas = document.getElementById('graph-canvas');
                ctx = canvas.getContext('2d');
                resizeCanvas();
                window.addEventListener('resize', resizeCanvas);

                // 4. Start Logic
                checkStatus();
                if (!isCompleted) startGraphEngine();
            });
        });

        function resizeCanvas() {
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);
            canvas.style.width = rect.width + 'px';
            canvas.style.height = rect.height + 'px';
            if (isCompleted) drawFinalGraph(); else drawGraph();
        }

        function checkStatus() {
            const endTime = investmentData.endDate.toMillis();
            const now = Date.now();

            if (now >= endTime) {
                // Completed
                isCompleted = true;
                if (graphInterval) clearInterval(graphInterval);
                if (timerInterval) clearInterval(timerInterval);
                
                document.getElementById('timer-value').innerText = "COMPLETED";
                document.getElementById('timer-value').style.color = "var(--emerald)";
                document.getElementById('asset-status').innerText = "MARKET CLOSED";
                document.getElementById('asset-status').style.color = "var(--text-muted)";
                document.getElementById('status-text').style.display = 'none';
                
                const finalAmount = investmentData.totalClaimable;
                
                document.getElementById('result-box').style.display = 'block';
                document.getElementById('result-amount').innerText = `${currencySymbol} ${finalAmount.toFixed(2)}`;
                
                const btnRed = document.getElementById('btn-red');
                const btnGreen = document.getElementById('btn-green');
                
                // --- LOGIC FOR RED AND GREEN BUTTONS (Threshold 2500) ---
                if (finalAmount <= 2500) {
                    btnRed.className = 'btn btn-red big';
                    btnRed.innerHTML = `CLAIM FAIR PROFIT<br>${currencySymbol}${finalAmount.toFixed(2)}`;
                    btnRed.disabled = false;

                    btnGreen.className = 'btn btn-green small';
                    btnGreen.innerHTML = `HIGH PROFIT<br>(NOT ELIGIBLE)`;
                    btnGreen.disabled = true;
                } else {
                    btnGreen.className = 'btn btn-green big';
                    btnGreen.innerHTML = `CLAIM HIGH PROFIT<br>${currencySymbol}${finalAmount.toFixed(2)}`;
                    btnGreen.disabled = false;

                    btnRed.className = 'btn btn-red small';
                    btnRed.innerHTML = `FAIR PROFIT<br>(NOT ELIGIBLE)`;
                    btnRed.disabled = true;
                }
                
                drawFinalGraph();

            } else {
                startCountdown(endTime);
            }
        }

        function startCountdown(endTime) {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                const diff = endTime - Date.now();
                if (diff <= 0) {
                    clearInterval(timerInterval);
                    checkStatus();
                } else {
                    const d = Math.floor(diff / (1000 * 60 * 60 * 24));
                    const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
                    const m = Math.floor((diff / 1000 / 60) % 60);
                    const s = Math.floor((diff / 1000) % 60);
                    
                    if (d > 0) {
                        document.getElementById('timer-value').innerText = `${d}d ${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
                    } else {
                        document.getElementById('timer-value').innerText = `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
                    }
                }
            }, 1000);
        }

        window.claimFunds = async (buttonType) => {
            if (!isCompleted) return;

            const btnRed = document.getElementById('btn-red');
            const btnGreen = document.getElementById('btn-green');

            if (buttonType === 'red' && btnRed.disabled) return;
            if (buttonType === 'green' && btnGreen.disabled) return;
            
            btnRed.disabled = true;
            btnGreen.disabled = true;
            document.getElementById('status-text').innerText = "Processing claim...";
            document.getElementById('status-text').style.display = 'block';

            try {
                const batch = writeBatch(db);
                
                // 1. Update Investment Status to 'claimed'
                const invRef = doc(db, 'user_trending_investments', investmentId);
                batch.update(invRef, { status: 'claimed' });

                // 2. Add Winnings to Wallet
                const walletRef = doc(db, 'wallets', currentUser.uid);
                const txRef = doc(collection(db, 'transactions'));
                
                batch.update(walletRef, { 
                    balance: increment(investmentData.totalClaimable),
                    lastTxId: txRef.id 
                });

                // 3. Create Ledger Receipt
                batch.set(txRef, {
                    uid: currentUser.uid, type: 'payout', amount: investmentData.totalClaimable, status: 'completed', createdAt: serverTimestamp()
                });

                await batch.commit();

                alert(`Successfully claimed ${currencySymbol}${investmentData.totalClaimable.toFixed(2)}! Funds added to your wallet.`);
                window.location.href = 'trending-machine.html';

            } catch (e) {
                console.error(e);
                alert("Claim failed. Please try again.");
                btnRed.disabled = false;
                btnGreen.disabled = false;
            }
        };

        // --- GRAPH ENGINE ---
        function startGraphEngine() {
            drawGraph();
            graphInterval = setInterval(() => {
                if (isCompleted) return;
                momentum = momentum * 0.85 + (Math.random() - 0.48) * 0.8; 
                currentPrice += momentum;
                if (currentPrice > maxPrice) maxPrice = currentPrice + 2;
                if (currentPrice < minPrice) minPrice = currentPrice - 2;
                chartPoints.push(currentPrice);
                if (chartPoints.length > 150) chartPoints.shift();

                document.getElementById('market-price').innerText = currentPrice.toFixed(2);
                const changePercent = ((currentPrice - basePrice) / basePrice) * 100;
                document.getElementById('market-change').innerHTML = `
                    <svg viewBox="0 0 24 24" style="fill: ${changePercent >= 0 ? 'var(--emerald)' : '#ef4444'}"><path d="M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6z"/></svg>
                    <span style="color: ${changePercent >= 0 ? 'var(--emerald)' : '#ef4444'}">${changePercent.toFixed(2)}%</span>
                `;
                drawGraph();
            }, 1500); 
        }

        function drawGraph() {
            const w = canvas.width / (window.devicePixelRatio || 1);
            const h = canvas.height / (window.devicePixelRatio || 1);
            ctx.clearRect(0, 0, w, h);
            const padX = 10, padTop = 80, padBottom = 30;
            const graphW = w - padX, graphH = h - padTop - padBottom;

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)'; ctx.lineWidth = 1;
            for(let i=0; i<=4; i++) { let y = padTop + (graphH/4)*i; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }

            ctx.fillStyle = 'rgba(255, 255, 255, 0.2)'; ctx.font = '10px Inter'; ctx.textAlign = 'right';
            const priceRange = maxPrice - minPrice;
            for(let i=0; i<=4; i++) { let pLabel = maxPrice - (priceRange/4)*i; let y = padTop + (graphH/4)*i; ctx.fillText(pLabel.toFixed(2), w - 5, y + 10); }

            if (chartPoints.length < 2) return;
            let mapped = chartPoints.map((price, index) => ({ x: padX + (index / 150) * graphW, y: padTop + graphH - ((price - minPrice) / priceRange) * graphH }));

            ctx.beginPath(); ctx.moveTo(mapped[0].x, mapped[0].y);
            for(let i=1; i<mapped.length; i++) ctx.lineTo(mapped[i].x, mapped[i].y);
            const last = mapped[mapped.length - 1];
            ctx.lineTo(last.x, h); ctx.lineTo(mapped[0].x, h); ctx.closePath();
            let grad = ctx.createLinearGradient(0, padTop, 0, h);
            grad.addColorStop(0, 'rgba(0, 217, 255, 0.2)'); grad.addColorStop(1, 'rgba(0, 217, 255, 0)');
            ctx.fillStyle = grad; ctx.fill();

            ctx.beginPath(); ctx.lineJoin = 'round'; ctx.lineCap = 'round';
            ctx.strokeStyle = '#00D9FF'; ctx.lineWidth = 2.5; ctx.shadowBlur = 10; ctx.shadowColor = 'rgba(0, 217, 255, 0.5)';
            ctx.moveTo(mapped[0].x, mapped[0].y); for(let i=1; i<mapped.length; i++) ctx.lineTo(mapped[i].x, mapped[i].y);
            ctx.stroke();

            ctx.beginPath(); ctx.arc(last.x, last.y, 4, 0, Math.PI * 2); ctx.fillStyle = '#ffffff'; ctx.shadowBlur = 15; ctx.shadowColor = '#00D9FF'; ctx.fill(); ctx.shadowBlur = 0;

            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)'; ctx.textAlign = 'center';
            ['1m', '5m', '15m', '1h', '4h'].forEach((label, i) => { let x = padX + (graphW / 4) * i; ctx.fillText(label, x, h - 10); });
        }

        function drawFinalGraph() {
            chartPoints = []; for(let i=0; i<=150; i++) { chartPoints.push(basePrice + (i/150 * 20)); }
            maxPrice = basePrice + 25; minPrice = basePrice - 5;
            document.getElementById('market-price').innerText = chartPoints[chartPoints.length-1].toFixed(2);
            document.getElementById('market-change').innerHTML = `<svg viewBox="0 0 24 24" style="fill: var(--emerald)"><path d="M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6z"/></svg><span style="color: var(--emerald)">+20.00%</span>`;
            drawGraph();
        }
    </script>
</body>
</html>
