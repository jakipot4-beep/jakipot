<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JAKIPOT - Games</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-deep: #060b19;
            --bg-card: #0f172a;
            --bg-elevated: #1e293b;
            --electric-blue: #38bdf8;
            --blue-glow: rgba(56, 189, 248, 0.4);
            --red: #ef4444;
            --red-glow: rgba(239, 68, 68, 0.5);
            --white: #ffffff;
            --text-muted: #94a3b8;
            --border-light: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: var(--bg-deep); 
            color: var(--white); 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 0%, rgba(37, 99, 235, 0.1) 0%, transparent 50%);
            background-attachment: fixed;
        }

        /* RED LOADER OVERLAY */
        .loader-overlay {
            position: fixed; inset: 0;
            background: rgba(4, 11, 22, 0.75); 
            backdrop-filter: blur(8px); 
            z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }
        .loader-overlay.hidden {
            opacity: 0;
            visibility: hidden;
        }
        
        .spinner-red {
            width: 50px; height: 50px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top-color: var(--red);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            box-shadow: 0 0 20px var(--red-glow);
            margin-bottom: 20px;
        }

        .loading-text {
            color: var(--red); 
            font-weight: 900; 
            font-size: 16px; 
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 15px var(--red-glow);
            animation: pulse-text 1.5s infinite alternate;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes pulse-text {
            0% { opacity: 0.7; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1.05); }
        }

        /* HEADER */
        .top-header {
            display: flex; align-items: center; gap: 15px;
            padding: 20px; 
            background: rgba(6, 11, 25, 0.85); 
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-light);
            position: sticky; top: 0; z-index: 50;
        }
        .back-btn {
            background: rgba(255,255,255,0.05); border: 1px solid var(--border-light);
            width: 40px; height: 40px; border-radius: 50%;
            display: grid; place-items: center; cursor: pointer;
            transition: 0.2s; color: var(--white);
            text-decoration: none;
        }
        .back-btn:hover { background: rgba(255,255,255,0.1); }
        .back-btn svg { width: 20px; height: 20px; fill: currentColor; }
        .header-title { font-size: 20px; font-weight: 900; letter-spacing: 0.5px; }

        /* MAIN CONTENT */
        .main-content {
            padding: 25px 15px;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .section-title {
            font-size: 18px; font-weight: 800; color: var(--white);
            margin-bottom: 20px; display: flex; align-items: center; gap: 8px;
            padding-left: 5px;
        }
        .section-title span { color: var(--electric-blue); font-size: 22px; }

        /* ==========================================
           GAMES GRID - 2 COLUMNS EXACTLY
           ========================================== */
        .games-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* 2 columns */
            gap: 15px;
            width: 100%;
        }

        /* GAME CARD */
        .game-card {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            position: relative;
            transition: transform 0.3s, box-shadow 0.3s;
            display: flex; flex-direction: column;
            width: 100%;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.9) translateY(20px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.6), 0 0 20px rgba(56, 189, 248, 0.2);
            border-color: rgba(56, 189, 248, 0.5);
        }

        .game-cover {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-bottom: 2px solid var(--border-light);
        }

        .game-info {
            padding: 12px 8px;
            text-align: center;
            background: linear-gradient(180deg, var(--bg-card) 0%, #0a1122 100%);
        }
        .game-title {
            font-size: 13px; font-weight: 800; color: var(--white);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        
        /* Badges */
        .badge-hot {
            position: absolute; top: 8px; right: 8px;
            background: #fbbf24; color: #000;
            font-size: 9px; font-weight: 900; text-transform: uppercase;
            padding: 4px 8px; border-radius: 6px;
            box-shadow: 0 4px 10px rgba(251, 191, 36, 0.5);
        }
        
        .badge-new {
            position: absolute; top: 8px; right: 8px;
            background: #10b981; color: #fff;
            font-size: 9px; font-weight: 900; text-transform: uppercase;
            padding: 4px 8px; border-radius: 6px;
            box-shadow: 0 4px 10px rgba(16, 185, 129, 0.5);
        }

        /* MODAL OVERLAY */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(4, 11, 22, 0.85);
            backdrop-filter: blur(8px);
            z-index: 100;
            display: flex; justify-content: center; align-items: center;
            opacity: 0; visibility: hidden;
            transition: 0.3s ease;
        }
        .modal-overlay.active {
            opacity: 1; visibility: visible;
        }

        /* MODAL CONTENT */
        .modal-content {
            background: var(--bg-card);
            border: 1px solid var(--electric-blue);
            border-radius: 24px;
            width: 90%; max-width: 340px;
            overflow: hidden;
            text-align: center;
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 40px rgba(56, 189, 248, 0.3);
        }
        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .modal-img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-bottom: 2px solid var(--border-light);
        }

        .modal-body {
            padding: 25px;
        }
        .modal-title {
            font-size: 22px; font-weight: 900; color: var(--white);
            margin-bottom: 25px; text-transform: uppercase; letter-spacing: 1px;
        }

        .modal-actions {
            display: flex; gap: 12px;
        }
        .btn-cancel {
            flex: 1; padding: 16px;
            background: rgba(255,255,255,0.05); color: var(--text-muted);
            border: 1px solid var(--border-light); border-radius: 14px;
            font-size: 15px; font-weight: 800; cursor: pointer;
            transition: 0.2s;
        }
        .btn-cancel:hover { background: rgba(255,255,255,0.1); color: var(--white); }
        
        .btn-play {
            flex: 1; padding: 16px;
            background: linear-gradient(135deg, #38bdf8, #2563eb);
            color: var(--white); border: none; border-radius: 14px;
            font-size: 15px; font-weight: 900; cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 6px 20px var(--blue-glow);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-play:hover { transform: scale(1.05); }
        .btn-play:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <!-- RED LOADER OVERLAY -->
    <div class="loader-overlay" id="loader">
        <div class="spinner-red"></div>
        <div class="loading-text">Loading Games...</div>
    </div>

    <header class="top-header">
        <a href="home.html" class="back-btn">
            <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </a>
        <div class="header-title">Game Center</div>
    </header>

    <main class="main-content">
        <div class="section-title">
            <span>🎮</span> Available Games
        </div>

        <!-- Grid container for 2x3 layout -->
        <div class="games-container" id="games-container">
            <!-- Games render here instantly (behind the loader) -->
        </div>
    </main>

    <!-- GAME MODAL -->
    <div class="modal-overlay" id="game-modal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <img src="" alt="Game Cover" class="modal-img" id="modal-img">
            <div class="modal-body">
                <h3 class="modal-title" id="modal-title">Game Name</h3>
                <div class="modal-actions">
                    <button class="btn-cancel" onclick="closeModal()">Cancel</button>
                    <button class="btn-play" id="modal-play-btn">PLAY NOW</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBpKp2TePXAmJjc_qR-bJPCZJ123QsCyxw",
            authDomain: "jakipot.firebaseapp.com",
            projectId: "jakipot",
            storageBucket: "jakipot.firebasestorage.app",
            messagingSenderId: "396191754293",
            appId: "1:396191754293:web:5b11a11d82e773d19ee97c"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // ==========================================
        // 1. GAME DATA (Updated with your exact filenames)
        // ==========================================
        const gamesData = [
            {
                id: 'fruit-777',
                title: 'Fruit 777',
                image: 'https://images.unsplash.com/photo-1596838132731-3301c3fd4317?q=80&w=600&auto=format&fit=crop',
                link: 'fruit.html', // ✅ Updated
                badge: 'hot'
            },
            {
                id: 'super-spin',
                title: 'Super Spin',
                image: 'https://images.unsplash.com/photo-1606167668584-78701c57f13d?q=80&w=600&auto=format&fit=crop',
                link: 'super_spin.html', // ✅ (Leave this as it was working)
                badge: 'new'
            },
            {
                id: 'lucky-number',
                title: 'Lucky Number Hunt',
                image: 'https://images.unsplash.com/photo-1605870445919-838d190e8e1b?q=80&w=600&auto=format&fit=crop',
                link: 'lucky-number-hunt.html', // ✅ Updated
                badge: ''
            },
            {
                id: 'lucky-target',
                title: 'Lucky Target',
                image: 'https://images.unsplash.com/photo-1511882150382-421056c89033?q=80&w=600&auto=format&fit=crop',
                link: 'lucky-target.html', // ✅ Updated
                badge: ''
            },
            {
                id: 'lucky-treasure',
                title: 'Lucky Treasure',
                image: 'https://images.unsplash.com/photo-1627637454030-5b6c5b42590c?q=80&w=600&auto=format&fit=crop',
                link: 'lucky-treasure.html', // ✅ Updated
                badge: 'hot'
            },
            {
                id: 'animal-spin',
                title: 'Animal Spin',
                image: 'https://images.unsplash.com/photo-1546182990-dffeafbe841d?q=80&w=600&auto=format&fit=crop',
                link: 'animal-spin.html', // ✅ Updated
                badge: ''
            }
        ];

        const container = document.getElementById('games-container');
        const modal = document.getElementById('game-modal');
        const modalImg = document.getElementById('modal-img');
        const modalTitle = document.getElementById('modal-title');
        const modalPlayBtn = document.getElementById('modal-play-btn');

        // ==========================================
        // 2. RENDER GAMES
        // ==========================================
        function renderGames() {
            container.innerHTML = '';
            gamesData.forEach(game => {
                let badgeHtml = '';
                if (game.badge === 'hot') badgeHtml = `<div class="badge-hot">🔥 Hot</div>`;
                if (game.badge === 'new') badgeHtml = `<div class="badge-new">✨ New</div>`;

                const card = document.createElement('div');
                card.className = 'game-card';
                card.innerHTML = `
                    ${badgeHtml}
                    <img src="${game.image}" class="game-cover" alt="${game.title}" loading="lazy">
                    <div class="game-info">
                        <div class="game-title">${game.title}</div>
                    </div>
                `;
                
                card.onclick = () => openModal(game);
                container.appendChild(card);
            });
        }

        renderGames();

        // ==========================================
        // 3. MODAL LOGIC
        // ==========================================
        function openModal(game) {
            modalImg.src = game.image;
            modalTitle.innerText = game.title;
            
            modalPlayBtn.onclick = () => {
                document.getElementById('loader').classList.remove('hidden');
                setTimeout(() => {
                    window.location.href = game.link;
                }, 300);
            };

            modal.classList.add('active');
        }

        window.closeModal = function(e) {
            if (e && e.target !== modal) return;
            modal.classList.remove('active');
        }

        // ==========================================
        // 4. AUTHENTICATION CHECK
        // ==========================================
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.replace('login.html');
                return;
            }
            
            setTimeout(() => {
                const loader = document.getElementById('loader');
                loader.classList.add('hidden');
            }, 800); 
        });
    </script>
</body>
</html>
