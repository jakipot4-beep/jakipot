<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - Jakipot</title>
    <style>
        :root {
            --bg-dark: #060b19; --bg-card: #111827; --emerald: #10b981;
            --emerald-glow: rgba(16, 185, 129, 0.3); --light-blue: #38bdf8;
            --white: #ffffff; --text-muted: #94a3b8; --danger: #ef4444;
            --border-color: #1e293b; --input-bg: #0f172a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: var(--bg-dark); color: var(--white); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; overflow-x: hidden; background-image: radial-gradient(circle at 10% 20%, rgba(16, 185, 129, 0.05) 0%, transparent 40%), radial-gradient(circle at 90% 80%, rgba(56, 189, 248, 0.05) 0%, transparent 40%); }
        .nav-bar { width: 100%; max-width: 450px; display: flex; justify-content: flex-start; align-items: center; margin-top: 10px; margin-bottom: 30px; }
        .back-link { color: var(--text-muted); text-decoration: none; font-size: 14px; display: flex; align-items: center; gap: 5px; }
        .header { text-align: center; margin-bottom: 30px; }
        .logo-svg { width: 80px; height: 80px; filter: drop-shadow(0 0 15px var(--emerald-glow)); margin-bottom: 15px; }
        .header h1 { font-size: 22px; font-weight: 900; color: var(--white); }
        .header p { font-size: 14px; color: var(--light-blue); margin-top: 8px; }
        .card { background: var(--bg-card); padding: 30px 25px; border-radius: 20px; width: 100%; max-width: 450px; box-shadow: 0 15px 35px rgba(0,0,0,0.6); border: 1px solid var(--border-color); }
        .btn-google { width: 100%; padding: 14px; background: var(--white); color: #333; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; transition: opacity 0.2s; }
        .btn-google:disabled { opacity: 0.5; cursor: not-allowed; }
        .google-icon { width: 22px; height: 22px; }
        .divider { display: flex; align-items: center; text-align: center; margin: 25px 0; color: var(--text-muted); font-size: 11px; font-weight: 700; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid var(--border-color); }
        .divider:not(:empty)::before { margin-right: 15px; } .divider:not(:empty)::after { margin-left: 15px; }
        .input-group { position: relative; margin-bottom: 15px; }
        .input-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; fill: var(--text-muted); }
        .input-field { width: 100%; padding: 15px 45px; border-radius: 12px; border: 1.5px solid #334155; background: var(--input-bg); color: var(--white); font-size: 15px; }
        .input-field:focus { outline: none; border-color: var(--emerald); }
        .toggle-password { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; fill: var(--text-muted); cursor: pointer; }
        .forgot-link { display: block; text-align: right; font-size: 12px; color: var(--light-blue); text-decoration: none; margin-top: -5px; margin-bottom: 20px; }
        .btn-continue { width: 100%; padding: 16px; background: var(--emerald); color: var(--white); border: none; border-radius: 12px; font-size: 16px; font-weight: 800; cursor: pointer; transition: opacity 0.2s; }
        .btn-continue:disabled { opacity: 0.5; cursor: not-allowed; }
        .message-box { margin-top: 12px; font-size: 13px; text-align: center; min-height: 18px; }
        .message-box.error { color: var(--danger); }
        .message-box.success { color: var(--emerald); }
        .footer { margin-top: 25px; text-align: center; font-size: 14px; color: var(--text-muted); }
        .footer a { color: var(--light-blue); text-decoration: none; font-weight: 700; }
        
        .version-tag { text-align: center; font-size: 11px; color: #10b981; margin-top: 15px; font-weight: bold; letter-spacing: 1px; background: rgba(16,185,129,0.1); padding: 5px; border-radius: 5px; }

        #loading-overlay { display: none; position: fixed; inset: 0; background: rgba(6,11,25,0.98); z-index: 9999; flex-direction: column; justify-content: center; align-items: center; }
        #loading-overlay.show { display: flex; }
        .flying-bird { font-size: 60px; animation: flyAcross 2s forwards; margin-bottom: 20px; }
        .loading-title { color: var(--white); font-size: 18px; font-weight: 800; margin-bottom: 8px; }
        .loading-text { color: var(--light-blue); font-size: 14px; font-weight: 600; }
        @keyframes flyAcross { 0% { transform: translateX(-100px); } 100% { transform: translateX(100px); } }

        /* Lockout Banner */
        .lockout-banner {
            background: rgba(239, 68, 68, 0.1); border: 1px solid var(--danger);
            border-radius: 10px; padding: 12px; margin-bottom: 15px;
            font-size: 13px; color: #fca5a5; text-align: center;
            font-weight: 600; display: none;
        }
        .lockout-banner.show { display: block; }
    </style>
</head>
<body>
    <div class="nav-bar">
        <a href="index.html" class="back-link">← Back to Home</a>
    </div>

    <div class="header">
        <svg class="logo-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <path d="M10 80 L20 30 L40 50 L50 15 L60 50 L80 30 L90 80 Z" fill="none" stroke="#10b981" stroke-width="6" stroke-linejoin="round"/>
            <circle cx="20" cy="25" r="5" fill="#38bdf8"/><circle cx="50" cy="10" r="5" fill="#38bdf8"/><circle cx="80" cy="25" r="5" fill="#38bdf8"/>
            <line x1="10" y1="85" x2="90" y2="85" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
        </svg>
        <h1>WELCOME BACK</h1>
        <p>Log in to access your JAKIPOT account.</p>
    </div>

    <div class="card">
        <div class="lockout-banner" id="lockout-banner"></div>

        <button class="btn-google" id="google-btn" onclick="loginWithGoogle()">
            <svg class="google-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
            Continue with Google
        </button>

        <div class="divider">OR LOGIN WITH EMAIL</div>

        <form id="login-form" onsubmit="handleEmailLogin(event)">
            <div class="input-group">
                <svg class="input-icon" viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
                <input type="email" id="login-email" class="input-field" placeholder="Enter your email address" required>
            </div>
            <div class="input-group">
                <svg class="input-icon" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
                <input type="password" id="login-password" class="input-field" placeholder="Enter your password" required>
                <svg class="toggle-password" onclick="togglePassword()" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
            </div>
            <a href="#" class="forgot-link" onclick="forgotPassword(event)">Forgot Password?</a>
            <button type="submit" id="submit-btn" class="btn-continue">LOGIN →</button>
            <div id="message-box" class="message-box"></div>
        </form>
        
        <div class="version-tag">Version 5.0 (Live)</div>
    </div>

    <div class="footer">Don't have an account? <a href="register.html">Sign Up</a></div>

    <div id="loading-overlay">
        <div class="flying-bird">🐦</div>
        <div class="loading-title">Authenticating</div>
        <div class="loading-text">Verifying your account...</div>
    </div>

    <script type="module">
        // LOCKED TO 13.1.0
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
        import { initializeAppCheck, ReCaptchaV3Provider } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app-check.js";
        import { getAuth, signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup, sendPasswordResetEmail, signOut } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBpKp2TePXAmJjc_qR-bJPCZJ123QsCyxw",
            authDomain: "jakipot.firebaseapp.com",
            projectId: "jakipot",
            storageBucket: "jakipot.firebasestorage.app",
            messagingSenderId: "396191754293",
            appId: "1:396191754293:web:5b11a11d82e773d19ee97c"
        };

        const app = initializeApp(firebaseConfig);
        
        // App Check with localhost debug
        const isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
        if (isLocal) self.FIREBASE_APPCHECK_DEBUG_TOKEN = true;
        try {
            initializeAppCheck(app, { 
                provider: new ReCaptchaV3Provider('6LdTwQsuAAAAAITxU1ur4P5_lw3Qg3pltPqO3D3H'), 
                isTokenAutoRefreshEnabled: true 
            });
        } catch(e) { console.warn('App Check:', e); }

        const auth = getAuth(app);
        const db = getFirestore(app);

        const msgBox = document.getElementById('message-box');
        const submitBtn = document.getElementById('submit-btn');
        const googleBtn = document.getElementById('google-btn');
        const lockoutBanner = document.getElementById('lockout-banner');

        // 🐕 WATCHDOG: Spam login protection
        let failedAttempts = 0;
        let lockoutUntil = 0;
        const MAX_ATTEMPTS = 5;
        const LOCKOUT_DURATION = 60000; // 60 seconds

        function checkLockout() {
            const now = Date.now();
            if (lockoutUntil > now) {
                const remaining = Math.ceil((lockoutUntil - now) / 1000);
                lockoutBanner.classList.add('show');
                lockoutBanner.innerText = `Too many failed attempts. Please wait ${remaining} seconds.`;
                submitBtn.disabled = true;
                submitBtn.innerText = `WAIT ${remaining}s`;
                return true;
            }
            
            // Lockout expired
            if (lockoutUntil > 0) {
                lockoutUntil = 0;
                failedAttempts = 0;
                lockoutBanner.classList.remove('show');
                submitBtn.disabled = false;
                submitBtn.innerText = 'LOGIN →';
            }
            return false;
        }

        function registerFailedAttempt() {
            failedAttempts++;
            if (failedAttempts >= MAX_ATTEMPTS) {
                lockoutUntil = Date.now() + LOCKOUT_DURATION;
                checkLockout();
                
                // Auto-clear lockout display
                setInterval(() => {
                    if (!checkLockout()) {
                        // Stop checking once lockout clears
                    }
                }, 1000);
            }
        }

        // ==========================================
        // 🎯 SMART ROUTING (based on user status)
        // ==========================================
        async function routeUser(user) {
            try {
                const docRef = doc(db, 'users', user.uid);
                const docSnap = await getDoc(docRef);

                // New user with no profile → send to complete registration
                if (!docSnap.exists()) {
                    showError("No account profile found. Redirecting to signup...");
                    setTimeout(() => window.location.replace('register.html'), 1500);
                    return;
                }

                const data = docSnap.data();

                // Block suspended users
                if (data.status === 'suspended') {
                    await signOut(auth);
                    showError("Your account has been suspended. Please contact support.");
                    document.getElementById('loading-overlay').classList.remove('show');
                    return;
                }

                // 📊 Update lastActive for admin tracking (silent fail OK)
                try {
                    await updateDoc(docRef, { lastActive: serverTimestamp() });
                } catch (e) {
                    console.warn('Could not update lastActive:', e.message);
                }

                // 👑 Admin routing (FIXED: admin.html not admin-dashboard.html)
                if (data.role === 'admin') {
                    window.location.replace('admin.html');
                    return;
                }

                // 🎯 Route by user state
                if (data.status === 'activated') {
                    window.location.replace('home.html');
                } else if (data.status === 'pending_review') {
                    // Waiting for admin to review activation payment
                    window.location.replace('pay.html');
                } else if (data.status === 'approved') {
                    // Approved but hasn't entered verification code yet
                    window.location.replace('pay.html');
                } else if (data.signupStage === 'proof' || data.signupStage === 'kyc') {
                    // Abandoned signup at KYC step
                    window.location.replace('proof.html');
                } else if (data.signupStage === 'password_setup') {
                    // Abandoned signup at PIN setup
                    window.location.replace('password-set-up.html');
                } else if (data.signupStage === 'payment' || data.signupStage === 'payment_submitted') {
                    // Abandoned signup at payment step
                    window.location.replace('pay.html');
                } else if (data.signupStage === 'verified' || data.status === 'incomplete') {
                    // Incomplete profile → continue from register2
                    window.location.replace('register2.html');
                } else {
                    // Fallback: go to home
                    window.location.replace('home.html');
                }
            } catch (err) {
                console.error('Routing error:', err);
                showError("Connection error. Please check your internet and try again.");
                document.getElementById('loading-overlay').classList.remove('show');
                submitBtn.disabled = false;
                submitBtn.innerText = 'LOGIN →';
                googleBtn.disabled = false;
            }
        }

        // ==========================================
        // UI ACTIONS
        // ==========================================
        window.togglePassword = () => {
            const pwdInput = document.getElementById('login-password');
            pwdInput.type = pwdInput.type === 'password' ? 'text' : 'password';
        };

        window.loginWithGoogle = async () => {
            if (checkLockout()) return;
            
            msgBox.className = 'message-box'; 
            msgBox.innerText = "";
            
            googleBtn.disabled = true;
            const originalHTML = googleBtn.innerHTML;
            googleBtn.innerHTML = '<span style="opacity:0.6">Connecting...</span>';

            const provider = new GoogleAuthProvider();
            provider.setCustomParameters({ prompt: 'select_account' });

            try {
                const result = await signInWithPopup(auth, provider);
                document.getElementById('loading-overlay').classList.add('show');
                await routeUser(result.user);
            } catch (error) {
                googleBtn.disabled = false;
                googleBtn.innerHTML = originalHTML;
                
                if (error.code === 'auth/popup-closed-by-user' || error.code === 'auth/cancelled-popup-request') {
                    showError('Sign-in cancelled.');
                } else if (error.code === 'auth/popup-blocked') {
                    showError('Popup blocked. Please allow popups for this site.');
                } else {
                    showError(error.message || 'Google login failed.');
                }
            }
        };

        window.handleEmailLogin = async (e) => {
            e.preventDefault();
            if (checkLockout()) return;
            
            msgBox.className = 'message-box'; 
            msgBox.innerText = "";
            
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;

            if (!email || !password) { 
                showError('Please fill in all fields.'); 
                return; 
            }

            submitBtn.disabled = true; 
            submitBtn.innerText = 'LOGGING IN...';

            try {
                const result = await signInWithEmailAndPassword(auth, email, password);
                failedAttempts = 0; // Reset on success
                document.getElementById('loading-overlay').classList.add('show');
                await routeUser(result.user);
            } catch (error) {
                submitBtn.disabled = false; 
                submitBtn.innerText = 'LOGIN →';
                registerFailedAttempt();
                
                if (error.code === 'auth/invalid-credential' || error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found') {
                    showError(`Invalid email or password. (${MAX_ATTEMPTS - failedAttempts} attempts left)`);
                } else if (error.code === 'auth/too-many-requests') {
                    showError('Too many attempts. Please wait and try again later.');
                } else {
                    showError(error.message || 'Login failed. Please try again.');
                }
            }
        };

        window.forgotPassword = async (e) => {
            e.preventDefault();
            msgBox.className = 'message-box'; 
            msgBox.innerText = "";
            
            const email = document.getElementById('login-email').value.trim();
            if (!email) { 
                showError('Please enter your email address first.'); 
                return; 
            }
            
            try {
                await sendPasswordResetEmail(auth, email);
                msgBox.className = 'message-box success'; 
                msgBox.innerText = 'Password reset link sent! Check your inbox.';
            } catch (error) {
                showError('Failed to send reset email. Check the email address.');
            }
        };

        function showError(msg) { 
            msgBox.className = 'message-box error'; 
            msgBox.innerText = msg; 
        }

        // Clear error on input
        ['login-email', 'login-password'].forEach(id => {
            document.getElementById(id).addEventListener('input', () => { 
                msgBox.innerText = ""; 
            });
        });
    </script>
</body>
</html>
